name: "🚀 Build Kernel - xcalibur with KernelSU"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build (remove cache)'
        required: false
        default: 'false'
      skip_apk:
        description: 'Skip APK download'
        required: false
        default: 'false'

env:
  # Basic settings
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  # Directory structure
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # File names
  KERNEL_ZIP_NAME: "xcalibur-ksu-${{ github.run_number }}-${{ env.DEVICE_CODENAME }}.zip"
  APK_NAME: "KernelSU_Manager_v1.1.1.apk"
  
  # KernelSU Configuration
  KSU_KERNEL_BRANCH: "stable-1134"
  KSU_APK_URL: "https://github.com/tiann/KernelSU/releases/download/v1.1.1/KernelSU_v1.1.1_12174-release.apk"
  
  # Build settings
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  TOOLCHAIN_PREFIX: "aarch64-linux-gnu-"
  JOBS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    # ==================== 1. Initialization ====================
    - name: "Start Build"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║   🚀 Building Kernel with KernelSU                  ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ Device: ${{ env.DEVICE_CODENAME }}                  "
        echo "║ Kernel: ${{ env.KERNEL_NAME }}                      "
        echo "║ Build:  #${{ github.run_number }}                   "
        echo "╚══════════════════════════════════════════════════════╝"

    - name: "Checkout Sources"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # ==================== 2. Clean Environment ====================
    - name: "Clean Build"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "Cleaning previous build..."
        rm -rf ${{ env.OUTPUT_DIR }} ${{ env.ANYKERNEL_DIR }} ${{ env.TOOLCHAIN_DIR }}
        make clean && make mrproper
        echo "Clean completed"

    # ==================== 3. Install Dependencies ====================
    - name: "Install Dependencies"
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
          make python3 wget zip default-jre \
          zlib1g-dev libncurses-dev \
          libxml2-utils xxd rsync patchelf
        
        # Setup ccache
        mkdir -p ~/.ccache
        echo "max_size = 2G" > ~/.ccache/ccache.conf
        echo "Dependencies installed"

    # ==================== 4. Setup Toolchain ====================
    - name: "Setup Toolchain"
      id: setup_toolchain
      run: |
        echo "Setting up toolchain..."
        
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "Downloading Clang..."
          wget -q ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
          
          echo "Extracting..."
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f clang.tar.gz
          
          echo "Clang installed"
        else
          echo "Clang already exists"
        fi
        
        # Add to PATH
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH

    # ==================== 5. Install KernelSU ====================
    - name: "Install KernelSU"
      id: install_ksu
      run: |
        echo "Installing KernelSU..."
        
        # Remove old if exists
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # Download KernelSU
        echo "Downloading KernelSU (${{ env.KSU_KERNEL_BRANCH }})..."
        git clone https://github.com/KernelSU-Next/KernelSU.git \
          --depth=1 \
          --branch "${{ env.KSU_KERNEL_BRANCH }}" \
          /tmp/kernelsu
        
        # Copy files
        mkdir -p drivers/kernelsu
        cp -rf /tmp/kernelsu/kernel/* drivers/kernelsu/
        
        # Verify
        if [ -f "drivers/kernelsu/core.c" ]; then
          echo "KernelSU installed successfully"
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
        else
          echo "Failed to install KernelSU"
          echo "ksu_installed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # Cleanup
        rm -rf /tmp/kernelsu

    # ==================== 6. Apply KernelSU Patches ====================
    - name: "Apply KernelSU Patches"
      if: steps.install_ksu.outputs.ksu_installed == 'true'
      run: |
        echo "Applying KernelSU patches..."
        
        # Download patches
        git clone https://github.com/KernelSU-Next/kernel_patches.git \
          --depth=1 \
          /tmp/kernel-patches
        
        # Apply basic patches
        PATCHES=(
          "0001-non-gki-core.patch"
          "0002-non-gki-hooks.patch"
          "0003-non-gki-modules.patch"
        )
        
        SUCCESS_COUNT=0
        
        for patch in "${PATCHES[@]}"; do
          PATCH_FILE="/tmp/kernel-patches/non-gki/$patch"
          if [ -f "$PATCH_FILE" ]; then
            echo "Applying: $patch"
            if patch -p1 --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "  Applied"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "  Failed"
            fi
          fi
        done
        
        echo "Applied $SUCCESS_COUNT/3 patches"

    # ==================== 7. Configure Kernel ====================
    - name: "Configure Kernel"
      run: |
        echo "Configuring kernel..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # Create initial config
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # Add KernelSU config
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'

# KernelSU Configuration
CONFIG_KSU=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_EXFAT_SUPPORT=y
EOF
        
        # Update config
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        echo "Kernel configured"

    # ==================== 8. Compile Kernel ====================
    - name: "Compile Kernel"
      id: compile_kernel
      run: |
        echo "Starting kernel compilation..."
        
        # Compile kernel
        make -j${{ env.JOBS }} \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="clang" \
          CROSS_COMPILE="${{ env.TOOLCHAIN_PREFIX }}" \
          LLVM=1
        
        # Check success
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          echo "Compilation successful"
          echo "compile_status=success" >> $GITHUB_OUTPUT
        else
          echo "Compilation failed"
          echo "compile_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

    # ==================== 9. Download KernelSU APK ====================
    - name: "Download KernelSU APK"
      if: steps.compile_kernel.outputs.compile_status == 'success' && github.event.inputs.skip_apk != 'true'
      run: |
        echo "Downloading KernelSU APK..."
        mkdir -p ${{ env.RELEASES_DIR }}
        
        wget -q "${{ env.KSU_APK_URL }}" -O "${{ env.RELEASES_DIR }}/${{ env.APK_NAME }}"
        echo "APK downloaded"

    # ==================== 10. Setup AnyKernel3 ====================
    - name: "Setup AnyKernel3"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "Preparing AnyKernel3..."
        
        rm -rf ${{ env.ANYKERNEL_DIR }}
        
        # Download AnyKernel3
        git clone https://github.com/Joker-V2/AnyKernel3 \
          -b master \
          ${{ env.ANYKERNEL_DIR }}
        
        # Copy kernel image
        cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" "${{ env.ANYKERNEL_DIR }}/"
        echo "AnyKernel3 ready"

    # ==================== 11. Create ZIP Package ====================
    - name: "Create ZIP Package"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "Creating flashable ZIP..."
        
        cd "${{ env.ANYKERNEL_DIR }}"
        zip -r9 "../${{ env.KERNEL_ZIP_NAME }}" ./* > /dev/null
        cd ..
        
        mkdir -p "${{ env.RELEASES_DIR }}"
        mv "${{ env.KERNEL_ZIP_NAME }}" "${{ env.RELEASES_DIR }}/"
        echo "ZIP created"

    # ==================== 12. Upload Artifacts ====================
    - name: "Upload Build Artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          ${{ env.RELEASES_DIR }}/*
        retention-days: 30

    # ==================== 13. Build Summary ====================
    - name: "Build Summary"
      if: always()
      run: |
        echo ""
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║                 Build Summary                       ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ Status: ${{ steps.compile_kernel.outputs.compile_status == 'success' && 'SUCCESS' || 'FAILED' }}"
        echo "║ Kernel: ${{ env.KERNEL_NAME }}                      "
        echo "║ Device: ${{ env.DEVICE_CODENAME }}                  "
        echo "╚══════════════════════════════════════════════════════╝"
