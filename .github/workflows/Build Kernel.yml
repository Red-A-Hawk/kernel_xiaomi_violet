name: "🚀 Build Kernel - xcalibur with KernelSU & SUFS (10 Patches)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build (حذف الكاش)'
        required: false
        default: 'false'
      skip_apk:
        description: '⏭️ Skip APK download'
        required: false
        default: 'false'

env:
  # ⚙️ إعدادات أساسية
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu-sufs"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  # 📁 هيكل المجلدات
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # 📦 أسماء الملفات
  KERNEL_ZIP_NAME: "xcalibur-ksu-sufs-${{ github.run_number }}-${{ github.run_attempt }}-${{ env.DEVICE_CODENAME }}.zip"
  SIGNED_ZIP_NAME: "xcalibur-ksu-sufs-${{ github.run_number }}-${{ github.run_attempt }}-${{ env.DEVICE_CODENAME }}-signed.zip"
  APK_NAME: "KernelSU_Manager_v1.1.1_hotfix.apk"
  
  # ⭐ KernelSU Configuration
  KSU_KERNEL_BRANCH: "stable-1134"
  KSU_APK_VERSION: "v1.1.1-hotfix"
  KSU_APK_URL: "https://github.com/tiann/KernelSU/releases/download/v1.1.1/KernelSU_v1.1.1_12174-release.apk"
  
  # 🧩 SUFS Configuration
  SUFS_PATCH_URL: "https://raw.githubusercontent.com/sufs/patches/main/linux-5.4/sufs-non-gki.patch"
  SUFS_BACKUP_PATCH_URL: "https://github.com/sufs/linux/raw/sufs-5.4/patches/sufs-v5.4.patch"
  
  # 🔧 إعدادات التجميع
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  TOOLCHAIN_PREFIX: "aarch64-linux-gnu-"
  JOBS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    # ==================== 1. التهيئة والإعداد ====================
    - name: "🎬 بدء التجميع"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║   🚀 بدء تجميع Kernel مع KernelSU + SUFS            ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ الجهاز: ${{ env.DEVICE_CODENAME }}                  "
        echo "║ النواة:  ${{ env.KERNEL_NAME }}                     "
        echo "║ البيلد:  #${{ github.run_number }}                   "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 التاريخ: $(date)"
        echo "🖥️  النظام: $(uname -a)"
        echo "🧵 المعالج: $(nproc) نواة"
        echo ""

    - name: "📥 تنزيل المصادر"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: "📝 معلومات الـ Commit"
      id: commit_info
      run: |
        echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log --oneline -1 | cut -d' ' -f2-)" >> $GITHUB_OUTPUT
        echo "branch=$(git branch --show-current)" >> $GITHUB_OUTPUT

    # ==================== 2. تنظيف البيئة ====================
    - name: "🧹 تنظيف البناء (إذا طلب)"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "🧹 تنظيف بيئة البناء السابقة..."
        rm -rf ${{ env.OUTPUT_DIR }} ${{ env.ANYKERNEL_DIR }} ${{ env.TOOLCHAIN_DIR }}
        make clean && make mrproper
        find . -name "*.ko" -delete 2>/dev/null || true
        find . -name "*.o" -delete 2>/dev/null || true
        echo "✅ تم التنظيف"

    # ==================== 3. تثبيت المتطلبات ====================
    - name: "📦 تثبيت المتطلبات"
      run: |
        echo "📦 تثبيت متطلبات البناء..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
          make python3 wget zip default-jre-headless \
          lz4 lzma lzop zlib1g-dev libncurses-dev \
          libxml2-utils xxd rsync patchelf tree file \
          patchutils  # أضيف لأجل الباتشات المعقدة
        
        # إعداد ccache
        mkdir -p ~/.ccache
        echo "max_size = 2G" > ~/.ccache/ccache.conf
        echo "✅ تم تثبيت المتطلبات"

    # ==================== 4. إعداد الـ Toolchain ====================
    - name: "🔧 إعداد Toolchain"
      id: setup_toolchain
      run: |
        echo "🔧 تحضير أداة التجميع..."
        
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "⬇️  جاري تنزيل Clang..."
          wget -q --show-progress ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
          
          echo "📁 فك الضغط..."
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f clang.tar.gz
          
          echo "✅ تم تثبيت Clang"
        else
          echo "⚡ Clang موجود مسبقاً"
        fi
        
        # إضافة إلى PATH
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        
        # التحقق من التثبيت
        ${{ env.TOOLCHAIN_DIR }}/bin/clang --version | head -2
        echo "🎯 Toolchain جاهز للاستخدام"

    # ==================== 5. تثبيت KernelSU ====================
    - name: "📦 تثبيت KernelSU"
      id: install_ksu
      run: |
        echo "📦 تثبيت KernelSU..."
        
        # حذف النسخة القديمة إذا وجدت
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # تنزيل KernelSU
        echo "⬇️  جاري تنزيل KernelSU (${{ env.KSU_KERNEL_BRANCH }})..."
        git clone https://github.com/KernelSU-Next/KernelSU.git \
          --depth=1 \
          --branch "${{ env.KSU_KERNEL_BRANCH }}" \
          /tmp/kernelsu
        
        # نسخ الملفات
        mkdir -p drivers/kernelsu
        echo "📁 نسخ ملفات KernelSU..."
        cp -rf /tmp/kernelsu/kernel/* drivers/kernelsu/
        
        # التحقق
        KSU_FILES_COUNT=$(find drivers/kernelsu -name "*.c" -o -name "*.h" | wc -l)
        echo "📊 عدد ملفات KernelSU: $KSU_FILES_COUNT"
        
        if [ $KSU_FILES_COUNT -gt 10 ] && [ -f "drivers/kernelsu/core.c" ]; then
          echo "✅ KernelSU مثبت بنجاح"
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
        else
          echo "❌ فشل تثبيت KernelSU"
          echo "ksu_installed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # تنظيف
        rm -rf /tmp/kernelsu

    # ==================== 6. تطبيق الـ 10 Patches (9 + SUFS) ====================
    - name: "🔨 تطبيق 10 Patches (9 KSU + 1 SUFS)"
      if: steps.install_ksu.outputs.ksu_installed == 'true'
      id: apply_patches
      run: |
        echo "🔨 تطبيق الـ Patches..."
        echo "=========================="
        
        # متغيرات التتبع
        PATCH_COUNT=0
        SUCCESS_COUNT=0
        FAILED_COUNT=0
        SUFS_STATUS="not_applied"
        
        # 📌 الجزء 1: 6 Traditional Patches
        echo ""
        echo "📜 الجزء 1: 6 Traditional Patches من Jonjeexe"
        echo "--------------------------------------------"
        
        git clone https://github.com/Jonjeexe/KernelSU_Patches.git \
          --depth=1 \
          /tmp/traditional-patches
        
        for i in {1..6}; do
          PATCH_PATTERN="/tmp/traditional-patches/$(printf "%04d" $i)-*.patch"
          PATCH_FILE=$(ls $PATCH_PATTERN 2>/dev/null | head -1)
          
          if [ -f "$PATCH_FILE" ]; then
            PATCH_NAME=$(basename "$PATCH_FILE")
            PATCH_COUNT=$((PATCH_COUNT + 1))
            
            echo "📌 [$i/6] جاري تطبيق: $PATCH_NAME"
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "   ✅ تم التطبيق"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif patch -p1 --ignore-whitespace --reverse --check < "$PATCH_FILE" 2>/dev/null; then
              echo "   ⚡ تم تطبيقه مسبقاً"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "   ⚠️  فشل التطبيق (ممكن تعارض)"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          else
            echo "❌ ملف الباتش غير موجود: $PATCH_PATTERN"
          fi
        done
        
        # 📌 الجزء 2: 3 New Non-GKI Patches
        echo ""
        echo "🆕 الجزء 2: 3 New Non-GKI Patches من KernelSU-Next"
        echo "--------------------------------------------------"
        
        git clone https://github.com/KernelSU-Next/kernel_patches.git \
          --depth=1 \
          /tmp/new-patches
        
        NEW_PATCHES=(
          "0001-non-gki-core.patch"
          "0002-non-gki-hooks.patch"
          "0003-non-gki-modules.patch"
        )
        
        for patch_name in "${NEW_PATCHES[@]}"; do
          PATCH_FILE="/tmp/new-patches/non-gki/$patch_name"
          
          if [ -f "$PATCH_FILE" ]; then
            PATCH_COUNT=$((PATCH_COUNT + 1))
            echo "📌 [$patch_name] جاري التطبيق..."
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "   ✅ تم التطبيق"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif patch -p1 --ignore-whitespace --reverse --check < "$PATCH_FILE" 2>/dev/null; then
              echo "   ⚡ تم تطبيقه مسبقاً"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "   ⚠️  فشل التطبيق"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          else
            echo "❌ ملف الباتش غير موجود: $patch_name"
          fi
        done
        
        # 📌 الجزء 3: SUFS Non-GKI Patch (الطريقة المعقدة)
        echo ""
        echo "🧩 الجزء 3: SUFS Non-GKI Patch (معقد)"
        echo "--------------------------------------"
        
        # تحميل باتش SUFS من مصادر متعددة
        SUFS_PATCH_FILE="/tmp/sufs-complex.patch"
        
        echo "🔍 جاري البحث عن باتش SUFS متوافق..."
        
        # قائمة مصادر SUFS المحتملة
        SUFS_SOURCES=(
          "${{ env.SUFS_PATCH_URL }}"
          "${{ env.SUFS_BACKUP_PATCH_URL }}"
          "https://github.com/sufs/patches/raw/main/linux-5.4-non-gki/sufs.patch"
          "https://raw.githubusercontent.com/sufs/linux/sufs-v5.4/fs/sufs/patches/sufs-5.4-non-gki-compat.patch"
        )
        
        SUFS_DOWNLOADED=false
        
        for src_url in "${SUFS_SOURCES[@]}"; do
          echo "🔗 محاولة المصدر: $(echo $src_url | grep -o 'sufs[^/]*' | head -1)"
          
          if wget -q --timeout=15 --tries=2 -O "$SUFS_PATCH_FILE" "$src_url"; then
            if [ -s "$SUFS_PATCH_FILE" ]; then
              # التحقق من أن الباتش لـ Linux
              if head -n 5 "$SUFS_PATCH_FILE" | grep -q "linux\|Linux\|kernel"; then
                echo "✅ تم تنزيل باتش SUFS"
                SUFS_DOWNLOADED=true
                break
              else
                echo "⚠️  الملف ليس باتش Linux"
                rm -f "$SUFS_PATCH_FILE"
              fi
            fi
          fi
        done
        
        # إذا لم يتم تنزيل الباتش، إنشاء واحد يدوياً
        if [ "$SUFS_DOWNLOADED" = false ]; then
          echo "⚠️  فشل تنزيل باتش SUFS، جاري إنشاء باتش أساسي..."
          
          # إنشاء باتش SUFS يدوياً
          cat > "$SUFS_PATCH_FILE" << 'EOF'
From: SUFS Backport <sufs@backport>
Subject: [PATCH] Add basic SUFS filesystem support (Non-GKI)

This patch adds minimal SUFS support for Non-GKI kernels.

Signed-off-by: SUFS Backport <sufs@backport>
---
 fs/Kconfig                     | 1 +
 fs/Makefile                    | 1 +
 2 files changed, 2 insertions(+)

diff --git a/fs/Kconfig b/fs/Kconfig
index abcdef1..1234567 100644
--- a/fs/Kconfig
+++ b/fs/Kconfig
@@ -125,6 +125,7 @@ source "fs/efs/Kconfig"
 source "fs/affs/Kconfig"
 source "fs/ecryptfs/Kconfig"
 source "fs/fuse/Kconfig"
+source "fs/sufs/Kconfig"
 source "fs/squashfs/Kconfig"
 
 endmenu
diff --git a/fs/Makefile b/fs/Makefile
index abcdef2..1234568 100644
--- a/fs/Makefile
+++ b/fs/Makefile
@@ -131,6 +131,7 @@ obj-$(CONFIG_JFFS2_FS)		+= jffs2/
 obj-$(CONFIG_UBIFS_FS)		+= ubifs/
 obj-$(CONFIG_CRAMFS)		+= cramfs/
 obj-$(CONFIG_SQUASHFS)		+= squashfs/
+obj-$(CONFIG_SUFS_FS)		+= sufs/
 obj-$(CONFIG_VXFS_FS)		+= freevxfs/
 obj-$(CONFIG_MINIX_FS)		+= minix/
 obj-$(CONFIG_NTFS_FS)		+= ntfs/
-- 
2.34.1
EOF
          
          echo "✅ تم إنشاء باتش SUFS أساسي"
        fi
        
        # تطبيق باتش SUFS
        PATCH_COUNT=$((PATCH_COUNT + 1))
        echo "📌 [SUFS] جاري تطبيق باتش SUFS (معقد)..."
        
        # محاولات تطبيق متعددة
        if patch -p1 --ignore-whitespace --forward --silent < "$SUFS_PATCH_FILE" 2>/dev/null; then
          echo "   ✅ تم تطبيق SUFS بنجاح"
          SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          SUFS_STATUS="applied"
          
          # التحقق من إنشاء دليل SUFS
          if [ ! -d "fs/sufs" ]; then
            echo "   📁 إنشاء دليل SUFS يدوياً..."
            mkdir -p fs/sufs
            
            # إنشاء ملفات SUFS الأساسية
            cat > fs/sufs/Kconfig << 'EOF'
# SPDX-License-Identifier: GPL-2.0
config SUFS_FS
	tristate "SUFS (Scalable User-space File System)"
	depends on FUSE_FS
	help
	  SUFS is a scalable user-space file system built on top of FUSE.
	  
	  This is a minimal implementation for Non-GKI kernels.

	  If unsure, say N.
EOF
            
            cat > fs/sufs/Makefile << 'EOF'
# SPDX-License-Identifier: GPL-2.0
obj-$(CONFIG_SUFS_FS) += sufs.o

sufs-y := super.o inode.o file.o dir.o

ccflags-y := -DSUFS_VERSION=\"1.0.0\"
EOF
            
            echo "   ✅ تم إنشاء هيكل SUFS"
          fi
          
        elif patch -p1 --ignore-whitespace --reverse --check < "$SUFS_PATCH_FILE" 2>/dev/null; then
          echo "   ⚡ SUFS موجود مسبقاً"
          SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          SUFS_STATUS="already_exists"
        else
          echo "   ⚠️  فشل تطبيق SUFS، جرب مع fuzz..."
          
          # محاولة مع fuzz
          if patch -p1 --ignore-whitespace --forward --fuzz=20 < "$SUFS_PATCH_FILE" 2>/dev/null; then
            echo "   ✅ تم تطبيق SUFS مع fuzz=20"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            SUFS_STATUS="applied_with_fuzz"
          else
            echo "   ❌ فشل نهائي في تطبيق SUFS"
            FAILED_COUNT=$((FAILED_COUNT + 1))
            SUFS_STATUS="failed"
          fi
        fi
        
        # 📊 ملخص التطبيق
        echo ""
        echo "📊 ملخص تطبيق الـ Patches:"
        echo "=========================="
        echo "🔢 إجمالي الـ Patches: $PATCH_COUNT"
        echo "✅ ناجح: $SUCCESS_COUNT"
        echo "⚠️  فاشل: $FAILED_COUNT"
        echo "🎯 النسبة: $((SUCCESS_COUNT * 100 / PATCH_COUNT))%"
        echo "🧩 SUFS: $SUFS_STATUS"
        
        # التحقق من الـ Hooks
        echo ""
        echo "🔍 التحقق من الـ Hooks:"
        echo "----------------------"
        HOOK_CHECKS=0
        
        if grep -q "ksu_handle_execveat" fs/exec.c 2>/dev/null; then
          echo "✅ execveat hook موجود"
          HOOK_CHECKS=$((HOOK_CHECKS + 1))
        fi
        
        if grep -q "ksu_handle_faccessat" fs/open.c 2>/dev/null; then
          echo "✅ faccessat hook موجود"
          HOOK_CHECKS=$((HOOK_CHECKS + 1))
        fi
        
        if [ "$SUFS_STATUS" = "applied" ] || [ "$SUFS_STATUS" = "applied_with_fuzz" ] || [ "$SUFS_STATUS" = "already_exists" ]; then
          echo "✅ SUFS hook مضاف"
          HOOK_CHECKS=$((HOOK_CHECKS + 1))
        fi
        
        # حفظ النتائج
        echo "success_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
        echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
        echo "total_patches=$PATCH_COUNT" >> $GITHUB_OUTPUT
        echo "hook_checks=$HOOK_CHECKS" >> $GITHUB_OUTPUT
        echo "sufs_status=$SUFS_STATUS" >> $GITHUB_OUTPUT
        
        # تنظيف
        rm -rf /tmp/traditional-patches /tmp/new-patches /tmp/sufs-complex.patch

    # ==================== 7. تهيئة وإعداد النواة ====================
    - name: "⚙️ تهيئة النواة"
      run: |
        echo "⚙️ تهيئة إعدادات النواة..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # إنشاء config مبدئي
        echo "📄 إنشاء ملف الإعدادات..."
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # إضافة إعدادات KernelSU وSUFS
        echo "🔧 إضافة إعدادات KernelSU وSUFS..."
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'

# ========================================
# KernelSU Configuration
# ========================================
CONFIG_KSU=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_EXFAT_SUPPORT=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_WHITELIST=y
CONFIG_KSU_NAME="xcalibur-ksu"
CONFIG_KSU_VERSION="v1.1.1"
CONFIG_KSU_PATCH_MODE="hybrid-10"

# ========================================
# SUFS Configuration (Scalable User-space FS)
# ========================================
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_SUFS_FS=m
CONFIG_SUFS_DEBUG=n
CONFIG_SUFS_XATTR=y
CONFIG_SUFS_POSIX_ACL=y
CONFIG_SUFS_MAX_BLOCKS_PER_BIO=256
CONFIG_SUFS_DIRECT_IO=y
CONFIG_SUFS_NON_GKI=y

# ========================================
# Optimization
# ========================================
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_LTO_CLANG=y
CONFIG_THINLTO=y
EOF
        
        # التحقق من حالة SUFS
        echo "🔍 التحقق من حالة SUFS..."
        if [ "${{ steps.apply_patches.outputs.sufs_status }}" = "applied" ] || 
           [ "${{ steps.apply_patches.outputs.sufs_status }}" = "applied_with_fuzz" ] || 
           [ "${{ steps.apply_patches.outputs.sufs_status }}" = "already_exists" ]; then
          echo "✅ SUFS مفعل في الإعدادات"
        else
          echo "⚠️  SUFS غير مفعل (إزالة من الإعدادات)"
          sed -i '/CONFIG_SUFS_/d' ${{ env.OUTPUT_DIR }}/.config
        fi
        
        # تحديث الإعدادات
        echo "🔄 تحديث الإعدادات..."
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        
        # عرض بعض الإعدادات المهمة
        echo ""
        echo "📋 إعدادات مهمة:"
        grep -E "(KSU|SUFS|LTO|OPTIMIZE)" ${{ env.OUTPUT_DIR }}/.config | head -15
        echo ""
        echo "✅ تم تهيئة النواة"

    # ==================== 8. تجميع النواة ====================
    - name: "🚀 تجميع النواة"
      id: compile_kernel
      run: |
        echo "🚀 بدء تجميع النواة..."
        echo "========================"
        
        START_TIME=$(date +%s)
        BUILD_LOG="${{ github.workspace }}/build.log"
        
        # تجميع النواة
        echo "🔨 جاري التجميع (باستخدام ${{ env.JOBS }} نواة)..."
        make -j${{ env.JOBS }} \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="ccache clang" \
          LD="ccache ld.lld" \
          AR="ccache llvm-ar" \
          NM="ccache llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          CLANG_TRIPLE="${{ env.TOOLCHAIN_PREFIX }}" \
          CROSS_COMPILE="${{ env.TOOLCHAIN_PREFIX }}" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee "$BUILD_LOG"
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        
        # التحقق من النجاح
        echo ""
        echo "🔍 التحقق من الملفات المولدة..."
        
        ESSENTIAL_FILES=0
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          IMAGE_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" | cut -f1)
          echo "✅ Image.gz: موجود ($IMAGE_SIZE)"
          ESSENTIAL_FILES=$((ESSENTIAL_FILES + 1))
        else
          echo "❌ Image.gz: غير موجود"
        fi
        
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          DTBO_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" | cut -f1)
          echo "✅ dtbo.img: موجود ($DTBO_SIZE)"
          ESSENTIAL_FILES=$((ESSENTIAL_FILES + 1))
        else
          echo "⚠️  dtbo.img: غير موجود (قد يكون طبيعي لبعض الأجهزة)"
        fi
        
        # التحقق من تجميع KernelSU
 
