name: "🚀 Build Kernel - PROVEN with Clang 22"

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean previous build'
        required: false
        default: 'false'

env:
  # ⚙️ PROVEN Settings (من النجاح)
  ARCH: "arm64"
  DEVICE_CODENAME: "violet"
  SUBARCH: "arm64"
  KBUILD_BUILD_USER: "Red-A-Hawk"
  KBUILD_BUILD_HOST: "GitHub-Actions"
  
  # 🔧 Clang 22 (طلبك) مع نفس نمط التسمية
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  
  # 📦 KernelSU (نفس النجاح)
  KSU_VERSION: "v1.1.1-hotfix"
  KSU_APK_URL: "https://github.com/tiann/KernelSU/releases/download/v1.1.1/KernelSU_v1.1.1_12174-release.apk"
  
  # ⚙️ إعدادات التجميع (نفس النجاح)
  CLANG_TRIPLE: "aarch64-linux-gnu-"
  CROSS_COMPILE: "aarch64-linux-gnu-"
  CROSS_COMPILE_ARM32: "arm-linux-gnueabi-"

jobs:
  build:
    runs-on: ubuntu-22.04  # ⭐ نفس النظام الناجح
    
    steps:
    # ==================== 1. بدء البناء (Clang 22) ====================
    - name: "🎬 Start Build with Clang 22"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║        🚀 PROVEN BUILD - NOW WITH Clang 22          ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ 📱 Device:    ${{ env.DEVICE_CODENAME }}             "
        echo "║ 🛠️  Compiler:  Clang 22.0.0 (2025-09-20)            "
        echo "║ ⭐ KSU:       ${{ env.KSU_VERSION }}                 "
        echo "║ 🔧 Based on:  PROVEN working build                   "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 Start: $(date)"
        echo "💡 Using PROVEN structure with Clang 22"

    # ==================== 2. تنزيل المصادر (نفس النجاح) ====================
    - name: "📥 Checkout Kernel Source"
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ==================== 3. تنظيف (نفس النجاح) ====================
    - name: "🧹 Free Disk Space"
      run: |
        echo "🧹 Cleaning up space..."
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        echo "✅ Space freed"
        df -h

    # ==================== 4. تثبيت المتطلبات (نفس النجاح) ====================
    - name: "🔧 Install Build Dependencies"
      run: |
        echo "📦 Installing dependencies (SAME as successful)..."
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex \
        git libssl-dev libncurses5-dev lzop zip wget python3
        echo "✅ Dependencies installed"

    # ==================== 5. إعداد Swap (نفس النجاح) ====================
    - name: "💾 Setup 10GB Swap"
      run: |
        echo "💾 Creating swap space (SAME as successful)..."
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1G count=10 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=100
        echo "✅ Swap configured:"
        free -h
        swapon --show

    # ==================== 6. ⭐⭐ Clang 22 بدلاً من 15 ====================
    - name: "📦 Download Clang 22.0.0"
      id: setup_clang22
      run: |
        echo "📥 Downloading Clang 22.0.0 (2025-09-20)..."
        echo "🔗 URL: ${{ env.TOOLCHAIN_URL }}"
        
        wget -q --show-progress "${{ env.TOOLCHAIN_URL }}" -O /tmp/clang22.tar.gz
        
        echo "📂 Extracting..."
        mkdir -p clang
        tar -xf /tmp/clang22.tar.gz -C clang/
        rm -f /tmp/clang22.tar.gz
        
        echo "✅ Clang 22.0.0 ready"
        echo "📋 Clang version:"
        ./clang/bin/clang --version | head -3
        
        # التحقق من الإصدار
        CLANG_VER=$(./clang/bin/clang --version | grep -o "clang version [0-9]*" | head -1)
        echo "🔍 Installed: $CLANG_VER"
        
        if echo "$CLANG_VER" | grep -q "22"; then
          echo "🎯 Success: Clang 22 confirmed!"
          echo "clang_version=22" >> $GITHUB_OUTPUT
        else
          echo "⚠️ Warning: Might not be version 22"
          echo "clang_version=unknown" >> $GITHUB_OUTPUT
        fi

    # ==================== 7. KernelSU (نفس النجاح - بدون تعديل) ====================
    - name: "🔐 Add KernelSU v1.1.1 Hotfix"
      run: |
        echo "📥 Adding KernelSU v1.1.1 Hotfix (SAME as successful)..."
        git clone --depth=1 https://github.com/tiann/KernelSU KernelSU
        if [ -d "KernelSU" ]; then
          echo "✅ KernelSU v1.1.1 Hotfix added successfully"
          ls -la KernelSU/
        else
          echo "❌ Failed to add KernelSU"
          exit 1
        fi

    # ==================== 8. تهيئة Config (نفس النجاح) ====================
    - name: "⚙️ Generate Kernel Config"
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=${{ env.ARCH }}
        
        echo "⚙️ Trying defconfig options (SAME as successful)..."
        
        # ⭐ نفس منطق البحث عن config
        if make O=out vendor/violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using vendor/violet-perf_defconfig"
        elif make O=out violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using violet-perf_defconfig"
        elif make O=out violet_defconfig 2>/dev/null; then
          echo "✅ Using violet_defconfig"
        else
          echo "❌ No valid defconfig found!"
          echo "Available configs:"
          ls arch/arm64/configs/ | grep violet
          exit 1
        fi
        
        echo "✅ Defconfig generated successfully"

    # ==================== 9. ⭐⭐ التجميع بـ Clang 22 ====================
    - name: "🔨 Compile Kernel with Clang 22"
      id: compile_kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=${{ env.ARCH }}
        export SUBARCH=${{ env.SUBARCH }}
        export KBUILD_BUILD_USER=${{ env.KBUILD_BUILD_USER }}
        export KBUILD_BUILD_HOST=${{ env.KBUILD_BUILD_HOST }}
        
        echo "🔨 Starting kernel compilation with Clang 22..."
        echo "⏰ Start time: $(date)"
        echo "💾 Memory before build:"
        free -h
        
        START=$(date +%s)
        
        # ⭐⭐ نفس إعدادات التجميع الناجحة، فقط المترجم مختلف
        make -j$(nproc --all) O=out \
          ARCH=${{ env.ARCH }} \
          SUBARCH=${{ env.SUBARCH }} \
          CC=clang \
          CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
          CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
          CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
          2>&1 | tee build.log
        
        BUILD_STATUS=$?
        
        END=$(date +%s)
        DIFF=$((END - START))
        
        echo "⏰ End time: $(date)"
        echo "⏱️ Build duration: $((DIFF / 60)) minutes $((DIFF % 60)) seconds"
        echo "BUILD_TIME=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
        echo "💾 Memory after build:"
        free -h
        
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "❌ Build failed with exit code $BUILD_STATUS"
          
          # تحليل الخطأ
          echo ""
          echo "🔍 Last 20 lines of build log:"
          tail -20 build.log
          
          # البحث عن أخطاء Clang 22
          if grep -q "error:" build.log; then
            echo ""
            echo "🔴 Clang 22 errors found:"
            grep -i "error:" build.log | head -5
          fi
          
          exit $BUILD_STATUS
        fi
        
        echo "✅ Compilation completed!"

    # ==================== 10. التحقق من الناتج (نفس النجاح) ====================
    - name: "✔️ Verify Build Output"
      id: check
      run: |
        echo "🔍 Checking build output..."
        
        IMAGE=out/arch/arm64/boot/Image.gz
        DTBO=out/arch/arm64/boot/dtbo.img
        
        echo "📁 Checking files:"
        
        if [[ -f ${IMAGE} && -f ${DTBO} ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Build successful with Clang 22!"
          echo ""
          echo "📦 Image.gz:"
          ls -lh ${IMAGE}
          echo "  Size: $(du -h ${IMAGE} | cut -f1)"
          echo ""
          echo "📦 dtbo.img:"
          ls -lh ${DTBO}
          echo "  Size: $(du -h ${DTBO} | cut -f1)"
          
          # ⭐ إضافة معلومات Clang 22
          echo ""
          echo "🎯 Clang 22 Build Info:"
          file ${IMAGE}
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Build incomplete!"
          echo ""
          [ -f ${IMAGE} ] && echo "  ✅ Image.gz found" || echo "  ❌ Image.gz missing"
          [ -f ${DTBO} ] && echo "  ✅ dtbo.img found" || echo "  ❌ dtbo.img missing"
        fi

    # ==================== 11. إنشاء ZIP (نفس النجاح) ====================
    - name: "📦 Create Flashable ZIP"
      if: steps.check.outputs.success == 'true'
      run: |
        echo "📦 Creating flashable ZIP..."
        
        git clone -q https://github.com/Joker-V2/AnyKernel3 -b sixteen AK3
        
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        ZIPNAME="Violet-KSU-Clang22-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../${ZIPNAME} * -x .git README.md .gitignore
        cd ..
        
        echo "✅ Created: ${ZIPNAME}"
        ls -lh ${ZIPNAME}
        echo "  Size: $(du -h ${ZIPNAME} | cut -f1)"

    # ==================== 12. توقيع ZIP (نفس النجاح) ====================
    - name: "🔏 Sign Kernel ZIP"
      if: steps.check.outputs.success == 'true'
      run: |
        echo "🔏 Signing kernel ZIP..."
        
        wget -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        
        java -jar zipsigner.jar \
          Violet-KSU-Clang22-*.zip \
          Violet-KSU-Clang22-SIGNED.zip
        
        echo "✅ ZIP signed successfully!"

    # ==================== 13. رفع الملفات (نفس النجاح) ====================
    - name: "📤 Upload Kernel ZIP"
      if: steps.check.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Violet-KSU-Clang22-${{ github.run_number }}
        path: Violet-KSU-Clang22-*.zip
        retention-days: 30

    - name: "📤 Upload Build Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log-Clang22-${{ github.run_number }}
        path: build.log
        retention-days: 7

    # ==================== 14. ملخص البناء (محدث لـ Clang 22) ====================
    - name: "📊 Build Summary"
      if: always()
      run: |
        echo "## 📊 Build Summary - Clang 22 Edition" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Build Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Compiler:** Clang 22.0.0 (20 Sep 2025)" >> $GITHUB_STEP_SUMMARY
        echo "- **Based on:** PROVEN ZyC Clang 15 build" >> $GITHUB_STEP_SUMMARY
        echo "- **KernelSU:** v1.1.1 Hotfix" >> $GITHUB_STEP_SUMMARY
        echo "- **Device:** Xiaomi Violet (Redmi Note 7 Pro)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.check.outputs.success }}" == "true" ]; then
          echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Your kernel with Clang 22 is ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **First Clang 22 build based on proven structure**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download from Artifacts above**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Flash with TWRP/OrangeFox**" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Check the build log for Clang 22 errors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Possible Clang 22 issues:" >> $GITHUB_STEP_SUMMARY
          echo "- Different optimization flags" >> $GITHUB_STEP_SUMMARY
          echo "- Incompatible with current kernel source" >> $GITHUB_STEP_SUMMARY
          echo "- Need kernel source updates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 **Fallback:** Use the proven ZyC Clang 15 build" >> $GITHUB_STEP_SUMMARY
        fi
