name: Build Kernel violet (Proton + KernelSU Next v1.1.1)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev make \
          ccache curl zip unzip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ===== KernelSU Next v1.1.1 (LOCKED) =====
    - name: Apply KernelSU Next v1.1.1
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu
        cd ksu
        git checkout v1.1.1
        KSU_NO_UPDATE=1 bash kernel/setup.sh
        cd ..

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    - name: Apply KernelSU + SUSFS configs
      run: |
        CONFIG=out/.config

        echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> $CONFIG

        echo "CONFIG_KSU=y" >> $CONFIG
        echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> $CONFIG
        echo "# CONFIG_KSU_MANUAL_HOOK is not set" >> $CONFIG
        echo "# CONFIG_KSU_DEBUG is not set" >> $CONFIG
        echo "# CONFIG_KSU_SWITCH_MANAGER is not set" >> $CONFIG

        echo "CONFIG_KSU_SUSFS=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $CONFIG
        echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $CONFIG

        make O=out olddefconfig

    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 -b sixteen anykernel
        cp out/arch/arm64/boot/Image.gz anykernel/
        cp out/arch/arm64/boot/dtbo.img anykernel/

    - name: Zip kernel
      run: |
        cd anykernel
        zip -r9 ../kernel-unsigned.zip ./*
        cd ..

    - name: Sign zip
      run: |
        curl -L -o zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar kernel-unsigned.zip kernel-signed.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: violet-kernel-build
        path: |
          kernel-signed.zip
          build.log
          out/.config
