name: Build KernelSU Next + SUSFS 1.5 (violet)

on:
  push:
    branches:
      - susfs-1.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: susfs-1.5

    # 2️⃣ Install dependencies
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl \
          libelf-dev libncurses5-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    # 3️⃣ Setup Clang 22 (ZyCromerZ)
    - name: Setup Clang 22
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        tar -xvf Clang-22.0.0git-20250920.tar.gz
        echo "$PWD/Clang-22.0.0git-20250920/bin" >> $GITHUB_PATH

    # 4️⃣ Setup KernelSU Next v1.1.1
    - name: Setup KernelSU Next
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout v1.1.1
        cd ..
        bash KernelSU-Next/kernel/setup.sh

    # 5️⃣ Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 6️⃣ Load defconfig (LOCALVERSION + SUSFS جاهزة)
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    # 7️⃣ Build kernel
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 8️⃣ Package with AnyKernel3
    - name: Package with AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi

        cd AnyKernel3
        zip -r9 ../Kernel-violet-unsigned.zip *

    # 9️⃣ ZipSigner
    - name: Sign ZIP
      run: |
        wget -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-unsigned.zip Kernel-violet-signed.zip

    # 🔟 Upload artifacts
    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-SUSFS-1.5
        path: Kernel-violet-signed.zip

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build.log

    # 1️⃣1️⃣ Artificial Summary
    - name: Build summary
      run: |
        echo "## ✅ Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Device: **Redmi Note 7 Pro (violet)**" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: **susfs-1.5**" >> $GITHUB_STEP_SUMMARY
        echo "- KernelSU Next: **v1.1.1**" >> $GITHUB_STEP_SUMMARY
        echo "- SUSFS: **Enabled (native)**" >> $GITHUB_STEP_SUMMARY
        echo "- Compiler: **Clang 22 (ZyCromerZ)**" >> $GITHUB_STEP_SUMMARY
        echo "- Output: **Flashable ZIP (signed)**" >> $GITHUB_STEP_SUMMARY
