name: Build KernelSU Next + SUSFS (violet | susfs-1.5)

on:
  push:
    branches:
      - susfs-1.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source (susfs-1.5)
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: susfs-1.5
        fetch-depth: 1

    # 2️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses5-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3

    # 3️⃣ Setup ZyCromerZ Clang
    - name: Setup ZyCromerZ Clang
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        rm -f Clang-15.0.7-20251111.tar.gz
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ Setup KernelSU Next (no SUSFS config – already in branch)
    - name: Setup KernelSU Next
      run: |
        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout v1.1.1
        cd ..
        bash KernelSU-Next/kernel/setup.sh

    # 5️⃣ Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 6️⃣ Load defconfig (from branch)
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 7️⃣ Build kernel
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 8️⃣ Verify output
    - name: Verify build output
      run: |
        test -f out/arch/arm64/boot/Image.gz || exit 1
        echo "✅ Image.gz ready"

    # 9️⃣ Package with AnyKernel3 (Joker-V2 | sixteen)
    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3

        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AK3/

        DEVICE="violet"
        ANDROID="A16"
        BRANCH="susfs-1.5"
        BUILD_DATE="$(date +%Y%m%d-%H%M)"

        ZIP_NAME="KernelSU-${DEVICE}-${ANDROID}-${BRANCH}-${BUILD_DATE}-unsigned.zip"

        cd AK3
        zip -r9 "../$ZIP_NAME" . -x ".git/*" "README.md"
        cd ..

        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

    # 🔐 10️⃣ Sign ZIP
    - name: Sign ZIP
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

        SIGNED_ZIP="${ZIP_NAME/-unsigned/}"

        java -jar zipsigner-3.0-dexed.jar \
          "$ZIP_NAME" \
          "$SIGNED_ZIP"

        rm -f "$ZIP_NAME"
        echo "SIGNED_ZIP=$SIGNED_ZIP" >> $GITHUB_ENV

    # 📤 11️⃣ Upload artifacts
    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-SUSFS-Violet
        path: ${{ env.SIGNED_ZIP }}

    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
