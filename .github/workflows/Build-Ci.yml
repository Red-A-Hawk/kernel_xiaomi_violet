name: Build Kernel (violet | susfs-1.5 + SukiSU Ultra)

on:
  push:
    branches:
      - test3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test3
        fetch-depth: 1

    # 2️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless
    # 3️⃣ Setup ZyCromerZ Clang (stable مع 4.14)
    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
    # 4️⃣ Inject SukiSU Ultra (builtin / manual hook)
    - name: Inject SukiSU Ultra (builtin)
      run: |
        set -e
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin
    
    
    # 5️⃣ Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
    # 6️⃣ Load defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig
    # 7️⃣ Ensure correct KSU config
    - name: Fix KernelSU config
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KPROBES \
          --set-str LOCALVERSION "-sukisu-susfs"
        make O=out olddefconfig
    # 8️⃣ Build kernel (مع log نظيف)
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log
    # 9️⃣ Verify output
    - name: Check build output
      run: |
        test -f out/arch/arm64/boot/Image.gz
    # 🔟 Package with AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs.zip *
    # 1️⃣1️⃣ Upload kernel
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-sukisu-susfs
        path: Kernel-violet-sukisu-susfs.zip

    # 1️⃣2️⃣ Upload build log (always)
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
