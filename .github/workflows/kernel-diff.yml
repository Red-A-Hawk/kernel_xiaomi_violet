name: Build Kernel (violet | susfs-1.5)

on:
  push:
    branches:
      - susfs-1.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: susfs-1.5
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses5-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3

    # 3️⃣ Setup ZyCromerZ Clang (FIX ld.lld)
    - name: Setup ZyCromerZ Clang
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        mkdir clang
        tar -xvf Clang-22.0.0git-20250920.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 5️⃣ Sanity check (مهم)
    - name: Check clang tools
      run: |
        which clang
        which ld.lld
        clang --version

    # 6️⃣ Load defconfig (LOCALVERSION من defconfig)
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 7️⃣ Build kernel + log
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 8️⃣ AnyKernel3 packaging
    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi

        cd AnyKernel3
        zip -r9 ../Kernel-Violet-SUSFS.zip *

    # 9️⃣ ZipSigner
    - name: Sign zip
      run: |
        wget -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-Violet-SUSFS.zip Kernel-Violet-SUSFS-signed.zip

    # 🔟 Upload artifacts
    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Violet-SUSFS
        path: Kernel-Violet-SUSFS-signed.zip

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    # 🧠 Summary احترافي
    - name: Build summary
      run: |
        {
          echo "## ✅ Kernel Build Summary"
          echo ""
          echo "- **Device:** Redmi Note 7 Pro (violet)"
          echo "- **Branch:** susfs-1.5"
          echo "- **Clang:** ZyCromerZ 22"
          echo "- **SUSFS:** Enabled (native)"
          echo "- **KernelSU:** Integrated in source"
          echo "- **Output:** AnyKernel3 (signed)"
          echo ""
          echo "### 📄 Logs"
          echo "- build.log attached as artifact"
        } >> $GITHUB_STEP_SUMMARY
