name: Kernel diff report (sixteen vs sixteen-ksu)

on:
  push:
    branches: [sixteen]
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout kernel source (sixteen) — جزء بداية إجباري
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0   # مهم جداً للـ diff

      # 2️⃣ Fetch both branches explicitly
      - name: Fetch all required branches
        run: |
          git fetch origin sixteen
          git fetch origin sixteen-ksu

      # 3️⃣ Verify branches (debug safety)
      - name: Verify refs
        run: |
          git branch -a
          git show-ref | grep sixteen || true

      # 4️⃣ Generate git diff reports
      - name: Generate git diff reports
        run: |
          mkdir -p diff-report

          # Full diff
          git diff origin/sixteen..origin/sixteen-ksu \
            > diff-report/full.diff

          # Stat summary
          git diff --stat origin/sixteen..origin/sixteen-ksu \
            > diff-report/stat.txt

          # File name only
          git diff --name-only origin/sixteen..origin/sixteen-ksu \
            > diff-report/files.txt

          # KernelSU / SUSFS related paths (فلترة ذكية)
          git diff --name-only origin/sixteen..origin/sixteen-ksu \
            | grep -Ei "kernelsu|ksu|susfs|fs/|security/" \
            > diff-report/filtered-files.txt || true

      # 5️⃣ Compress diff report (خفيف)
      - name: Compress diff report
        run: |
          tar -czf kernel-diff-report.tar.gz diff-report

      # 6️⃣ Upload artifact
      - name: Upload diff report
        uses: actions/upload-artifact@v4
        with:
          name: kernel-diff-report
          path: kernel-diff-report.tar.gz
