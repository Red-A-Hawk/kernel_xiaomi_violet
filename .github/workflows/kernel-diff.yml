name: Kernel diff (sixteen vs sixteen-ksu)

on:
  workflow_dispatch:
  push:
    branches: [sixteen]

jobs:
  diff:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout repository (فرع sixteen)
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0   # مهم جدًا

      # 2️⃣ Fetch all needed branches
      - name: Fetch all branches
        run: |
          git fetch origin sixteen
          git fetch origin sixteen-ksu

      # 3️⃣ Generate git diff reports (✔ الإصلاح هنا)
      - name: Generate git diff reports
        run: |
          mkdir -p diff-report

          git diff origin/sixteen..origin/sixteen-ksu > diff-report/full.diff
          git diff --stat origin/sixteen..origin/sixteen-ksu > diff-report/stat.txt
          git diff --name-only origin/sixteen..origin/sixteen-ksu > diff-report/files.txt

      # 4️⃣ Compress report (خفيف)
      - name: Compress diff report
        run: |
          tar -czf kernel-diff-report.tar.gz diff-report

      # 5️⃣ Upload artifact
      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-diff-report
          path: kernel-diff-report.tar.gz
