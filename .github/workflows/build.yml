name: Kernel Build Script with Dependencies

on:
  push:
    branches:
      - sixteen  # التأكد من الفرع "sixteen" في حالة الدفع
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Check branch
      run: |
        echo "Workflow is running on branch:"
        echo "$GITHUB_REF"
        echo "If you see this, Actions WORK ✅"

    - name: Ensure 'sixteen' branch exists
      run: |
        git fetch origin
        git checkout sixteen || git checkout -b sixteen  # التأكد من الفرع sixteen موجود

    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install required dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          make \
          binutils \
          libc6-dev \
          libncurses5-dev \
          libssl-dev \
          bc \
          bison \
          flex \
          libelf-dev \
          libssl-dev \
          zlib1g-dev \
          libxml2-utils \
          clang \
          lld \
          llvm \
          git \
          libtool \
          liblz4-tool \
          libgmp-dev \
          libmpc-dev \
          autoconf \
          python3 \
          python3-pip \
          python3-venv \
          rsync \
          libreadline-dev \
          libcurl4-openssl-dev \
          libc6-i386 \
          lib32stdc++6 \
          lib32gcc1 \
          lib32ncurses5 \
          lib32z1 \
          zipsigner \
          gcc-arm-linux-gnueabi \
          g++-arm-linux-gnueabi

    - name: Install Clang (if needed)
      run: |
        sudo apt-get install -y clang

    - name: Install Proton Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ~/ProtonClang
        echo "PATH=$GITHUB_WORKSPACE/ProtonClang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Install Python dependencies for kernel building
      run: |
        pip3 install --upgrade setuptools
        pip3 install --upgrade cmake

    - name: Install ARM Cross-Compiling Tools
      run: |
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu

    - name: Checkout KernelSU Next v1.1.1
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout v1.1.1
        cd ..
        bash KernelSU-Next/kernel/setup.sh

    - name: Apply Custom defconfig and Load Kernel Config
      run: |
        cp /path/to/vendor/violet-perf_defconfig .config
        make O=out ARCH=arm64 vendor/violet-perf_defconfig
        make O=out ARCH=arm64

    - name: Build Kernel
      run: |
        make -j$(nproc) O=out

    - name: Clone AnyKernel3 (sixteen)
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git AnyKernel3

    - name: Copy Kernel Image
      run: |
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/Image AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true

    - name: Create Flashable ZIP
      run: |
        cd AnyKernel3
        zip -r9 ../kernel-violet-KSU-next-unsigned.zip *
        cd ..

    - name: Download zipsigner
      run: |
        wget -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    - name: Sign ZIP
      run: |
        java -jar zipsigner.jar kernel-violet-KSU-next-unsigned.zip kernel-violet-KSU-next.zip

    - name: Upload Flashable Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Flashable-Kernel
        path: kernel-violet-KSU-next.zip

    - name: Artificial Summary
      run: |
        echo "Build Summary:"
        echo "-----------------------------------------"
        echo "Kernel build completed successfully."
        echo "KernelSU Next version: v1.1.1"
        echo "SUSFS features are enabled."
        echo "Proton Clang toolchain used for build."
        echo "AnyKernel3 used for creating flashable zip."
        echo "zipsigner was used to sign the zip file."
        echo "-----------------------------------------"
        echo "Please proceed to flash the kernel using TWRP or your preferred recovery method."
