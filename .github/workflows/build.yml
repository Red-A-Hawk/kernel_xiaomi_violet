name: Build Kernel Violet (KernelSU Next + Proton)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make gcc lld \
          libc6-dev libncurses5-dev \
          libncursesw5-dev \
          python3 python-is-python3 \
          zip unzip openjdk-17-jdk

    # =========================
    # Proton Clang
    # =========================
    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton
        echo "PROTON_DIR=$GITHUB_WORKSPACE/proton" >> $GITHUB_ENV
        echo "$GITHUB_WORKSPACE/proton/bin" >> $GITHUB_PATH

    # =========================
    # KernelSU Next v1.1.1
    # =========================
    - name: Apply KernelSU Next v1.1.1
      run: |
        rm -rf KernelSU-Next
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout v1.1.1
        cd ..
        bash KernelSU-Next/kernel/setup.sh

    - name: Export build variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "WERROR=0" >> $GITHUB_ENV

    # =========================
    # Defconfig
    # =========================
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # =========================
    # Build kernel (Proton)
    # =========================
    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          AS=llvm-as \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          HOSTCC=clang \
          HOSTCXX=clang++ \
          KCFLAGS="-Wno-error"

    # =========================
    # AnyKernel3
    # =========================
    - name: Clone AnyKernel3 (Android 16)
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git anykernel

    - name: Copy kernel image
      run: |
        IMAGE=$(find out/arch/arm64/boot -name "Image*" | head -n 1)
        if [ -z "$IMAGE" ]; then
          echo "❌ Kernel Image not found"
          exit 1
        fi
        cp "$IMAGE" anykernel/Image

    - name: Pack AnyKernel3 zip
      run: |
        cd anykernel
        zip -r9 ../kernel-violet-KSU-next-unsigned.zip ./*
        cd ..

    # =========================
    # ZipSigner
    # =========================
    - name: Download zipsigner
      run: |
        wget -O zipsigner.jar \
        https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    - name: Sign flashable zip
      run: |
        java -jar zipsigner.jar \
          kernel-violet-KSU-next-unsigned.zip \
          kernel-violet-KSU-next.zip

    - name: Upload flashable kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Violet-KSU-Next
        path: kernel-violet-KSU-next.zip
