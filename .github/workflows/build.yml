name: Build Kernel (violet | Proton | KernelSU Next 1.1.1)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make \
          git ccache curl zip unzip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    - name: Setup Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Apply KernelSU Next v1.1.1
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu
        cd ksu
        git checkout v1.1.1
        cd ..
        bash ksu/kernel/setup.sh

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    - name: Prepare AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3 ak3
        cp out/arch/arm64/boot/Image.gz ak3/
        cp out/arch/arm64/boot/dtbo.img ak3/ || true

    - name: Zip kernel
      run: |
        cd ak3
        zip -r ../kernel-unsigned.zip *

    - name: Sign zip
      run: |
        wget -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar kernel-unsigned.zip kernel-signed.zip

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: Flashable-Kernel
        path: kernel-signed.zip
