name: Build Kernel

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # تحقق من المستودع والتأكد من أنه موجود
      - name: Check if repository exists
        run: |
          git clone --single-branch --branch sixteen https://github.com/Red-A-Hawk/kernel_xiaomi_violet.git || exit 1

      # تثبيت Proton Clang Toolchain أولاً
      - name: Install Proton Clang Toolchain
        run: |
          sudo apt-get install -y clang-11 lld-11

      # تثبيت Python 3.8 و pip
      - name: Set up Python 3.8
        run: sudo apt-get install python3.8 python3-pip

      # تثبيت الاعتمادات المطلوبة
      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex \
          git libssl-dev libncurses5-dev lzop zip wget python3 \
          xz-utils libxml2-utils

      # تثبيت KernelSU Next v1.1.1 بعد تثبيت Python
      - name: Checkout KernelSU Next v1.1.1
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      # تطبيق إعدادات defconfig و تحميل الإعدادات
      - name: Apply Custom defconfig and Load Kernel Config
        run: |
          cp /path/to/vendor/violet-perf_defconfig .config
          make olddefconfig

      # بناء النواة
      - name: Build Kernel
        run: make -j$(nproc) O=out

      # استنساخ AnyKernel3 (sixteen)
      - name: Clone AnyKernel3 (sixteen)
        run: git clone --single-branch --branch sixteen https://github.com/Red-A-Hawk/AnyKernel3.git

      # نسخ ملف Image.gz و dtbo.img إلى AnyKernel3
      - name: Copy Kernel Image and dtbo.img to AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/

      # إنشاء ملف Flashable ZIP
      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../kernel.zip .

      # تنزيل zipsigner
      - name: Download zipsigner
        run: |
          curl -LO https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

      # توقيع ملف ZIP النهائي
      - name: Sign the Flashable ZIP
        run: |
          java -jar zipsigner-3.0-dexed.jar kernel.zip kernel_signed.zip

      # رفع ملف الـ Flashable ZIP الموقع
      - name: Upload signed flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: flashable_kernel_signed
          path: kernel_signed.zip
