name: Build with KernelSU Next (Non-GKI)

on:
  workflow_dispatch:
  push:
    branches: [ sixteen-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: 🔧 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex \
        git libssl-dev libncurses5-dev lzop zip wget python3
        
    - name: ⚡ Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: violet-kernelsu-next
        max-size: 2G
        
    - name: 🔐 Add KernelSU Next (Non-GKI v3.0.0)
      run: |
        echo "📥 Adding KernelSU Next for Non-GKI devices..."
        
        # Clone KernelSU Next
        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU
        
        # Verify
        if [ -d "KernelSU" ]; then
          echo "✅ KernelSU Next v3.0.0 added successfully"
          echo "📁 KernelSU directory structure:"
          ls -la KernelSU/
        else
          echo "❌ Failed to add KernelSU Next"
          exit 1
        fi
        
    - name: 📦 Download Clang
      run: |
        echo "📥 Downloading ZyC Clang..."
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        mkdir clang
        tar -xf Clang-*.tar.gz -C clang/
        rm Clang-*.tar.gz
        echo "✅ Clang ready"
        
    - name: ⚙️ Generate Defconfig
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        echo "Trying defconfig options..."
        make O=out vendor/violet-perf_defconfig 2>/dev/null || \
        make O=out violet-perf_defconfig 2>/dev/null || \
        make O=out violet_defconfig
        
        echo "✅ Defconfig generated"
        
    - name: 🔨 Compile Kernel with KernelSU Next
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export KBUILD_BUILD_USER=Red-A-Hawk
        export KBUILD_BUILD_HOST=GitHub-Actions
        
        START=$(date +%s)
        echo "🔨 Building kernel with KernelSU Next..."
        
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log
        
        END=$(date +%s)
        DIFF=$((END - START))
        echo "⏱️ Build completed in $((DIFF / 60))m $((DIFF % 60))s"
        echo "BUILD_TIME=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
    - name: ✔️ Verify Build Output
      id: check
      run: |
        IMAGE=out/arch/arm64/boot/Image.gz
        DTBO=out/arch/arm64/boot/dtbo.img
        
        echo "📋 Checking build output..."
        
        if [[ -f ${IMAGE} && -f ${DTBO} ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Build successful!"
          echo "  📦 Image.gz: $(du -h ${IMAGE} | cut -f1)"
          echo "  📦 dtbo.img: $(du -h ${DTBO} | cut -f1)"
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Build failed or incomplete"
          [ -f ${IMAGE} ] && echo "  ✅ Image.gz found" || echo "  ❌ Image.gz missing"
          [ -f ${DTBO} ] && echo "  ✅ dtbo.img found" || echo "  ❌ dtbo.img missing"
        fi
        
    - name: 📦 Create Flashable ZIP
      if: steps.check.outputs.success == 'true'
      run: |
        echo "📦 Creating AnyKernel3 package..."
        
        # Clone AnyKernel3
        git clone -q https://github.com/osm0sis/AnyKernel3 AK3
        
        # Copy kernel files
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        
        # Create ZIP
        cd AK3
        zip -r9 ../Violet-KernelSU-Next-$(date +%Y%m%d-%H%M).zip * \
          -x .git README.md .gitignore
        cd ..
        
        ZIPFILE=$(ls Violet-KernelSU-Next-*.zip)
        echo "✅ Created: $ZIPFILE ($(du -h $ZIPFILE | cut -f1))"
        
    - name: 📤 Upload Build
      if: steps.check.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Violet-KernelSU-Next-${{ github.run_number }}
        path: |
          Violet-KernelSU-Next-*.zip
          build.log
        retention-days: 30
        
    - name: 📤 Upload Error Log
      if: steps.check.outputs.success == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: Build-Failed-Log-${{ github.run_number }}
        path: build.log
        retention-days: 7
        
    - name: 📊 Build Summary
      if: always()
      run: |
        echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** sixteen-ksu" >> $GITHUB_STEP_SUMMARY
        echo "- **KernelSU:** Next v3.0.0 (Non-GKI)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.check.outputs.success }}" == "true" ]; then
          echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Download the flashable ZIP from Artifacts above" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the build.log in Artifacts for details" >> $GITHUB_STEP_SUMMARY
        fi
