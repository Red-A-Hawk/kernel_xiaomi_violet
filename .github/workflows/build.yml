name: "Build Kernel with KernelSU"

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build'
        required: false
        default: 'false'

env:
  KERNEL_NAME: "xcalibur-kernel"
  ARCH: "arm64"
  CONFIG_FILE: "violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  KSU_BRANCH: "main"
  KSU_REPO: "https://github.com/tiann/KernelSU"
  
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  
  ANY_KERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"
  
  JOBS: 4

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout"
      uses: actions/checkout@v4

    - name: "Install Dependencies"
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libssl-dev bc flex bison git wget

    - name: "Download Toolchain"
      run: |
        wget -q "${{ env.TOOLCHAIN_URL }}" -O clang.tar.gz
        mkdir -p toolchain
        tar -xzf clang.tar.gz -C toolchain --strip-components=1
        echo "$PWD/toolchain/bin" >> $GITHUB_PATH

    - name: "Install KernelSU"
      run: |
        rm -rf drivers/kernelsu 2>/dev/null || true
        git clone "${{ env.KSU_REPO }}" --depth=1 /tmp/kernelsu
        mkdir -p drivers/kernelsu
        cp -r /tmp/kernelsu/kernel/* drivers/kernelsu/ 2>/dev/null || true

    - name: "Configure Kernel"
      run: |
        make ARCH=${{ env.ARCH }} ${{ env.CONFIG_FILE }} || make ARCH=${{ env.ARCH }} defconfig
        echo "CONFIG_KSU=y" >> .config
        echo "CONFIG_KSU_DEBUG=n" >> .config
        make ARCH=${{ env.ARCH }} olddefconfig

    - name: "Compile Kernel"
      run: |
        make -j${{ env.JOBS }} ARCH=${{ env.ARCH }} CROSS_COMPILE=aarch64-linux-gnu- CC=clang LLVM=1
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "Kernel compiled successfully"
        else
          echo "Kernel compilation failed"
          exit 1
        fi

    - name: "Download KernelSU APK"
      run: |
        wget -q "https://github.com/tiann/KernelSU/releases/latest/download/KernelSU.apk" -O kernelsu.apk || true

    - name: "Prepare AnyKernel3"
      run: |
        rm -rf anykernel 2>/dev/null || true
        git clone "${{ env.ANY_KERNEL_REPO }}" --depth=1 anykernel
        cp arch/arm64/boot/Image.gz anykernel/

    - name: "Create ZIP"
      run: |
        cd anykernel
        zip -r9 "../kernel-${{ github.run_number }}.zip" ./* > /dev/null

    - name: "Upload Artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          kernel-*.zip
          kernelsu.apk
