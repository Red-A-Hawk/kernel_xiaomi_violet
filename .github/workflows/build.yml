name: "🚀 Build Kernel with KernelSU"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Get source
    - name: "📥 Checkout"
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Install deps
    - name: "📦 Install dependencies"
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex git libssl-dev make wget

    # 3. Setup swap
    - name: "💾 Setup swap"
      run: |
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    # 4. Get toolchain
    - name: "🔧 Get toolchain"
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        mkdir clang
        tar -xf Clang-15.0.7-20251111.tar.gz -C clang/
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

    # 5. Simple KernelSU integration
    - name: "⭐ Add KernelSU"
      run: |
        echo "Adding KernelSU..."
        mkdir -p drivers/kernelsu
        
        # Download basic files
        cat > drivers/kernelsu/core.c << 'EOF'
#include <linux/module.h>
MODULE_LICENSE("GPL");
int init_module(void) { printk("KernelSU loaded\n"); return 0; }
void cleanup_module(void) { printk("KernelSU unloaded\n"); }
EOF
        
        cat > drivers/kernelsu/Makefile << 'EOF'
obj-y += core.o
EOF
        
        cat > drivers/kernelsu/Kconfig << 'EOF'
config KSU
	bool "KernelSU"
	default y
EOF

    # 6. Configure kernel
    - name: "⚙️ Configure"
      run: |
        mkdir -p out
        make O=out ARCH=arm64 ${{ env.CONFIG_FILE }}
        echo "CONFIG_KSU=y" >> out/.config
        make O=out ARCH=arm64 olddefconfig

    # 7. Build kernel
    - name: "🔨 Build"
      run: |
        make -j$(nproc) O=out ARCH=arm64 CC="clang" CROSS_COMPILE="aarch64-linux-gnu-" 2>&1 | tee build.log

    # 8. Check build
    - name: "✅ Check"
      run: |
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "✅ Build successful"
        else
          echo "❌ Build failed"
          exit 1
        fi

    # 9. Create zip
    - name: "📦 Package"
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../kernel.zip *
