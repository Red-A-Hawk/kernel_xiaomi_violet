name: "Build Kernel for Violet with KernelSU"

on:
  workflow_dispatch:
  push:
    branches: [ sixteen-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    steps:
    # ==================== 📥 1. GET KERNEL SOURCE ====================
    - name: "📥 Checkout Kernel Source"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    # ==================== 🧹 2. FREE DISK SPACE ====================
    - name: "🧹 Free Disk Space"
      run: |
        echo "🧹 Cleaning up space..."
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        echo "✅ Space freed"
        df -h
        
    # ==================== 📦 3. INSTALL BUILD DEPENDENCIES ====================
    - name: "📦 Install Build Dependencies"
      run: |
        echo "📦 Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libssl-dev libncurses5-dev \
          lzop make python3 wget zip file binutils
        echo "✅ Dependencies installed"
        
    # ==================== 💾 4. SETUP 10GB SWAP ====================
    - name: "💾 Setup 10GB Swap"
      run: |
        echo "💾 Creating swap space..."
        sudo swapoff -a 2>/dev/null || true
        sudo fallocate -l 10G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=100
        echo "✅ Swap configured:"
        free -h
        
    # ==================== ⭐ 5. ADD KERNELSU (ORIGINAL FOR NON-GKI) ====================
    - name: "⭐ Add KernelSU for Non-GKI Kernel"
      run: |
        echo "Adding KernelSU v0.9.4..."
        
        # Remove any existing
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # Download KernelSU
        wget -q "https://github.com/tiann/KernelSU/archive/refs/tags/v0.9.4.tar.gz" -O kernelsu.tar.gz
        
        # Extract
        mkdir -p drivers/kernelsu
        tar -xf kernelsu.tar.gz --strip-components=1 -C drivers/kernelsu/
        rm -f kernelsu.tar.gz
        
        # Add to Kconfig
        echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        
        # Add to Makefile
        echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        
        echo "✅ KernelSU added"
        
    # ==================== 🔧 6. DOWNLOAD ZyC CLANG 15.0.7 ====================
    - name: "🔧 Download ZyC Clang 15.0.7"
      run: |
        echo "📥 Downloading ZyC Clang 15.0.7..."
        wget -q --show-progress https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        
        echo "📂 Extracting..."
        mkdir clang
        tar -xf Clang-15.0.7-20251111.tar.gz -C clang/
        rm Clang-15.0.7-20251111.tar.gz
        
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH
        echo "✅ ZyC Clang ready"
        
    # ==================== ⚙️ 7. GENERATE KERNEL CONFIG ====================
    - name: "⚙️ Generate Kernel Config with KSU"
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        echo "Generating kernel config..."
        mkdir -p out
        
        # Try defconfigs
        if make O=out vendor/violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using vendor/violet-perf_defconfig"
        elif make O=out violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using violet-perf_defconfig"
        elif make O=out violet_defconfig 2>/dev/null; then
          echo "✅ Using violet_defconfig"
        else
          echo "❌ No defconfig found"
          exit 1
        fi
        
        # Add KernelSU config
        echo "CONFIG_KSU=y" >> out/.config
        echo 'CONFIG_KSU_NAME="KSU"' >> out/.config
        make O=out ARCH=arm64 olddefconfig
        
        echo "✅ Config generated"
        
    # ==================== 🔨 8. COMPILE KERNEL ====================
    - name: "🔨 Compile Kernel"
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        echo "Compiling kernel..."
        START=$(date +%s)
        
        make -j$(nproc --all) O=out ARCH=arm64 CC="clang" CROSS_COMPILE="aarch64-linux-gnu-" 2>&1 | tee build.log
        
        END=$(date +%s)
        DIFF=$((END - START))
        echo "BUILD_TIME=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
        if tail -5 build.log | grep -q "Error"; then
          echo "❌ Build failed"
          exit 1
        else
          echo "✅ Build completed in ${DIFF}s"
        fi
        
    # ==================== ✔️ 9. VERIFY BUILD ====================
    - name: "✔️ Verify Build"
      id: check
      run: |
        echo "Checking build..."
        
        if [[ -f "out/arch/arm64/boot/Image.gz" && -f "out/arch/arm64/boot/dtbo.img" ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Build successful"
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Build failed"
          exit 1
        fi
        
    # ==================== 📦 10. CREATE ZIP WITH ANYKERNEL3 (sixteen branch) ====================
    - name: "📦 Create Flashable ZIP"
      if: steps.check.outputs.success == 'true'
      run: |
        echo "Creating flashable ZIP..."
        
        # Clone AnyKernel3 from sixteen branch
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3 -b sixteen AK3
        
        # Copy kernel files
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        
        # Create ZIP
        cd AK3
        ZIPNAME="Violet-KSU-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../$ZIPNAME * -x .git README.md .gitignore
        cd ..
        
        echo "✅ Created: $ZIPNAME"
        
    # ==================== 📤 11. UPLOAD ARTIFACT ====================
    - name: "📤 Upload Kernel ZIP"
      if: steps.check.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Violet-KSU-Kernel
        path: Violet-KSU-*.zip
        retention-days: 30
        
    # ==================== 📤 12. UPLOAD LOG ====================
    - name: "📤 Upload Build Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build.log
        retention-days: 7
        
    # ==================== 📊 13. BUILD SUMMARY ====================
    - name: "📊 Build Summary"
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.check.outputs.success }}" == "true" ]; then
          echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Kernel with KernelSU v0.9.4 is ready!" >> $GITHUB_STEP_SUMMARY
          echo "Built with: ZyC Clang 15.0.7" >> $GITHUB_STEP_SUMMARY
          echo "AnyKernel3: sixteen branch" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check build log for details" >> $GITHUB_STEP_SUMMARY
        fi
