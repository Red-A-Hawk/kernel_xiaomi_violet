name: Build Kernel Violet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev \
          build-essential curl git zip unzip \
          python3 ccache

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Set environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=$(pwd)/clang/bin/clang" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=builder" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=github" >> $GITHUB_ENV

    - name: Load defconfig
      run: |
        make O=out violet-perf_defconfig

    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          KBUILD_CFLAGS="-Wno-error"

    - name: Clone AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git AnyKernel3

    - name: Copy kernel image
      run: |
        cp out/arch/arm64/boot/Image AnyKernel3/

    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 kernel-violet.zip *

    - name: Sign zip
      run: |
        wget -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar kernel-violet.zip kernel-violet-signed.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Violet-Kernel
        path: AnyKernel3/kernel-violet-signed.zip
