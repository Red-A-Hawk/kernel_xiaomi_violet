name: Build Kernel

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Set up Python 3.8
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # Step 2: Install required dependencies
      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex \
          git libssl-dev libncurses5-dev lzop zip wget python3 \
          xz-utils libxml2-utils

      # Step 3: Install Clang if needed
      - name: Install Clang (if needed)
        run: |
          sudo apt-get install -y clang

      # Step 4: Install Proton Clang Toolchain
      - name: Install Proton Clang Toolchain
        run: |
          sudo apt-get install -y clang-11 lld-11

      # Step 5: Install Python dependencies for kernel building
      - name: Install Python dependencies for kernel building
        run: |
          pip install -r requirements.txt

      # Step 6: Install ARM Cross-Compiling Tools
      - name: Install ARM Cross-Compiling Tools
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # Step 7: Checkout KernelSU Next v1.1.1
      - name: Checkout KernelSU Next v1.1.1
        run: git clone https://github.com/KernelSU/KernelSU.git && cd KernelSU && git checkout v1.1.1

      # Step 8: Apply Custom defconfig and Load Kernel Config
      - name: Apply Custom defconfig and Load Kernel Config
        run: |
          cp /path/to/vendor/violet-perf_defconfig .config
          make O=out vendor/violet-perf_defconfig

      # Step 9: Build Kernel
      - name: Build Kernel
        run: |
          make -j$(nproc) O=out

      # Step 10: Clone AnyKernel3 (sixteen)
      - name: Clone AnyKernel3 (sixteen)
        run: git clone --branch sixteen https://github.com/Red-A-Hawk/AnyKernel3.git

      # Step 11: Copy Kernel Image
      - name: Copy Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

      # Step 12: Create Flashable ZIP
      - name: Create Flashable ZIP
        run: |
          cd AnyKernel3
          zip -r9 ../kernel.zip *

      # Step 13: Download zipsigner
      - name: Download zipsigner
        run: |
          wget https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
          java -jar zipsigner-3.0-dexed.jar kernel.zip signed_kernel.zip

      # Step 14: Upload build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: ./kernel.zip
