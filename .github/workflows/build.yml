name: Build Kernel (sixteen)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev \
            build-essential curl git zip unzip \
            python3 clang lld

      # =========================
      # KernelSU Next v1.1.1
      # =========================
      - name: Setup KernelSU Next v1.1.1
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git
          cd KernelSU-Next
          git checkout v1.1.1
          cd ..
          bash KernelSU-Next/kernel/setup.sh

      # =========================
      # Load defconfig
      # =========================
      - name: Load defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 violet_defconfig

      # =========================
      # Enable KernelSU options
      # =========================
      - name: Enable KernelSU config
        run: |
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

      # =========================
      # Build kernel
      # =========================
      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld

      # =========================
      # Prepare AnyKernel3
      # =========================
      - name: Prepare AnyKernel3
        run: |
          git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

      # =========================
      # Create flashable zip
      # =========================
      - name: Create flashable zip
        run: |
          cd AnyKernel3
          zip -r9 ../kernel.zip *

      # =========================
      # Sign zip (zipsigner)
      # =========================
      - name: Sign zip
        run: |
          curl -L -o zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
          java -jar zipsigner.jar kernel.zip kernel-signed.zip

      # =========================
      # Upload artifact
      # =========================
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-signed
          path: kernel-signed.zip
