name: Build Kernel (violet | KSU Next 1.1.1)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/violet-perf_defconfig
      KSU_VERSION: v1.1.1
      KSU_COMMIT: 0d6bdc63

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Verify kernel root
      run: |
        if [ ! -d "drivers" ]; then
          echo "❌ ERROR: drivers/ not found"
          exit 127
        fi

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libssl-dev libelf-dev \
          zip unzip python3

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup toolchain
      run: |
        echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    - name: Apply KernelSU Next v1.1.1 (LOCKED)
      run: |
        rm -rf ksu KernelSU-Next

        git clone --depth=1 --branch $KSU_VERSION \
          https://github.com/KernelSU-Next/KernelSU-Next.git ksu

        cd ksu
        git checkout $KSU_COMMIT
        cd ..

        # منع أي auto-upgrade
        sed -i '/git fetch --tags/d' ksu/setup.sh
        sed -i '/git describe/d' ksu/setup.sh
        sed -i '/latest tag/d' ksu/setup.sh

        # تشغيل setup من جذر الكيرنل
        bash ksu/setup.sh

    - name: Load defconfig
      run: |
        make O=out $DEFCONFIG

    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log

    - name: Collect artifacts
      run: |
        mkdir -p artifacts
        cp out/arch/arm64/boot/Image.gz artifacts/
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img artifacts/ || true
        cp out/.config artifacts/kernel.config
        cp build.log artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: violet-kernel-build
        path: artifacts/*
