name: "🚀 Build Kernel with KernelSU (stable-1134)"

on:
  workflow_dispatch:  # إزالة trigger التلقائي لتجنب البناء عند كل push

env:
  # Basic Configuration
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  
  # Directories
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  
  # File Names
  ZIP_NAME: "xcalibur-ksu-${{ github.run_number }}.zip"
  SIGNED_ZIP_NAME: "xcalibur-ksu-${{ github.run_number }}-signed.zip"
  
  # KernelSU Configuration
  KSU_KERNEL_BRANCH: "stable-1134"
  
  # Toolchain
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # زد الوقت لأنها أول مرة
    
    steps:
    # ==================== 1. GET SOURCE ====================
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ==================== 2. INSTALL TOOLS ====================
    - name: "📦 Install dependencies"
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
          make python3 wget zip default-jre patch \
          lld llvm  # 🔥 FIX 1: أضف هذه
        echo "✅ Dependencies installed"

    # ==================== 3. SETUP TOOLCHAIN ====================
    - name: "🔧 Setup toolchain"
      run: |
        echo "Downloading toolchain..."
        wget -q ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
        mkdir -p ${{ env.TOOLCHAIN_DIR }}
        tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
        rm -f clang.tar.gz
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        echo "✅ Toolchain ready"

    # ==================== 4. INSTALL KERNELSU ====================
    - name: "📦 Install KernelSU"
      id: install_ksu
      run: |
        echo "Installing KernelSU ${{ env.KSU_KERNEL_BRANCH }}..."
        git clone https://github.com/KernelSU-Next/KernelSU.git \
          --depth=1 \
          --branch "${{ env.KSU_KERNEL_BRANCH }}" \
          /tmp/kernelsu
        
        mkdir -p drivers/kernelsu
        cp -rf /tmp/kernelsu/kernel/* drivers/kernelsu/
        rm -rf /tmp/kernelsu
        
        # 🔥 FIX 2: أضف KernelSU لنظام البناء
        echo "Adding KernelSU to build system..."
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        fi
        
        if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        fi
        
        if [ -f "drivers/kernelsu/core.c" ]; then
          echo "✅ KernelSU installed"
          echo "installed=true" >> $GITHUB_OUTPUT
        else
          echo "installed=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    # ==================== 5. APPLY PATCHES ====================
    - name: "🔨 Apply KernelSU patches"
      if: steps.install_ksu.outputs.installed == 'true'
      run: |
        echo "Applying KernelSU patches..."
        git clone https://github.com/Jonjeexe/KernelSU_Patches.git \
          --depth=1 \
          /tmp/ksu-patches
        
        for patch in /tmp/ksu-patches/0*.patch; do
          patch -p1 --forward < "$patch" 2>/dev/null || true
        done
        
        rm -rf /tmp/ksu-patches
        echo "✅ Patches applied"

    # ==================== 6. CONFIGURE KERNEL ====================
    - name: "⚙️ Configure kernel"
      run: |
        echo "Configuring kernel..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # أضف KernelSU config
        echo "CONFIG_KSU=y" >> ${{ env.OUTPUT_DIR }}/.config
        echo "CONFIG_KSU_DEBUG=n" >> ${{ env.OUTPUT_DIR }}/.config
        
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        echo "✅ Kernel configured"

    # ==================== 7. COMPILE KERNEL ====================
    - name: "🚀 Compile kernel"
      run: |
        echo "Compiling kernel..."
        
        make -j$(nproc) \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="clang" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          LLVM=1 \
          2>&1 | tee build.log
        
        echo "✅ Build completed"

    # ==================== 8. VERIFY BUILD ====================
    - name: "✅ Verify build"
      id: verify
      run: |
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          echo "build_success=true" >> $GITHUB_OUTPUT
          echo "✅ Kernel built successfully"
        else
          echo "build_success=false" >> $GITHUB_OUTPUT
          echo "❌ Build failed"
          exit 1
        fi

    # ==================== 9. PACKAGE KERNEL ====================
    - name: "📦 Package kernel"
      if: steps.verify.outputs.build_success == 'true'
      run: |
        echo "Packaging kernel..."
        
        # Setup AnyKernel3
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3 -b sixteen ${{ env.ANYKERNEL_DIR }}
        
        # Copy kernel files
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz ${{ env.ANYKERNEL_DIR }}/
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img ${{ env.ANYKERNEL_DIR }}/ 2>/dev/null || true
        
        # Create zip
        cd ${{ env.ANYKERNEL_DIR }}
        zip -r9 ../${{ env.ZIP_NAME }} * > /dev/null
        cd ..
        
        # Sign zip
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar -O zipsigner.jar
        java -jar zipsigner.jar ${{ env.ZIP_NAME }} ${{ env.SIGNED_ZIP_NAME }}
        
        echo "✅ Package created: ${{ env.SIGNED_ZIP_NAME }}"

    # ==================== 10. UPLOAD ARTIFACTS ====================
    - name: "📤 Upload artifacts"
      if: steps.verify.outputs.build_success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          ${{ env.SIGNED_ZIP_NAME }}
          build.log
        retention-days: 30
