name: Build Kernel (violet | KernelSU Next v1.1.1)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout kernel source
        uses: actions/checkout@v4

      # =========================
      # Dependencies
      # =========================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev lz4 rsync unzip zip \
            python3 openjdk-17-jre

      # =========================
      # Proton Clang
      # =========================
      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # =========================
      # KernelSU Next v1.1.1 (LOCKED)
      # =========================
      - name: Apply KernelSU Next v1.1.1
        run: |
          rm -rf ksu KernelSU-Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu
          cd ksu
          git checkout v1.1.1
          cd ..
          # دمج السورس فقط (بدون setup.sh)
          cp -r ksu/kernel/* ./

      # =========================
      # Defconfig
      # =========================
      - name: Load defconfig
        run: |
          make O=out vendor/violet-perf_defconfig

      # =========================
      # Build Kernel
      # =========================
      - name: Build kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1

      # =========================
      # AnyKernel3
      # =========================
      - name: Package AnyKernel3
        run: |
          git clone https://github.com/Joker-V2/AnyKernel3.git -b sixteen AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3.zip *

      # =========================
      # Zipsigner
      # =========================
      - name: Sign ZIP
        run: |
          curl -L -o zipsigner.jar \
            https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
          java -jar zipsigner.jar AnyKernel3.zip Violet-KSU-v1.1.1-signed.zip

      # =========================
      # Upload
      # =========================
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Violet-KernelSU-Next-v1.1.1
          path: Violet-KSU-v1.1.1-signed.zip
