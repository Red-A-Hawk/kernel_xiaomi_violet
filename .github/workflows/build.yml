name: Build - Fixed for Flashing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: 🧹 Free Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        
    - name: 🔧 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex \
        git libssl-dev libncurses5-dev lzop zip wget python3
        
    - name: 💾 Setup Swap
      run: |
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1G count=10
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h
        
    - name: 🔐 Add KernelSU Next
      run: |
        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU
        echo "✅ KernelSU Next added"
        
    - name: 📦 Download Clang
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        mkdir clang
        tar -xf Clang-*.tar.gz -C clang/
        rm Clang-*.tar.gz
        ./clang/bin/clang --version
        
    - name: ⚙️ Generate Config
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        make O=out vendor/violet-perf_defconfig 2>/dev/null || \
        make O=out violet-perf_defconfig 2>/dev/null || \
        make O=out violet_defconfig
        
    - name: 🔨 Compile Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        START=$(date +%s)
        
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          2>&1 | tee build.log
        
        END=$(date +%s)
        echo "BUILD_TIME=$((($END - $START) / 60))m" >> $GITHUB_ENV
        
    - name: ✔️ Check Build
      id: check
      run: |
        if [[ -f out/arch/arm64/boot/Image.gz ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Build successful"
        else
          echo "success=false" >> $GITHUB_OUTPUT
        fi
        
    - name: 📦 Create Proper AnyKernel3 ZIP (Joker-V2 - Sixteen)
      if: steps.check.outputs.success == 'true'
      run: |
        echo "📥 Cloning Joker-V2 AnyKernel3 (sixteen branch)..."
        
        # Clone specific AnyKernel3 for Violet/Sixteen
        git clone -q https://github.com/Joker-V2/AnyKernel3 -b sixteen AK3
        
        cd AK3
        
        echo "📋 AnyKernel3 Info:"
        echo "  Branch: sixteen"
        echo "  Configured for: Xiaomi Violet"
        
        # Copy kernel files
        cp ../out/arch/arm64/boot/Image.gz .
        echo "✅ Image.gz copied"
        
        # Copy dtbo if exists
        if [ -f ../out/arch/arm64/boot/dtbo.img ]; then
          cp ../out/arch/arm64/boot/dtbo.img .
          echo "✅ dtbo.img copied"
        else
          echo "⚠️ No dtbo.img found (kernel only)"
        fi
        
        # Create ZIP
        ZIPNAME="Violet-KSU-Sixteen-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../${ZIPNAME} * -x .git README.md .gitignore
        cd ..
        
        echo "✅ Flashable ZIP created:"
        ls -lh ${ZIPNAME}
        echo "  Size: $(du -h ${ZIPNAME} | cut -f1)"
        
    - name: 📤 Upload
      if: steps.check.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Fixed-${{ github.run_number }}
        path: Violet-KSU-Fixed-*.zip
        
    - name: 📤 Upload Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: build.log
        
    - name: 📋 Flash Instructions
      if: steps.check.outputs.success == 'true'
      run: |
        echo "## 📱 How to Flash" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the ZIP from Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Boot into TWRP/OrangeFox Recovery" >> $GITHUB_STEP_SUMMARY
        echo "3. Flash the ZIP" >> $GITHUB_STEP_SUMMARY
        echo "4. **Important:** Wipe Dalvik/ART Cache" >> $GITHUB_STEP_SUMMARY
        echo "5. Reboot" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⚠️ **If bootloop:** Flash stock kernel to restore" >> $GITHUB_STEP_SUMMARY
