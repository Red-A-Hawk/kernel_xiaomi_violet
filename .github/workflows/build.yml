name: Kernel Build (violet | KSU Next 1.1.1 | AnyKernel3)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            git curl zip unzip \
            openjdk-11-jre-headless

      # ===== Proton Clang =====
      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      # ===== KernelSU Next v1.1.1 =====
      - name: Apply KernelSU Next v1.1.1
        run: |
          rm -rf KernelSU-Next
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout v1.1.1
          cd ..
          bash KernelSU-Next/kernel/setup.sh

      # ===== Defconfig =====
      - name: Load defconfig
        run: |
          make O=out ARCH=arm64 vendor/violet-perf_defconfig

      # ===== Build Kernel =====
      - name: Build kernel
        run: |
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld

      # ===== AnyKernel3 =====
      - name: Clone AnyKernel3 (sixteen)
        run: |
          git clone -b sixteen https://github.com/Joker-V2/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git

      - name: Copy Image.gz and dtbo.img
        run: |
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/

      - name: Create flashable zip
        run: |
          cd AnyKernel3
          zip -r9 ../kernel-unsigned.zip *

      # ===== zipsigner =====
      - name: Download zipsigner
        run: |
          curl -L \
          https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar \
          -o zipsigner.jar

      - name: Sign zip
        run: |
          java -jar zipsigner.jar \
            kernel-unsigned.zip \
            kernel-KSU-Next-1.1.1-signed.zip

      # ===== Upload =====
      - name: Upload signed kernel
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel-KSU-1.1.1
          path: kernel-KSU-Next-1.1.1-signed.zip
