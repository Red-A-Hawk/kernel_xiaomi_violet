name: "Build Kernel with KernelSU Next v1.1.1"

on:
  workflow_dispatch:
  push:
    branches: [ sixteen-ksu ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    # ==================== 📥 1. GET KERNEL SOURCE ====================
    - name: "📥 Checkout Kernel Source"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: sixteen-ksu

    # ==================== 🧹 2. FREE DISK SPACE ====================
    - name: "🧹 Free Disk Space"
      run: |
        echo "🧹 Cleaning up space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo apt-get clean
        echo "✅ Space freed"
        df -h

    # ==================== 📦 3. INSTALL DEPENDENCIES ====================
    - name: "📦 Install Build Dependencies"
      run: |
        echo "📦 Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl \
          flex gcc-aarch64-linux-gnu git \
          libelf-dev libssl-dev libncurses5-dev lzop \
          make python3 wget zip default-jre \
          file binutils patchelf
        echo "✅ Dependencies installed"

    # ==================== 💾 4. SETUP 10GB SWAP ====================
    - name: "💾 Setup 10GB Swap"
      run: |
        echo "💾 Creating swap space..."
        sudo swapoff -a 2>/dev/null || true
        sudo dd if=/dev/zero of=/swapfile bs=1G count=10 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=100
        echo "✅ Swap configured:"
        free -h
        swapon --show

    # ==================== ⭐ 5. DOWNLOAD KERNELSU NEXT v1.1.1 ====================
    - name: "⭐ Download KernelSU Next v1.1.1"
      id: download_ksu
      run: |
        echo "========================================"
        echo "  KernelSU Next v1.1.1 Setup"
        echo "========================================"
        
        # Try multiple methods to get KernelSU
        echo ""
        echo "[1/3] Trying direct download from releases..."
        
        # Primary method: Download kernel-driver.tar.gz
        KSU_DRIVER_URL="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/kernel-driver.tar.gz"
        KSU_APK_URL="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/KernelSU_Next_v1.1.1_32920-release.apk"
        
        if wget -q --spider "$KSU_DRIVER_URL" 2>/dev/null; then
          echo "✅ Driver URL accessible"
          wget -q "$KSU_DRIVER_URL" -O kernelsu-driver.tar.gz
          
          if [ -f "kernelsu-driver.tar.gz" ]; then
            echo "✅ Driver downloaded successfully!"
            
            # Create kernelsu directory
            mkdir -p drivers/kernelsu
            
            # Extract driver
            echo "Extracting KernelSU driver..."
            tar -xf kernelsu-driver.tar.gz -C drivers/kernelsu/
            
            # Cleanup
            rm -f kernelsu-driver.tar.gz
            KSU_STATUS="v1.1.1_driver"
          fi
        else
          echo "❌ Driver URL not accessible"
          KSU_STATUS="failed"
        fi
        
        # Fallback: Git clone
        if [ "$KSU_STATUS" != "v1.1.1_driver" ]; then
          echo ""
          echo "[2/3] Trying git clone method..."
          
          if git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next kernelsu-git 2>/dev/null; then
            echo "✅ Git clone successful"
            mkdir -p drivers/kernelsu
            
            if [ -d "kernelsu-git/kernel" ]; then
              cp -rf kernelsu-git/kernel/* drivers/kernelsu/
              KSU_STATUS="v1.1.1_git"
            elif [ -d "kernelsu-git" ]; then
              # Try to find kernel files
              find kernelsu-git -name "*.c" -o -name "*.h" -o -name "Kconfig" -o -name "Makefile" | \
                while read file; do
                  cp --parents "$file" drivers/kernelsu/ 2>/dev/null || true
                done
              KSU_STATUS="v1.1.1_git_fallback"
            fi
            rm -rf kernelsu-git
          fi
        fi
        
        # Fallback 2: Use original KernelSU
        if [ -z "$KSU_STATUS" ] || [ "$KSU_STATUS" = "failed" ]; then
          echo ""
          echo "[3/3] Using original KernelSU v0.9.3 as fallback..."
          
          wget -q "https://github.com/tiann/KernelSU/archive/refs/tags/v0.9.3.tar.gz" -O kernelsu-fallback.tar.gz 2>/dev/null
          if [ -f "kernelsu-fallback.tar.gz" ]; then
            mkdir -p drivers/kernelsu
            tar -xf kernelsu-fallback.tar.gz --strip-components=1 -C drivers/kernelsu/
            rm -f kernelsu-fallback.tar.gz
            KSU_STATUS="v0.9.3_fallback"
          fi
        fi
        
        # Download APK
        echo ""
        echo "Downloading KernelSU APK..."
        if wget -q "$KSU_APK_URL" -O kernelsu.apk 2>/dev/null; then
          echo "✅ APK downloaded successfully"
          APK_STATUS="v1.1.1"
        else
          # Fallback APK
          wget -q "https://github.com/tiann/KernelSU/releases/download/v0.9.3/KernelSU_v0.9.3_11500-release.apk" -O kernelsu.apk 2>/dev/null
          if [ -f "kernelsu.apk" ]; then
            echo "⚠️ Using fallback APK v0.9.3"
            APK_STATUS="v0.9.3"
          fi
        fi
        
        # Verification
        echo ""
        echo "========================================"
        echo "KernelSU Setup Status:"
        echo "Driver: $KSU_STATUS"
        echo "APK: $APK_STATUS"
        
        if [ -d "drivers/kernelsu" ] && [ "$(ls -A drivers/kernelsu 2>/dev/null | wc -l)" -gt 0 ]; then
          echo "✅ KernelSU driver files found: $(find drivers/kernelsu -type f | wc -l) files"
          echo "KSU_STATUS=$KSU_STATUS" >> $GITHUB_OUTPUT
        else
          echo "❌ No KernelSU driver files found!"
          echo "KSU_STATUS=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "========================================"

    # ==================== 🔧 6. DOWNLOAD ZyC CLANG ====================
    - name: "🔧 Download ZyC Clang 15.0.7"
      id: toolchain
      run: |
        echo "📥 Downloading ZyC Clang 15.0.7..."
        wget -q --show-progress https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        
        echo "📂 Extracting..."
        mkdir -p clang
        tar -xf Clang-15.0.7-20251111.tar.gz -C clang/
        rm Clang-15.0.7-20251111.tar.gz
        
        # Add to PATH
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH
        
        echo "✅ ZyC Clang ready"
        echo "📋 Version:"
        ./clang/bin/clang --version | head -3

    # ==================== ⚙️ 7. GENERATE KERNEL CONFIG ====================
    - name: "⚙️ Generate Kernel Config with KSU"
      id: config
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        echo "⚙️ Generating kernel configuration..."
        
        # Create output directory
        mkdir -p out
        
        # Try multiple defconfigs
        echo "Trying defconfig options..."
        
        if make O=out vendor/violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using vendor/violet-perf_defconfig"
        elif make O=out violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using violet-perf_defconfig"
        elif make O=out violet_defconfig 2>/dev/null; then
          echo "✅ Using violet_defconfig"
        else
          echo "❌ No valid defconfig found!"
          echo "Available configs:"
          ls arch/arm64/configs/ | grep -i violet || true
          exit 1
        fi
        
        # Add KernelSU configuration
        echo ""
        echo "Adding KernelSU configuration..."
        echo "# KernelSU Next v1.1.1" >> out/.config
        echo "CONFIG_KSU=y" >> out/.config
        echo 'CONFIG_KSU_NAME="KernelSU-Next"' >> out/.config
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
        echo "CONFIG_KSU_DEBUG=n" >> out/.config
        echo "CONFIG_KPROBES=y" >> out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> out/.config
        echo "CONFIG_OVERLAY_FS=y" >> out/.config
        
        # Update config
        make O=out ARCH=arm64 olddefconfig
        
        # Verify KSU config
        echo ""
        echo "KernelSU configuration check:"
        grep "CONFIG_KSU" out/.config || echo "⚠️ KSU config not found"
        
        echo "✅ Config generated successfully"

    # ==================== 🔨 8. COMPILE KERNEL ====================
    - name: "🔨 Compile Kernel"
      id: compile
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER=GitHub-Actions
        export KBUILD_BUILD_HOST=KernelSU-v1.1.1
        
        echo "🔨 Starting kernel compilation..."
        echo "KernelSU Version: v1.1.1"
        echo "Start time: $(date)"
        echo "💾 Memory before build:"
        free -h
        
        START=$(date +%s)
        
        # Build with optimization
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log
        
        BUILD_STATUS=$?
        END=$(date +%s)
        DIFF=$((END - START))
        
        echo ""
        echo "⏰ End time: $(date)"
        echo "⏱️ Build duration: $((DIFF / 60))m $((DIFF % 60))s"
        echo "BUILD_TIME=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
        echo "💾 Memory after build:"
        free -h
        
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "❌ Build failed with exit code $BUILD_STATUS"
          echo "Last 50 lines of build log:"
          tail -50 build.log
          echo "COMPILE_STATUS=failed" >> $GITHUB_OUTPUT
          exit $BUILD_STATUS
        else
          echo "✅ Build completed successfully"
          echo "COMPILE_STATUS=success" >> $GITHUB_OUTPUT
        fi

    # ==================== ✅ 9. VERIFY BUILD OUTPUT ====================
    - name: "✅ Verify Build Output"
      id: verify
      run: |
        echo "🔍 Verifying build output..."
        
        IMAGE=out/arch/arm64/boot/Image.gz
        DTBO=out/arch/arm64/boot/dtbo.img
        VMLINUX=out/vmlinux
        
        ALL_FOUND=true
        
        echo "📁 Checking required files:"
        
        if [ -f "$IMAGE" ]; then
          IMG_SIZE=$(du -h "$IMAGE" | cut -f1)
          echo "✅ Image.gz - $IMG_SIZE"
        else
          echo "❌ Image.gz - MISSING"
          ALL_FOUND=false
        fi
        
        if [ -f "$DTBO" ]; then
          DTBO_SIZE=$(du -h "$DTBO" | cut -f1)
          echo "✅ dtbo.img - $DTBO_SIZE"
        else
          echo "❌ dtbo.img - MISSING"
          ALL_FOUND=false
        fi
        
        if [ -f "$VMLINUX" ]; then
          echo "✅ vmlinux - Found"
          
          # Check for KernelSU in binary
          echo "Checking for KernelSU strings in kernel..."
          if strings "$VMLINUX" 2>/dev/null | grep -q -i "kernelsu\|KSU\|1.1.1"; then
            echo "✅ KernelSU detected in kernel binary"
            KSU_IN_BINARY=true
          else
            echo "⚠️ KernelSU not found in kernel binary"
            KSU_IN_BINARY=false
          fi
        else
          echo "❌ vmlinux - MISSING"
          ALL_FOUND=false
          KSU_IN_BINARY=false
        fi
        
        if [ "$ALL_FOUND" = true ]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "KSU_IN_BINARY=$KSU_IN_BINARY" >> $GITHUB_OUTPUT
          echo "✅ All build artifacts verified successfully"
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Missing build artifacts"
          exit 1
        fi

    # ==================== 📦 10. CREATE FLASHABLE ZIP ====================
    - name: "📦 Create Flashable ZIP"
      if: steps.verify.outputs.success == 'true'
      run: |
        echo "📦 Creating flashable ZIP..."
        
        # Clone AnyKernel3
        echo "Downloading AnyKernel3..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
        
        # Copy kernel files
        echo "Copying kernel files..."
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        
        # Add KernelSU APK if available
        if [ -f "kernelsu.apk" ]; then
          echo "Adding KernelSU APK..."
          mkdir -p AK3/apk
          cp kernelsu.apk AK3/apk/KernelSU_Next_v1.1.1.apk
        fi
        
        # Create build info
        echo "Creating build information..."
        cat > AK3/build_info.txt << EOF
=== Kernel Build Information ===
Kernel: xcalibur-v5.3-violet-dynamic-ksu
Device: Xiaomi Violet (Redmi Note 7 Pro)
KernelSU: Next v1.1.1
Build Date: $(date)
Build Time: ${{ env.BUILD_TIME }}
Compiler: ZyC Clang 15.0.7
KSU Status: ${{ steps.download_ksu.outputs.KSU_STATUS }}
KSU in Binary: ${{ steps.verify.outputs.KSU_IN_BINARY }}
Git Commit: $(git log --oneline -1)
EOF
        
        # Create ZIP
        cd AK3
        ZIPNAME="Violet-KSU-v1.1.1-ZyC15-$(date +%Y%m%d-%H%M).zip"
        echo "Creating: $ZIPNAME"
        zip -r9 ../"$ZIPNAME" * -x .git README.md .gitignore > /dev/null
        cd ..
        
        # Sign the ZIP
        echo "Signing ZIP..."
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar -O zipsigner.jar
        java -jar zipsigner.jar "$ZIPNAME" "${ZIPNAME%.zip}-signed.zip"
        
        # Final result
        SIGNED_ZIP="${ZIPNAME%.zip}-signed.zip"
        echo "✅ Package created: $SIGNED_ZIP"
        echo "  Size: $(du -h "$SIGNED_ZIP" | cut -f1)"
        echo "FINAL_ZIP=$SIGNED_ZIP" >> $GITHUB_ENV

    # ==================== 📤 11. UPLOAD ARTIFACTS ====================
    - name: "📤 Upload Kernel ZIP"
      if: steps.verify.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Violet-KSU-v1.1.1-${{ github.run_number }}
        path: |
          *-signed.zip
          kernelsu.apk
        retention-days: 30
        if-no-files-found: warn

    - name: "📤 Upload Build Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log-${{ github.run_number }}
        path: |
          build.log
          out/.config
        retention-days: 7

    # ==================== 📊 12. BUILD SUMMARY ====================
    - name: "📊 Build Summary"
      if: always()
      run: |
        echo "## 🚀 Kernel Build with KernelSU Next v1.1.1" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 📊 Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Device:** Xiaomi Violet (Redmi Note 7 Pro)" >> $GITHUB_STEP_SUMMARY
        echo "- **Compiler:** ZyC Clang 15.0.7 (11 Nov 2024)" >> $GITHUB_STEP_SUMMARY
        echo "- **KernelSU:** Next v1.1.1" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** sixteen-ksu" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **KSU Status:** ${{ steps.download_ksu.outputs.KSU_STATUS }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.verify.outputs.success }}" == "true" ]; then
          echo "### ✅ **BUILD SUCCESSFUL!** 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel ZIP:** ${{ env.FINAL_ZIP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KSU in Binary:** ${{ steps.verify.outputs.KSU_IN_BINARY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Includes:** KernelSU Manager APK v1.1.1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### ⚡ Flash Instructions" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the ZIP from **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "2. Boot to TWRP/OrangeFox Recovery" >> $GITHUB_STEP_SUMMARY
          echo "3. Flash the ZIP file" >> $GITHUB_STEP_SUMMARY
          echo "4. Reboot and install KernelSU Manager" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### 🔧 Features" >> $GITHUB_STEP_SUMMARY
          echo "- Full KernelSU Next v1.1.1 integration" >> $GITHUB_STEP_SUMMARY
          echo "- Signed flashable package" >> $GITHUB_STEP_SUMMARY
          echo "- Enhanced performance and stability" >> $GITHUB_STEP_SUMMARY
          
        else
          echo "### ❌ **BUILD FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔍 Debug Information" >> $GITHUB_STEP_SUMMARY
          echo "- **KSU Status:** ${{ steps.download_ksu.outputs.KSU_STATUS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Compile Status:** ${{ steps.compile.outputs.COMPILE_STATUS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verify Status:** ${{ steps.verify.outputs.success }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### 💡 Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "1. Check **Build-Log** artifact for errors" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify KernelSU driver files" >> $GITHUB_STEP_SUMMARY
          echo "3. Check kernel configuration" >> $GITHUB_STEP_SUMMARY
          echo "4. Ensure sufficient memory/swap space" >> $GITHUB_STEP_SUMMARY
        fi
