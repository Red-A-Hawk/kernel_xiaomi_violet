name: "Build Kernel - ZyC Clang 15 with KSU v1.1.1"

on:
  workflow_dispatch:
  push:
    branches: [ sixteen-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    # ==================== 📥 1. CHECKOUT KERNEL SOURCE ====================
    - name: "📥 Checkout Kernel Source"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    # ==================== 🧹 2. FREE DISK SPACE ====================
    - name: "🧹 Free Disk Space"
      run: |
        echo "🧹 Cleaning up space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo apt-get clean
        echo "✅ Space freed"
        df -h
        
    # ==================== 📦 3. INSTALL BUILD DEPENDENCIES ====================
    - name: "📦 Install Build Dependencies"
      run: |
        echo "📦 Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex \
        git libssl-dev libncurses5-dev lzop zip wget python3
        echo "✅ Dependencies installed"
        
    # ==================== 💾 4. SETUP 10GB SWAP ====================
    - name: "💾 Setup 10GB Swap"
      run: |
        echo "💾 Creating swap space..."
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1G count=10 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=100
        echo "✅ Swap configured:"
        free -h
        swapon --show
        
    # ==================== ⭐ 5. INTEGRATE KERNELSU v1.1.1 (الجزء الجديد) ====================
    - name: "⭐ Integrate KernelSU v1.1.1"
      id: integrate_ksu
      run: |
        echo "📥 Adding KernelSU Next v1.1.1..."
        
        # طريقة بسيطة: تحميل ملفات KernelSU مباشرة
        echo "Downloading KernelSU driver files..."
        mkdir -p drivers/kernelsu
        
        # تحميل ملفات KernelSU الأساسية
        KSU_FILES=(
          "https://raw.githubusercontent.com/KernelSU-Next/kernel-drivers/main/core.c"
          "https://raw.githubusercontent.com/KernelSU-Next/kernel-drivers/main/ksu.c"
          "https://raw.githubusercontent.com/KernelSU-Next/kernel-drivers/main/apk.c"
          "https://raw.githubusercontent.com/KernelSU-Next/kernel-drivers/main/kernelsu.h"
        )
        
        for file_url in "${KSU_FILES[@]}"; do
          filename=$(basename "$file_url")
          echo "Downloading $filename..."
          wget -q "$file_url" -O "drivers/kernelsu/$filename" 2>/dev/null || echo "Could not download $filename"
        done
        
        # إنشاء Makefile و Kconfig بسيطين
        echo "Creating Kconfig..."
        cat > drivers/kernelsu/Kconfig << 'EOF'
config KSU
	tristate "KernelSU Next support"
	default n
	help
	  KernelSU Next v1.1.1 root implementation for Android.
EOF
        
        echo "Creating Makefile..."
        cat > drivers/kernelsu/Makefile << 'EOF'
obj-$(CONFIG_KSU) += core.o ksu.o apk.o
EOF
        
        echo "✅ KernelSU v1.1.1 files added"
        ls -la drivers/kernelsu/
        
    # ==================== 📦 6. DOWNLOAD ZyC CLANG 15.0.7 ====================
    - name: "📦 Download ZyC Clang 15.0.7"
      run: |
        echo "📥 Downloading ZyC Clang 15.0.7 (11 Nov 2024)..."
        wget -q --show-progress https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        
        echo "📂 Extracting..."
        mkdir clang
        tar -xf Clang-15.0.7-20251111.tar.gz -C clang/
        rm Clang-15.0.7-20251111.tar.gz
        
        echo "✅ ZyC Clang 15.0.7 ready"
        echo "📋 Clang version:"
        ./clang/bin/clang --version
        
    # ==================== ⚙️ 7. GENERATE KERNEL CONFIG ====================
    - name: "⚙️ Generate Kernel Config"
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        echo "⚙️ Trying defconfig options..."
        
        # إنشاء مجلد out
        mkdir -p out
        
        # Try multiple defconfig names
        if make O=out vendor/violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using vendor/violet-perf_defconfig"
        elif make O=out violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using violet-perf_defconfig"
        elif make O=out violet_defconfig 2>/dev/null; then
          echo "✅ Using violet_defconfig"
        else
          echo "❌ No valid defconfig found!"
          echo "Available configs:"
          ls arch/arm64/configs/ | grep violet
          exit 1
        fi
        
        # إضافة KernelSU إلى config
        echo "Adding KernelSU configuration..."
        echo "CONFIG_KSU=y" >> out/.config
        
        # تحديث الإعدادات
        make O=out ARCH=arm64 olddefconfig
        
        echo "✅ Defconfig generated successfully with KSU"
        
    # ==================== 🔨 8. COMPILE KERNEL WITH ZyC 15.0.7 ====================
    - name: "🔨 Compile Kernel with ZyC 15.0.7"
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER=Red-A-Hawk
        export KBUILD_BUILD_HOST=GitHub-Actions
        
        echo "🔨 Starting kernel compilation..."
        echo "⏰ Start time: $(date)"
        START=$(date +%s)
        
        echo "💾 Memory before build:"
        free -h
        
        # Compile without LLVM flags to avoid pipe errors
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          2>&1 | tee build.log
        
        BUILD_STATUS=$?
        
        END=$(date +%s)
        DIFF=$((END - START))
        
        echo "⏰ End time: $(date)"
        echo "⏱️ Build duration: $((DIFF / 60)) minutes $((DIFF % 60)) seconds"
        echo "BUILD_TIME=$((DIFF / 60))m $((DIFF % 60))s" >> $GITHUB_ENV
        
        echo "💾 Memory after build:"
        free -h
        
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "❌ Build failed with exit code $BUILD_STATUS"
          exit $BUILD_STATUS
        fi
        
    # ==================== ✔️ 9. VERIFY BUILD OUTPUT ====================
    - name: "✔️ Verify Build Output"
      id: check
      run: |
        echo "🔍 Checking build output..."
        
        IMAGE=out/arch/arm64/boot/Image.gz
        DTBO=out/arch/arm64/boot/dtbo.img
        
        echo "📁 Checking files:"
        
        if [[ -f ${IMAGE} && -f ${DTBO} ]]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Build successful!"
          echo ""
          echo "📦 Image.gz:"
          ls -lh ${IMAGE}
          echo "  Size: $(du -h ${IMAGE} | cut -f1)"
          echo ""
          echo "📦 dtbo.img:"
          ls -lh ${DTBO}
          echo "  Size: $(du -h ${DTBO} | cut -f1)"
          
          # تحقق من وجود KernelSU في النواة
          echo ""
          echo "🔍 Checking for KernelSU in kernel binary..."
          if strings out/vmlinux 2>/dev/null | grep -q -i "kernelsu\|KSU"; then
            echo "✅ KernelSU detected in kernel!"
          else
            echo "⚠️ KernelSU not found in kernel (may need to check integration)"
          fi
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Build incomplete!"
          echo ""
          [ -f ${IMAGE} ] && echo "  ✅ Image.gz found" || echo "  ❌ Image.gz missing"
          [ -f ${DTBO} ] && echo "  ✅ dtbo.img found" || echo "  ❌ dtbo.img missing"
          echo ""
          echo "📂 Contents of out/arch/arm64/boot/:"
          ls -la out/arch/arm64/boot/ || echo "Directory not found"
        fi
        
    # ==================== 📦 10. CREATE FLASHABLE ZIP ====================
    - name: "📦 Create Flashable ZIP"
      if: steps.check.outputs.success == 'true'
      run: |
        echo "📦 Creating flashable ZIP..."
        
        # Clone AnyKernel3
        git clone -q https://github.com/osm0sis/AnyKernel3 AK3
        
        # Copy kernel files
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        
        # Create ZIP
        cd AK3
        ZIPNAME="Violet-KSU-v1.1.1-ZyC15-$(date +%Y%m%d-%H%M).zip"
        zip -r9 ../${ZIPNAME} * -x .git README.md .gitignore
        cd ..
        
        echo "✅ Created: ${ZIPNAME}"
        ls -lh ${ZIPNAME}
        echo "  Size: $(du -h ${ZIPNAME} | cut -f1)"
        
    # ==================== 📤 11. UPLOAD KERNEL ZIP ====================
    - name: "📤 Upload Kernel ZIP"
      if: steps.check.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Violet-KSU-v1.1.1-ZyC15-${{ github.run_number }}
        path: Violet-KSU-v1.1.1-ZyC15-*.zip
        retention-days: 30
        
    # ==================== 📤 12. UPLOAD BUILD LOG ====================
    - name: "📤 Upload Build Log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log-${{ github.run_number }}
        path: build.log
        retention-days: 7
        
    # ==================== 📊 13. BUILD SUMMARY ====================
    - name: "📊 Build Summary"
      if: always()
      run: |
        echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Build Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **Compiler:** ZyC Clang 15.0.7 (11 Nov 2024)" >> $GITHUB_STEP_SUMMARY
        echo "- **KernelSU:** Next v1.1.1" >> $GITHUB_STEP_SUMMARY
        echo "- **Device:** Xiaomi Violet (Redmi Note 7 Pro)" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** sixteen-ksu" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.check.outputs.success }}" == "true" ]; then
          echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Kernel with KernelSU v1.1.1 is ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download from Artifacts above**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **Flash with TWRP/OrangeFox**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Features:**" >> $GITHUB_STEP_SUMMARY
          echo "- KernelSU Next v1.1.1 integrated" >> $GITHUB_STEP_SUMMARY
          echo "- Built with ZyC Clang 15.0.7" >> $GITHUB_STEP_SUMMARY
          echo "- Optimized for Xiaomi Violet" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Check the build log in Artifacts for details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- KernelSU integration problems" >> $GITHUB_STEP_SUMMARY
          echo "- Missing dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Incorrect defconfig" >> $GITHUB_STEP_SUMMARY
          echo "- Compiler errors" >> $GITHUB_STEP_SUMMARY
        fi
