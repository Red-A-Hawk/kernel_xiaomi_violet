name: Build Kernel (violet | ZyCromerZ Clang)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git gnupg \
          libssl-dev libelf-dev lld llvm \
          python3 unzip zip

    - name: Download ZyCromerZ Clang 22
      run: |
        git clone --depth=1 https://github.com/ZyCromerZ/Clang.git clang

    - name: Setup toolchain env
      run: |
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV

    - name: Verify clang
      run: clang --version

    - name: Setup KernelSU Next (official)
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu
        bash ksu/kernel/setup.sh

    - name: Load defconfig
      run: |
        make O=out \
          ARCH=arm64 \
          vendor/violet-perf_defconfig

    - name: Enable KernelSU + SUSFS
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_SUSFS
        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel (LLVM)
      run: |
        make -j4 \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=0

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image
        path: out/arch/arm64/boot/Image
