name: Build Kernel (violet | KSU Next + SUSFS | ZyC Clang 22 - FIXED)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # ⚠️ مهم: غير من latest إلى 22.04

    env:
      JOBS: 4  # ⭐ إضافة هذا

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup 8GB swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev \
            make gcc gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            ccache curl git zip unzip

      - name: Download ZyCromerZ Clang 22
        run: |
          rm -rf clang
          mkdir clang
          cd clang
          curl -L https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz | tar -xz
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          clang --version
          ld.lld --version
          which aarch64-linux-gnu-gcc
          which arm-linux-gnueabi-gcc

      - name: Setup KernelSU Next
        run: |
          git submodule update --init --recursive

      - name: Load defconfig
        run: |
          make O=out ARCH=arm64 vendor/violet-perf_defconfig

      - name: Enable KernelSU + SUSFS
        run: |
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel (LLVM) - FIXED VERSION
        run: |
          # ⭐ استخدام JOBS=4 بدلاً من nproc
          # ⭐ إضافة ccache للذاكرة المؤقتة
          # ⭐ استخدام tee لحفظ الإخراج
          
          echo "🚀 Building with ZyC Clang 22 using ${{ env.JOBS }} jobs..."
          
          make -j${{ env.JOBS }} \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log
          
          # التحقق من نجاح البناء
          if [ -f "out/arch/arm64/boot/Image.gz" ] || [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Build SUCCESSFUL - Kernel image found!"
            ls -la out/arch/arm64/boot/
          else
            echo "❌ Build FAILED - Checking logs..."
            grep -i "error\|warning" build.log | tail -20
            exit 1
          fi

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image-ZyC-22-Fixed
          path: out/arch/arm64/boot/Image*
