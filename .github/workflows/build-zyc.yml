name: Build Kernel (violet | KSU Next + SUSFS | ZyCromerZ Clang)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex libssl-dev \
            make gcc gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            ccache curl git zip unzip

      - name: Download ZyCromerZ Clang 22
        run: |
          rm -rf clang
          mkdir clang
          cd clang
          curl -L https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz | tar -xz
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          clang --version
          ld.lld --version
          which aarch64-linux-gnu-gcc
          which arm-linux-gnueabi-gcc

      - name: Setup KernelSU Next
        run: |
          git submodule update --init --recursive

      - name: Load defconfig
        run: |
          make O=out ARCH=arm64 vendor/violet-perf_defconfig

      - name: Enable KernelSU + SUSFS
        run: |
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel (LLVM) with error handling
        id: build_kernel
        continue-on-error: true  # الاستمرار حتى مع الأخطاء
        run: |
          # تفريغ المخزن المؤقت
          sync
          
          # البناء مع حفظ الإخراج
          {
            make -j$(nproc) \
              O=out \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CC=clang \
              LD=ld.lld \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          } 2>&1 | tee /tmp/build_output.txt
          
          # حفظ رمز الخروج
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          
          # التحقق من وجود الصورة بغض النظر عن الخطأ
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ] || [ -f "out/arch/arm64/boot/Image.gz" ] || [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel image FOUND despite any errors"
            find out/arch/arm64/boot/ -type f | head -20
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No kernel image found"
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Check build result
        run: |
          echo "Build exit code: ${{ steps.build_kernel.outputs.exit_code }}"
          echo "Image found: ${{ steps.build_kernel.outputs.success }}"
          
          if [ "${{ steps.build_kernel.outputs.success }}" = "true" ]; then
            echo "✅ Continuing with upload..."
          else
            echo "❌ Build failed completely"
            exit 1
          fi

      - name: Upload Image
        if: steps.build_kernel.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-ZyC
          path: out/arch/arm64/boot/Image*
          
      - name: Upload build log on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log-Error
          path: /tmp/build_output.txt
