name: Build Kernel (violet | Proton Clang | KernelSU Next | AnyKernel3)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ===============================
    # Checkout kernel source
    # ===============================
    - name: Checkout kernel source
      uses: actions/checkout@v4

    # ===============================
    # Install dependencies
    # ===============================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make curl zip unzip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi \
          openjdk-11-jre

    # ===============================
    # Proton Clang
    # ===============================
    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup toolchain env
      run: |
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    # ===============================
    # KernelSU Next (OFFICIAL)
    # ===============================
    - name: Setup KernelSU Next
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu
        bash ksu/kernel/setup.sh

    # ===============================
    # Defconfig
    # ===============================
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # ===============================
    # Enable KernelSU + SUSFS
    # ===============================
    - name: Enable KernelSU + SUSFS
      run: |
        sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' out/.config
        sed -i 's/# CONFIG_SUSFS is not set/CONFIG_SUSFS=y/' out/.config
        make O=out olddefconfig

    # ===============================
    # Build kernel
    # ===============================
    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    # ===============================
    # AnyKernel3
    # ===============================
    - name: Prepare AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git AnyKernel3

        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/

    # ===============================
    # Create ZIP
    # ===============================
    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r ../kernel-violet-unsigned.zip *
        cd ..

    # ===============================
    # ZipSigner
    # ===============================
    - name: Sign zip
      run: |
        curl -L -o zipsigner.jar \
          https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

        java -jar zipsigner.jar \
          kernel-violet-unsigned.zip \
          kernel-violet-signed.zip

    # ===============================
    # Upload final zip
    # ===============================
    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Violet-Signed
        path: kernel-violet-signed.zip
        
