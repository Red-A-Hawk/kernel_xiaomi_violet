name: Build Kernel with KernelSU Next v1.1.1

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: sixteen

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex libssl-dev \
            make clang lld llvm \
            libelf-dev libncurses5-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            curl zip unzip

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Setup KernelSU Next v1.1.1
        run: |
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git
          cd KernelSU-Next
          git checkout v1.1.1
          cd ..
          bash KernelSU-Next/kernel/setup.sh

      - name: Export build environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Load defconfig
        run: |
          make O=out vendor/violet-perf_defconfig

      - name: Enable KernelSU basic config
        run: |
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KPROBE_EVENTS
          make O=out olddefconfig

      - name: Build kernel
        run: |
          make O=out -j$(nproc)
