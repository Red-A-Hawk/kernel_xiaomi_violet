name: Build Kernel with KernelSU Next v1.1.1 (non-GKI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1️⃣ KernelSU Next v1.1.1
    - name: Setup KernelSU Next v1.1.1
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.1.1/next/kernel/setup.sh | bash

    # 2️⃣ jonjeexe non-GKI patches
    - name: Apply KernelSU non-GKI patches
      run: |
        git clone https://github.com/jonjeexe/KernelSU_Patches.git
        cd KernelSU_Patches
        bash Patch.sh
        cd ..

    # 3️⃣ defconfig (مهم جدًا)
    - name: Enable KernelSU configs
      run: |
        echo "CONFIG_KSU=y" >> arch/arm64/configs/sixteen_defconfig
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/sixteen_defconfig

    # 4️⃣ Build kernel
    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make sixteen_defconfig
        make -j$(nproc)

    # 5️⃣ AnyKernel3
    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp arch/arm64/boot/Image AnyKernel3/

    # 6️⃣ Create zip
    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../KernelSU-Next-nonGKI.zip *

    # 7️⃣ Sign zip
    - name: Sign zip
      run: |
        curl -LO https://github.com/Zackptg5/ZipSigner/releases/download/3.0/zipsigner-3.0.jar
        java -jar zipsigner-3.0.jar KernelSU-Next-nonGKI.zip KernelSU-Next-nonGKI-signed.zip

    # 8️⃣ Upload
    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-nonGKI
        path: KernelSU-Next-nonGKI-signed.zip
