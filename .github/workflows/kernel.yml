name: Build Kernel Violet (Local Only)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clone kernel source (manual)
      run: |
        git clone --depth=1 -b sixteen \
        https://github.com/Red-A-Hawk/kernel_xiaomi_violet.git kernel
        cd kernel

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev \
          make git curl zip unzip \
          python3 openjdk-11-jre

    - name: Setup Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    - name: Setup KernelSU Next v1.1.1
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout v1.1.1
        cd ../kernel
        bash ../KernelSU-Next/kernel/setup.sh

    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LD=ld.lld
        export LLVM=1
        export LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make O=out vendor/violet-perf_defconfig

        scripts/config --file out/.config \
          -d CONFIG_COMPAT \
          -d CONFIG_COMPAT_VDSO \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK

        make O=out olddefconfig
        make -j$(nproc) O=out

    - name: Pack AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3.git AK3
        cp kernel/out/arch/arm64/boot/Image.gz AK3/
        cp kernel/out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 kernel-violet.zip *

    - name: Sign zip
      run: |
        cd AK3
        curl -L -o zipsigner.jar \
          https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar kernel-violet.zip kernel-violet-signed.zip

    - name: Done
      run: |
        echo "BUILD FINISHED ✅"
        ls -lh AK3/kernel-violet-signed.zip
