name: Build Kernel (violet | Proton Clang | KernelSU Next)

on:
  push:
    branches: [ sixteen ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make ccache curl zip unzip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    # 🔥 هذا هو الجزء المهم
    - name: Integrate KernelSU Next (official)
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    - name: Enable KernelSU + SUSFS
      run: |
        scripts/config --file out/.config \
          -e KSU \
          -e KSU_SUSFS \
          -e SUSFS \
          -e SUSFS_SUS_PATH \
          -e SUSFS_SUS_MOUNT \
          -e SUSFS_SUS_KSTAT \
          -e SUSFS_SUS_MAPS
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    - name: Upload Image.gz
      uses: actions/upload-artifact@v4
      with:
        name: Image-gz
        path: out/arch/arm64/boot/Image.gz
