name: "🚀 Build xcalibur-v5.4 with KernelSU v1.1.1"

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 تنظيف البناء السابق'
        required: false
        default: 'false'
      skip_apk:
        description: '⏭️ تخطي تنزيل APK'
        required: false
        default: 'false'

env:
  # ⚙️ الإعدادات الأساسية
  KERNEL_NAME: "xcalibur-v5.4-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  # 📁 هيكل المجلدات
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # 📦 أسماء الملفات
  KERNEL_ZIP_NAME: "xcalibur-ksu-${{ github.run_number }}-${{ env.DEVICE_CODENAME }}.zip"
  SIGNED_ZIP_NAME: "xcalibur-ksu-${{ github.run_number }}-${{ env.DEVICE_CODENAME }}-signed.zip"
  APK_NAME: "KernelSU_Manager_v1.1.1_hotfix.apk"
  
  # ⭐ إصدار KernelSU (نفس النجاح السابق)
  KSU_KERNEL_VERSION: "v1.1.1"
  KSU_APK_VERSION: "v1.1.1-hotfix"
  KSU_APK_URL: "https://github.com/tiann/KernelSU/releases/download/v1.1.1/KernelSU_v1.1.1_12174-release.apk"
  
  # 🔧 متطلباتك المحددة ⭐⭐⭐
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"
  ANY_KERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANY_KERNEL_BRANCH: "sixteen"
  
  TOOLCHAIN_PREFIX: "aarch64-linux-gnu-"
  JOBS: 4
  
  # ⚠️ إعدادات السلامة
  MAX_BUILD_TIME: 1200
  ALLOW_PATCH_FAILURES: 2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    # ==================== 1. بدء التجميع ====================
    - name: "🎬 بدء بناء xcalibur-v5.4"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║        🚀 XCALIBUR v5.4 + KernelSU v1.1.1           ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ 📱 الجهاز:    ${{ env.DEVICE_CODENAME }}            "
        echo "║ 🔧 النواة:     ${{ env.KERNEL_NAME }}               "
        echo "║ ⭐ KSU:       ${{ env.KSU_KERNEL_VERSION }}         "
        echo "║ 🛠️  المترجم:   Clang 22.0.0 (2025-09-20)           "
        echo "║ 🔨 الباتشات:   9 (6 تقليدية + 3 جديدة)             "
        echo "║ 🏗️  البيلد:    #${{ github.run_number }}            "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 $(date)"
        echo "🖥️  $(nproc) نواة معالجة"

    # ==================== 2. تنزيل مصدر النواة ====================
    - name: "📥 تنزيل مصدر النواة"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # ==================== 3. تنظيف اختياري ====================
    - name: "🧹 تنظيف البناء (اختياري)"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "🧹 تنظيف شامل..."
        rm -rf ${{ env.OUTPUT_DIR }} ${{ env.ANYKERNEL_DIR }} ${{ env.TOOLCHAIN_DIR }}
        make clean && make mrproper
        echo "✅ تم التنظيف"

    # ==================== 4. تثبيت متطلبات النظام ====================
    - name: "📦 تثبيت المتطلبات"
      run: |
        echo "📦 تثبيت حزم البناء..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
          make python3 wget zip default-jre-headless \
          lz4 lzma lzop zlib1g-dev libncurses-dev \
          libxml2-utils xxd rsync patchelf tree file
        
        # إعداد ccache للتسريع
        mkdir -p ~/.ccache
        echo "max_size = 2G" > ~/.ccache/ccache.conf
        echo "✅ المتطلبات مثبتة"

    # ==================== 5. إعداد Clang 22.0.0 ====================
    - name: "🔧 إعداد Clang 22.0.0"
      id: setup_toolchain
      run: |
        echo "🔧 تثبيت Clang 22.0.0 (سبتمبر 2025)..."
        
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "⬇️  جاري تنزيل من: ${{ env.TOOLCHAIN_URL }}"
          wget -q --show-progress "${{ env.TOOLCHAIN_URL }}" -O /tmp/clang.tar.gz
          
          echo "📁 فك الضغط..."
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf /tmp/clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f /tmp/clang.tar.gz
          
          echo "✅ Clang 22 مثبت:"
          ${{ env.TOOLCHAIN_DIR }}/bin/clang --version | head -2
        else
          echo "⚡ Clang موجود مسبقاً"
        fi
        
        # إضافة للمسار
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        echo "🎯 الأداة جاهزة"

    # ==================== 6. تثبيت KernelSU v1.1.1 ====================
    - name: "📦 تثبيت KernelSU"
      id: install_ksu
      run: |
        echo "📦 إضافة KernelSU v1.1.1..."
        
        # تنظيف أي نسخة قديمة
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # تنزيل KernelSU
        echo "⬇️  جاري تنزيل KernelSU..."
        git clone https://github.com/tiann/KernelSU.git \
          --depth=1 \
          --branch "main" \
          /tmp/kernelsu
        
        # نسخ الملفات
        mkdir -p drivers/kernelsu
        cp -rf /tmp/kernelsu/kernel/* drivers/kernelsu/
        
        # التحقق
        if [ -f "drivers/kernelsu/core.c" ] && [ -f "drivers/kernelsu/kernel_compat.c" ]; then
          echo "✅ KernelSU مثبت"
          KSU_VER=$(grep -m1 "KSU_VERSION" drivers/kernelsu/core.c | cut -d'"' -f2 || echo "v1.1.1")
          echo "📊 الإصدار: $KSU_VER"
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
        else
          echo "❌ فشل تثبيت KernelSU"
          exit 1
        fi

    # ==================== 7. تطبيق 9 باتشات ====================
    - name: "🔨 تطبيق 9 باتشات"
      if: steps.install_ksu.outputs.ksu_installed == 'true'
      id: apply_patches
      run: |
        echo "🔨 تطبيق 9 باتشات هجينة..."
        echo "============================="
        
        # إنشاء نقطة استعادة
        git add -A
        git stash save "قبل-الباتشات-$(date +%s)" || true
        
        # 📌 الجزء 1: 6 باتشات تقليدية
        echo ""
        echo "1️⃣  6 Traditional Patches"
        echo "------------------------"
        
        git clone https://github.com/Jonjeexe/KernelSU_Patches.git \
          --depth=1 \
          /tmp/traditional-patches
        
        APPLIED=0
        FAILED=0
        
        for i in {1..6}; do
          PATCH_FILE=$(find /tmp/traditional-patches -name "$(printf "%04d" $i)-*.patch" | head -1)
          
          if [ -f "$PATCH_FILE" ]; then
            echo "   [$i/6] $(basename $PATCH_FILE)"
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "      ✅ تم"
              APPLIED=$((APPLIED + 1))
            elif patch -p1 --reverse --check --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "      ⚡ مطبق مسبقاً"
              APPLIED=$((APPLIED + 1))
            else
              echo "      ⚠️  فشل (متجاهل)"
              FAILED=$((FAILED + 1))
            fi
          fi
        done
        
        # 📌 الجزء 2: 3 باتشات جديدة
        echo ""
        echo "2️⃣  3 New Non-GKI Patches"
        echo "-------------------------"
        
        git clone https://github.com/KernelSU-Next/kernel_patches.git \
          --depth=1 \
          /tmp/new-patches
        
        NEW_PATCHES=("0001-non-gki-core.patch" "0002-non-gki-hooks.patch" "0003-non-gki-modules.patch")
        
        for patch_name in "${NEW_PATCHES[@]}"; do
          PATCH_FILE="/tmp/new-patches/non-gki/$patch_name"
          
          if [ -f "$PATCH_FILE" ]; then
            echo "   $patch_name"
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "      ✅ تم"
              APPLIED=$((APPLIED + 1))
            elif patch -p1 --reverse --check --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "      ⚡ مطبق مسبقاً"
              APPLIED=$((APPLIED + 1))
            else
              echo "      ⚠️  فشل (متجاهل)"
              FAILED=$((FAILED + 1))
            fi
          else
            echo "   ❌ غير موجود: $patch_name"
            FAILED=$((FAILED + 1))
          fi
        done
        
        # 📊 النتيجة
        echo ""
        echo "📊 نتيجة تطبيق الباتشات:"
        echo "   ✅ ناجح: $APPLIED/9"
        echo "   ⚠️  فاشل: $FAILED/9"
        
        if [ $FAILED -gt ${{ env.ALLOW_PATCH_FAILURES }} ]; then
          echo "⚠️  فشل العديد من الباتشات، جاري الاستعادة..."
          git stash pop 2>/dev/null || true
        fi
        
        echo "patches_applied=$APPLIED" >> $GITHUB_OUTPUT

    # ==================== 8. تهيئة إعدادات النواة ====================
    - name: "⚙️ تهيئة Kernel Config"
      run: |
        echo "⚙️ إعداد kernel configuration..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # إنشاء config أولي
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # إضافة إعدادات KernelSU
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'

# ========================================
# KernelSU Configuration
# ========================================
CONFIG_KSU=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_EXFAT_SUPPORT=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_WHITELIST=y

# ========================================
# تحسينات Clang 22
# ========================================
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_LTO_CLANG_FULL=y
CONFIG_THINLTO=y
EOF
        
        # تحديث الإعدادات
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        
        echo "✅ الإعدادات جاهزة"

    # ==================== 9. تجميع النواة ====================
    - name: "🚀 تجميع النواة"
      id: compile_kernel
      timeout-minutes: 30
      run: |
        echo "🚀 بدء التجميع بـ Clang 22..."
        echo "============================="
        
        START_TIME=$(date +%s)
        BUILD_LOG="${{ github.workspace }}/build.log"
        
        # التجميع
        echo "🔨 جاري البناء (قد يستغرق 15-25 دقيقة)..."
        make -j${{ env.JOBS }} \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="ccache clang" \
          LD="ccache ld.lld" \
          AR="ccache llvm-ar" \
          NM="ccache llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          CLANG_TRIPLE="${{ env.TOOLCHAIN_PREFIX }}" \
          CROSS_COMPILE="${{ env.TOOLCHAIN_PREFIX }}" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee "$BUILD_LOG"
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        
        # التحقق من النجاح
        echo ""
        echo "🔍 التحقق من الناتج..."
        
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          IMAGE_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" | cut -f1)
          echo "✅ Image.gz: موجود ($IMAGE_SIZE)"
          echo "compile_status=success" >> $GITHUB_OUTPUT
          echo "⏱️  وقت البناء: ${BUILD_TIME} ثانية"
        else
          echo "❌ فشل: Image.gz غير موجود"
          echo "compile_status=failed" >> $GITHUB_OUTPUT
          
          # عرض الأخطاء
          echo ""
          echo "🔍 آخر الأخطاء:"
          tail -30 "$BUILD_LOG" | grep -i "error\|failed" | tail -10
          exit 1
        fi
        
        # إحصائيات
        WARNINGS=$(grep -i "warning:" "$BUILD_LOG" | wc -l || echo "0")
        ERRORS=$(grep -i "error:" "$BUILD_LOG" | wc -l || echo "0")
        
        echo "build_time=$BUILD_TIME" >> $GITHUB_ENV
        echo "warnings=$WARNINGS" >> $GITHUB_ENV
        echo "errors=$ERRORS" >> $GITHUB_ENV

    # ==================== 10. تنزيل KernelSU Manager ====================
    - name: "📱 تنزيل KernelSU APK"
      if: steps.compile_kernel.outputs.compile_status == 'success' && github.event.inputs.skip_apk != 'true'
      id: download_apk
      run: |
        echo "📱 تنزيل تطبيق KernelSU..."
        mkdir -p ${{ env.RELEASES_DIR }}
        
        echo "⬇️  من: ${{ env.KSU_APK_URL }}"
        if wget -q --show-progress "${{ env.KSU_APK_URL }}" -O "${{ env.RELEASES_DIR }}/${{ env.APK_NAME }}"; then
          APK_SIZE=$(du -h "${{ env.RELEASES_DIR }}/${{ env.APK_NAME }}" | cut -f1)
          echo "✅ تم: ${{ env.APK_NAME }} ($APK_SIZE)"
          echo "apk_downloaded=true" >> $GITHUB_OUTPUT
          
          # ملف معلومات
          cat > "${{ env.RELEASES_DIR }}/APK_INFO.txt" << EOF
          KernelSU Manager v1.1.1 Hotfix
          التوافق: KernelSU v1.1.1
          الحجم: $APK_SIZE
          
          تعليمات:
          1. فلاش النواة أولاً
          2. ثبت هذا التطبيق
          3. افتح KernelSU Manager
          EOF
        else
          echo "⚠️  فشل تنزيل APK"
          echo "apk_downloaded=false" >> $GITHUB_OUTPUT
        fi

    # ==================== 11. إعداد AnyKernel3 (branch sixteen) ====================
    - name: "📦 إعداد AnyKernel3"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      id: setup_anykernel
      run: |
        echo "📦 تحضير AnyKernel3 (branch: sixteen)..."
        
        rm -rf ${{ env.ANYKERNEL_DIR }}
        
        # تنزيل AnyKernel3
        echo "⬇️  جاري تنزيل AnyKernel3..."
        git clone --depth=1 \
          "${{ env.ANY_KERNEL_REPO }}" \
          -b "${{ env.ANY_KERNEL_BRANCH }}" \
          ${{ env.ANYKERNEL_DIR }}
        
        # تنظيف الملفات القديمة
        rm -f ${{ env.ANYKERNEL_DIR }}/Image.gz 2>/dev/null || true
        rm -f ${{ env.ANYKERNEL_DIR }}/dtbo.img 2>/dev/null || true
        
        # تعديل anykernel.sh
        echo "🔧 تكوين anykernel.sh لجهاز violet..."
        ANYSCRIPT="${{ env.ANYKERNEL_DIR }}/anykernel.sh"
        
        # تفعيل dtbo
        sed -i 's|^# do\.dtbo=|do\.dtbo=|g' "$ANYSCRIPT"
        sed -i 's|^do\.dtbo=.*|do\.dtbo=1|g' "$ANYSCRIPT"
        
        # إضافة تعريف الجهاز
        sed -i "/^device\.name1=/a device.name1=\"${{ env.DEVICE_CODENAME }}\"" "$ANYSCRIPT"
        sed -i "/^device\.name1=/a device.name2=\"redfin\"" "$ANYSCRIPT"
        
        echo "✅ AnyKernel3 جاهز"

    # ==================== 12. تجميع ملفات النواة ====================
    - name: "📁 تجميع ملفات الفلاش"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      id: package_kernel
      run: |
        echo "📁 تجميع ملفات kernel للفلاش..."
        
        # 1. نسخ Image.gz
        cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" "${{ env.ANYKERNEL_DIR }}/"
        echo "✅ تم نسخ Image.gz"
        
        # 2. نسخ dtbo.img (إذا موجود)
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ تم نسخ dtbo.img"
        fi
        
        # 3. إنشاء ملف معلومات
        cat > "${{ env.ANYKERNEL_DIR }}/build_info.txt" << EOF
        ╔══════════════════════════════════════════════════════╗
        ║          XCALIBUR v5.4 + KernelSU v1.1.1            ║
        ╠══════════════════════════════════════════════════════╣
        ║ 📱 الجهاز:   ${{ env.DEVICE_CODENAME }}             ║
        ║ 🔧 النواة:    xcalibur-v5.4                         ║
        ║ ⭐ KSU:      ${{ env.KSU_KERNEL_VERSION }}          ║
        ║ 🔨 الباتشات:  ${{ steps.apply_patches.outputs.patches_applied || '9' }}/9 ║
        ║ ⏱️  الوقت:    ${{ env.BUILD_TIME }} ثانية           ║
        ║ 🏗️  البيلد:   #${{ github.run_number }}             ║
        ║ 📅 التاريخ:  $(date '+%Y-%m-%d %H:%M:%S')          ║
        ╚══════════════════════════════════════════════════════╝
        
        ⚙️ المواصفات:
        • المترجم: Clang 22.0.0 (2025-09-20)
        • الباتشات: 9 هجينة (6+3)
        • AnyKernel3: branch sixteen
        • التوقيع: zipsigner 3.0
        
        📋 التعليمات:
        1. فلاش عبر TWRP/OrangeFox
        2. ثبت KernelSU Manager
        3. استمتع بـ Root آمن
        EOF
        
        echo "✅ الملفات مجمعة"

    # ==================== 13. إنشاء ملف ZIP ====================
    - name: "🎯 إنشاء ملف ZIP"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "🎯 إنشاء ملف ZIP قابل للفلاش..."
        
        # الانتقال إلى مجلد AnyKernel وإنشاء ZIP
        cd "${{ env.ANYKERNEL_DIR }}"
        echo "📦 جاري ضغط الملفات..."
        zip -r9 "../${{ env.KERNEL_ZIP_NAME }}" ./* > /dev/null
        cd ..
        
        # نقل إلى مجلد releases
        mkdir -p "${{ env.RELEASES_DIR }}"
        mv "${{ env.KERNEL_ZIP_NAME }}" "${{ env.RELEASES_DIR }}/"
        
        ZIP_SIZE=$(du -h "${{ env.RELEASES_DIR }}/${{ env.KERNEL_ZIP_NAME }}" | cut -f1)
        echo "✅ تم إنشاء ZIP: ${{ env.KERNEL_ZIP_NAME }} ($ZIP_SIZE)"

    # ==================== 14. توقيع الملف بـ zipsigner 3.0 ====================
    - name: "🔏 توقيع ملف ZIP"
      run: |
        echo "🔏 توقيع الملف بـ zipsigner 3.0..."
        
        # تنزيل zipsigner
        echo "⬇️  جاري تنزيل zipsigner 3.0..."
        wget -q "${{ env.ZIPSIGNER_URL }}" -O /tmp/zipsigner.jar
        
        # التوقيع
        echo "✍️  جاري التوقيع..."
        cd "${{ env.RELEASES_DIR }}"
        
        if java -jar /tmp/zipsigner.jar \
          "${{ env.KERNEL_ZIP_NAME }}" \
          "${{ env.SIGNED_ZIP_NAME }}"; then
          
          SIGNED_SIZE=$(du -h "${{ env.SIGNED_ZIP_NAME }}" | cut -f1)
          echo "✅ تم التوقيع: ${{ env.SIGNED_ZIP_NAME }} ($SIGNED_SIZE)"
          FINAL_ZIP="${{ env.SIGNED_ZIP_NAME }}"
        else
          echo "⚠️  فشل التوقيع، استخدام الملف غير الموقع"
          FINAL_ZIP="${{ env.KERNEL_ZIP_NAME }}"
        fi
        
        echo "final_zip_name=$FINAL_ZIP" >> $GITHUB_ENV
        cd ..

    # ==================== 15. التنظيم النهائي ====================
    - name: "📂 تنظيم الملفات النهائية"
      run: |
        echo "📂 تنظيم الملفات للتحميل..."
        
        # إنشاء README نهائي
        cat > "${{ env.RELEASES_DIR }}/README.md" << EOF
        # 🚀 XCALIBUR v5.4 Kernel with KernelSU
        
        ## 📋 المواصفات
        - **النواة:** xcalibur-v5.4
        - **الجهاز:** ${{ env.DEVICE_CODENAME }} (Redmi Note 7 Pro)
        - **KernelSU:** v1.1.1 Hotfix
        - **المترجم:** Clang 22.0.0 (2025-09-20)
        - **البنتشات:** 9 (6 تقليدية + 3 جديدة)
        - **البناء:** #${{ github.run_number }}
        
        ## 📁 الملفات
        1. **${{ env.final_zip_name }}** - Kernel قابل للفلاش
        2. **${{ env.APK_NAME }}** - KernelSU Manager
        
        ## 🔧 طريقة التثبيت
        1. انتقل إلى Recovery (TWRP/OrangeFox)
        2. اختر Install
        3. اختر ${{ env.final_zip_name }}
        4. اسحب للفلاش
        5. إعادة التشغيل
        6. ثبت KernelSU Manager من الملفات
        
        ## ⚠️ ملاحظات هامة
        - تأكد أن الجهاز هو ${{ env.DEVICE_CODENAME }}
        - خذ نسخة احتياطية قبل الفلاش
        - في حالة bootloop، استخدم نسخة boot.img الأصلية
        
        ## 📊 إحصائيات البناء
        - وقت البناء: ${{ env.build_time }} ثانية
        - التحذيرات: ${{ env.warnings }}
        - الأخطاء: ${{ env.errors }}
        EOF
        
        # عرض الملفات النهائية
        echo ""
        echo "🎯 الملفات الجاهزة:"
        ls -lh "${{ env.RELEASES_DIR }}" | grep -v "^total"

    # ==================== 16. رفع الملفات ====================
    - name: "📤 رفع الملفات الناتجة"
      uses: actions/upload-artifact@v4
      with:
        name: xcalibur-ksu-violet-${{ github.run_number }}
        path: |
          ${{ env.RELEASES_DIR }}/*
          ${{ github.workspace }}/build.log
        retention-days: 30
        compression-level: 0

    # ==================== 17. ملخص البناء ====================
    - name: "🎉 ملخص البناء"
      if: always()
      run: |
        echo ""
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║                 🎊 بناء xcalibur-v5.4               ║"
        echo "╠══════════════════════════════════════════════════════╣"
        
        if [ "${{ steps.compile_kernel.outputs.compile_status }}" = "success" ]; then
          echo "║ ✅ الحالة:     ناجح                                 "
          echo "║ 📁 الملف:      ${{ env.final_zip_name }}           "
          echo "║ 📱 الجهاز:     ${{ env.DEVICE_CODENAME }}          "
          echo "║ ⭐ KernelSU:  ${{ env.KSU_KERNEL_VERSION }}        "
          echo "║ 🔨 الباتشات:   ${{ steps.apply_patches.outputs.patches_applied || '?' }}/9"
          echo "║ ⏱️  الوقت:     ${{ env.build_time }} ثانية         "
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║ 📊 الإحصائيات:                                     "
          echo "║   • تحذيرات:  ${{ env.warnings }}                  "
          echo "║   • أخطاء:    ${{ env.errors }}                    "
          echo "║                                                     "
          echo "║ ⚡ المميزات:                                         "
          echo "║   • Clang 22.0.0                                   "
          echo "║   • 9 patches hybrid                               "
          echo "║   • AnyKernel3 sixteen                            "
          echo "║   • توقيع zipsigner 3.0                            "
        else
          echo "║ ❌ الحالة:     فاشل                                 "
          echo "║ 🔍 راجع سجلات البناء للتفاصيل                      "
        fi
        
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 انتهى البناء: $(date)"
        echo "📦 الملفات متاحة في قسم Artifacts"
        echo ""
        echo "🔗 للتحميل:"
        echo "1. اذهب إلى Actions"
        echo "2. اختر هذا البناء"
        echo "3. انزل إلى Artifacts"
        echo "4. حمل ${{ env.final_zip_name }}"
