name: "🚀 Build Kernel - xcalibur with KernelSU Next Dev"

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build'
        required: false
        default: 'false'

env:
  # ⚙️ Basic settings
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu-next"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  # 📁 Folder structure
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # 📦 File names
  KERNEL_ZIP_NAME: "xcalibur-ksu-next-${{ github.run_number }}-${{ env.DEVICE_CODENAME }}.zip"
  
  # ⭐ KernelSU Next Dev
  KSU_REPO_URL: "https://github.com/tiann/KernelSU-next.git"
  
  # 🔧 Build settings
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  TOOLCHAIN_PREFIX: "aarch64-linux-gnu-"
  JOBS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
    # ==================== 1. Start Build ====================
    - name: "🎬 Start Build Process"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║   🚀 Building Kernel with KernelSU Next Dev         ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ Device: ${{ env.DEVICE_CODENAME }}                  "
        echo "║ Kernel: ${{ env.KERNEL_NAME }}                      "
        echo "║ Build:  #${{ github.run_number }}                   "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 Date: $(date)"
        echo "🖥️  System: $(uname -a)"
        echo "🧵 CPU: $(nproc) cores"
        echo ""

    # ==================== 2. Download Sources ====================
    - name: "📥 Download Kernel Source"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # ==================== 3. Clean Build (Optional) ====================
    - name: "🧹 Clean Build Environment"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "🧹 Cleaning previous build..."
        rm -rf ${{ env.OUTPUT_DIR }} ${{ env.ANYKERNEL_DIR }} ${{ env.TOOLCHAIN_DIR }}
        make clean && make mrproper
        echo "✅ Clean completed"

    # ==================== 4. Install Dependencies ====================
    - name: "📦 Install Build Dependencies"
      run: |
        echo "📦 Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git libelf-dev libssl-dev \
          make python3 wget zip \
          libncurses-dev libxml2-utils rsync patchelf
        
        echo "✅ Dependencies installed"

    # ==================== 5. Setup Toolchain ====================
    - name: "🔧 Setup Toolchain"
      run: |
        echo "🔧 Setting up toolchain..."
        
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "⬇️ Downloading Clang..."
          wget -q ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
          
          echo "📁 Extracting..."
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f clang.tar.gz
          
          echo "✅ Clang installed"
        else
          echo "⚡ Clang already exists"
        fi
        
        # Add to PATH
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        
        # Verify installation
        ${{ env.TOOLCHAIN_DIR }}/bin/clang --version | head -1
        echo "🎯 Toolchain ready"

    # ==================== 6. Install KernelSU Next Dev ====================
    - name: "📦 Install KernelSU Next Dev"
      id: install_ksu
      run: |
        echo "📦 Installing KernelSU Next Dev..."
        
        # Remove old version if exists
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # Download KernelSU Next Dev
        echo "⬇️ Downloading KernelSU Next Dev..."
        git clone ${{ env.KSU_REPO_URL }} \
          --depth=1 \
          /tmp/kernelsu-next
        
        # Copy files
        echo "📁 Copying KernelSU files..."
        mkdir -p drivers/kernelsu
        
        if [ -d "/tmp/kernelsu-next/kernel" ]; then
          cp -rf /tmp/kernelsu-next/kernel/* drivers/kernelsu/
        else
          # Try alternative locations
          find /tmp/kernelsu-next -name "*.c" -exec cp {} drivers/kernelsu/ \;
          find /tmp/kernelsu-next -name "*.h" -exec cp {} drivers/kernelsu/ \;
        fi
        
        # Verify files
        KSU_FILES_COUNT=$(find drivers/kernelsu -name "*.c" -o -name "*.h" 2>/dev/null | wc -l)
        echo "📊 KernelSU files count: $KSU_FILES_COUNT"
        
        if [ $KSU_FILES_COUNT -gt 5 ]; then
          echo "✅ KernelSU Next Dev installed successfully"
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Failed to install KernelSU Next Dev"
          echo "ksu_installed=false" >> $GITHUB_OUTPUT
          # Fallback to stable version
          echo "🔄 Trying stable version..."
          git clone https://github.com/tiann/KernelSU.git \
            --depth=1 \
            /tmp/kernelsu-stable
          cp -rf /tmp/kernelsu-stable/kernel/* drivers/kernelsu/
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
        fi
        
        # Cleanup
        rm -rf /tmp/kernelsu-next /tmp/kernelsu-stable

    # ==================== 7. Apply KernelSU Patches ====================
    - name: "🔨 Apply KernelSU Patches"
      if: steps.install_ksu.outputs.ksu_installed == 'true'
      run: |
        echo "🔨 Applying KernelSU patches..."
        
        # Download patches
        echo "⬇️ Downloading patches..."
        git clone https://github.com/Jonjeexe/KernelSU_Patches.git \
          --depth=1 \
          /tmp/ksu-patches
        
        # Apply patches
        echo "📌 Applying patches..."
        for patch_file in /tmp/ksu-patches/*.patch; do
          if [ -f "$patch_file" ]; then
            patch_name=$(basename "$patch_file")
            echo "   Applying: $patch_name"
            patch -p1 --ignore-whitespace --forward --silent < "$patch_file" 2>/dev/null || true
          fi
        done
        
        echo "✅ Patches applied"
        rm -rf /tmp/ksu-patches

    # ==================== 8. Configure Kernel ====================
    - name: "⚙️ Configure Kernel"
      run: |
        echo "⚙️ Configuring kernel..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # Create initial config
        echo "📄 Creating config file..."
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # Add KernelSU config
        echo "🔧 Adding KernelSU configuration..."
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'

# ========================================
# KernelSU Next Dev Configuration
# ========================================
CONFIG_KSU=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_EXFAT_SUPPORT=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_WHITELIST=y
CONFIG_KSU_NAME="xcalibur-ksu-next"
CONFIG_KSU_VERSION="next-dev"

# ========================================
# Optimization
# ========================================
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_LTO_CLANG=y
CONFIG_THINLTO=y
EOF
        
        # Update config
        echo "🔄 Updating configuration..."
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        
        # Show important settings
        echo ""
        echo "📋 Important configurations:"
        grep -E "(KSU|LTO|OPTIMIZE)" ${{ env.OUTPUT_DIR }}/.config | head -10
        echo ""
        echo "✅ Kernel configured"

    # ==================== 9. Build Kernel ====================
    - name: "🚀 Build Kernel"
      id: compile_kernel
      run: |
        echo "🚀 Building kernel..."
        echo "========================"
        
        START_TIME=$(date +%s)
        
        # Setup environment
        export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
        export ARCH=${{ env.ARCH }}
        export CROSS_COMPILE="${{ env.TOOLCHAIN_PREFIX }}"
        export CC="ccache clang"
        export LLVM=1
        export LLVM_IAS=1
        
        # Build kernel
        echo "🔨 Building with ${{ env.JOBS }} jobs..."
        make -j${{ env.JOBS }} \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="$CC" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          LLVM=1 \
          LLVM_IAS=1 2>&1 | tee build.log
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        
        # Check build success
        echo ""
        echo "🔍 Checking build output..."
        
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          IMAGE_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" | cut -f1)
          echo "✅ Image.gz: Found ($IMAGE_SIZE)"
          echo "✅ Build completed in ${BUILD_TIME} seconds"
          echo "compile_status=success" >> $GITHUB_OUTPUT
        else
          echo "❌ Image.gz: Not found"
          echo "compile_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # Check for modules
        KSU_MODULES=$(find ${{ env.OUTPUT_DIR }} -name "*.ko" -type f | grep -i kernelsu | wc -l)
        echo "📦 KernelSU modules: $KSU_MODULES"
        
        # Save build time
        echo "build_time=$BUILD_TIME" >> $GITHUB_ENV

    # ==================== 10. Setup AnyKernel3 ====================
    - name: "📦 Setup AnyKernel3"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "📦 Setting up AnyKernel3..."
        
        # Clean old directory
        rm -rf ${{ env.ANYKERNEL_DIR }}
        
        # Download AnyKernel3
        echo "⬇️ Downloading AnyKernel3..."
        git clone https://github.com/osm0sis/AnyKernel3.git \
          --depth=1 \
          ${{ env.ANYKERNEL_DIR }}
        
        # Clean old files
        echo "🧹 Cleaning old files..."
        rm -f ${{ env.ANYKERNEL_DIR }}/Image.gz 2>/dev/null || true
        rm -f ${{ env.ANYKERNEL_DIR }}/dtbo.img 2>/dev/null || true
        
        echo "✅ AnyKernel3 ready"

    # ==================== 11. Package Kernel Files ====================
    - name: "📁 Package Kernel Files"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "📁 Packaging kernel files..."
        echo "========================="
        
        # Copy Image.gz
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" "${{ env.ANYKERNEL_DIR }}/"
          IMG_SIZE=$(du -h "${{ env.ANYKERNEL_DIR }}/Image.gz" | cut -f1)
          echo "✅ Image.gz: Copied ($IMG_SIZE)"
        fi
        
        # Copy dtbo.img if exists
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ dtbo.img: Copied"
        fi
        
        # Create build info file
        cat > "${{ env.ANYKERNEL_DIR }}/build_info.txt" << EOF
╔══════════════════════════════════════════════════════╗
║       KERNELSU NEXT DEV BUILD                        ║
╠══════════════════════════════════════════════════════╣
║ 🔧 Kernel:    ${{ env.KERNEL_NAME }}                 ║
║ 📱 Device:    ${{ env.DEVICE_CODENAME }}             ║
║ 🏗️  Version:  KernelSU Next Dev                     ║
║ ⏱️  Time:     ${{ env.BUILD_TIME }} seconds          ║
╠══════════════════════════════════════════════════════╣
║ 📝 Build:     #${{ github.run_number }}              ║
║ 📅 Date:      $(date '+%Y-%m-%d %H:%M:%S')           ║
╚══════════════════════════════════════════════════════╝
EOF
        
        echo "✅ Files packaged"

    # ==================== 12. Create ZIP File ====================
    - name: "🎯 Create ZIP File"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "🎯 Creating kernel ZIP file..."
        
        cd "${{ env.ANYKERNEL_DIR }}"
        zip -r9 "../${{ env.KERNEL_ZIP_NAME }}" ./* > /dev/null
        cd ..
        
        ZIP_SIZE=$(du -h "${{ env.KERNEL_ZIP_NAME }}" | cut -f1)
        echo "✅ Created: ${{ env.KERNEL_ZIP_NAME }} ($ZIP_SIZE)"
        
        # Create releases directory
        mkdir -p "${{ env.RELEASES_DIR }}"
        mv "${{ env.KERNEL_ZIP_NAME }}" "${{ env.RELEASES_DIR }}/"

    # ==================== 13. Sign ZIP File ====================
    - name: "🔏 Sign ZIP File"
      run: |
        echo "🔏 Signing ZIP file..."
        
        # Download zipsigner
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar \
          -O /tmp/zipsigner.jar
        
        cd "${{ env.RELEASES_DIR }}"
        
        SIGNED_ZIP="signed-${{ env.KERNEL_ZIP_NAME }}"
        
        if java -jar /tmp/zipsigner.jar "${{ env.KERNEL_ZIP_NAME }}" "$SIGNED_ZIP"; then
          SIGNED_SIZE=$(du -h "$SIGNED_ZIP" | cut -f1)
          echo "✅ Signed: $SIGNED_ZIP ($SIGNED_SIZE)"
          # Remove unsigned version
          rm -f "${{ env.KERNEL_ZIP_NAME }}"
        else
          echo "⚠️ Signing failed, using unsigned version"
        fi
        
        cd ..

    # ==================== 14. Upload Artifacts ====================
    - name: "📤 Upload Artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: |
          ${{ env.RELEASES_DIR }}/*
        retention-days: 30

    # ==================== 15. Build Summary ====================
    - name: "🎉 Build Summary"
      if: always()
      run: |
        echo ""
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║                 🎊 BUILD SUMMARY                     ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ Status:    ${{ steps.compile_kernel.outputs.compile_status == 'success' && 'SUCCESS' || 'FAILED' }}"
        echo "║ Kernel:    ${{ env.KERNEL_NAME }}                    "
        echo "║ Device:    ${{ env.DEVICE_CODENAME }}                "
        echo "║ KernelSU:  Next Dev                                  "
        echo "║ Time:      ${{ env.BUILD_TIME }} seconds             "
        echo "║ Build:     #${{ github.run_number }}                 "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📁 Artifact: kernel-build-${{ github.run_number }}"
        echo "📦 Download from the 'Artifacts' section"
