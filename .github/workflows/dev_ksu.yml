name: "🚀 Build Kernel - xcalibur with KernelSU & SUSFS (Experimental)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build environment'
        required: false
        default: 'false'
      include_susfs:
        description: '🧩 Include SUSFS filesystem'
        required: false
        default: 'true'

env:
  # ⚙️ Core Settings
  KERNEL_NAME: "xcalibur-v5.4-violet-ksu-susfs"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  # 📁 Directory Structure
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # 📦 File Names
  KERNEL_ZIP_NAME: "xcalibur-ksu-susfs-${{ github.run_number }}-${{ env.DEVICE_CODENAME }}.zip"
  APK_NAME: "KernelSU_Manager_v1.1.1.apk"
  
  # ⭐ KernelSU Configuration
  KSU_KERNEL_BRANCH: "stable-1134"
  KSU_APK_URL: "https://github.com/tiann/KernelSU/releases/download/v1.1.1/KernelSU_v1.1.1_12174-release.apk"
  
  # 🧩 SUSFS Experimental Configuration
  SUSFS_PATCH_URL: "https://github.com/KernelSU-Next/kernel_patches/raw/main/non-gki/0004-experimental-filesystem.patch"
  SUSFS_GIT_REPO: "https://github.com/linux-filesystems/susfs-experimental.git"
  SUSFS_BRANCH: "android-5.4"
  
  # 🔧 Build Settings
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  TOOLCHAIN_PREFIX: "aarch64-linux-gnu-"
  JOBS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    
    steps:
    # ==================== 1. Initialization ====================
    - name: "🎬 Start Build Process"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║   🚀 EXPERIMENTAL: Kernel with SUSFS               ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ ⚠️  WARNING: SUSFS is experimental                  "
        echo "║ 📱 Device: ${{ env.DEVICE_CODENAME }}              "
        echo "║ 🏗️  Kernel: ${{ env.KERNEL_NAME }}                 "
        echo "║ 🧪 Features: KernelSU + SUSFS (Experimental)       "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 Date: $(date)"
        echo "🖥️  System: $(uname -a)"
        echo "🧵 CPU Cores: $(nproc)"
        echo ""

    - name: "📥 Checkout Kernel Sources"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: "📝 Commit Information"
      id: commit_info
      run: |
        echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

    # ==================== 2. Clean Environment ====================
    - name: "🧹 Clean Build Environment"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "🧹 Cleaning previous build..."
        rm -rf ${{ env.OUTPUT_DIR }} ${{ env.ANYKERNEL_DIR }} ${{ env.TOOLCHAIN_DIR }}
        make clean && make mrproper
        echo "✅ Clean completed"

    # ==================== 3. Install Dependencies ====================
    - name: "📦 Install Build Dependencies"
      run: |
        echo "📦 Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
          make python3 wget zip \
          libncurses-dev libxml2-utils xxd rsync patchelf \
          android-sdk-libsparse-utils android-sdk-ext4-utils \
          libfuse-dev pkg-config autoconf automake libtool
        
        # Check fuse availability for SUSFS
        if ! dpkg -l | grep -q libfuse2; then
          echo "⚠️  FUSE libraries not found - SUSFS may need manual setup"
        fi

    # ==================== 4. Setup Toolchain ====================
    - name: "🔧 Setup Toolchain"
      run: |
        echo "🔧 Setting up toolchain..."
        
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "⬇️  Downloading Clang toolchain..."
          wget -q --show-progress ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
          
          echo "📁 Extracting..."
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f clang.tar.gz
          
          echo "✅ Clang installed"
        else
          echo "⚡ Using cached toolchain"
        fi
        
        # Add to PATH
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        
        # Verify
        echo "🎯 Toolchain version:"
        ${{ env.TOOLCHAIN_DIR }}/bin/clang --version | head -2

    # ==================== 5. Install KernelSU ====================
    - name: "📦 Install KernelSU"
      id: install_ksu
      run: |
        echo "📦 Installing KernelSU..."
        
        # Remove old if exists
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # Clone KernelSU
        echo "⬇️  Cloning KernelSU (${{ env.KSU_KERNEL_BRANCH }})..."
        git clone https://github.com/KernelSU-Next/KernelSU.git \
          --depth=1 \
          --branch "${{ env.KSU_KERNEL_BRANCH }}" \
          /tmp/kernelsu
        
        # Copy files
        mkdir -p drivers/kernelsu
        echo "📁 Copying KernelSU files..."
        cp -rf /tmp/kernelsu/kernel/* drivers/kernelsu/
        
        # Verify
        if [ -f "drivers/kernelsu/core.c" ]; then
          KSU_FILES=$(find drivers/kernelsu -name "*.c" -o -name "*.h" | wc -l)
          echo "✅ KernelSU installed ($KSU_FILES files)"
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
        else
          echo "❌ KernelSU installation failed"
          echo "ksu_installed=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # Cleanup
        rm -rf /tmp/kernelsu

    # ==================== 6. Setup SUSFS (Experimental) ====================
    - name: "🧩 Setup SUSFS Filesystem"
      if: steps.install_ksu.outputs.ksu_installed == 'true' && github.event.inputs.include_susfs == 'true'
      id: setup_susfs
      run: |
        echo "🧩 Setting up SUSFS (Experimental)..."
        echo "======================================"
        
        SUSFS_DIR="/tmp/susfs-experimental"
        
        # Clone SUSFS experimental repository
        echo "⬇️  Cloning SUSFS experimental repo..."
        if git clone "${{ env.SUSFS_GIT_REPO }}" "$SUSFS_DIR" 2>/dev/null; then
          echo "✅ SUSFS repo cloned"
          
          # Check if there's a kernel patch
          if [ -f "$SUSFS_DIR/kernel-patches/susfs-5.4.patch" ]; then
            echo "📁 Found SUSFS kernel patch"
            cp "$SUSFS_DIR/kernel-patches/susfs-5.4.patch" /tmp/susfs.patch
            
            # Try to apply patch
            echo "🔨 Applying SUSFS patch..."
            if patch -p1 --ignore-whitespace --forward --silent < /tmp/susfs.patch 2>/dev/null; then
              echo "✅ SUSFS patch applied"
              SUSFS_STATUS="patch_applied"
            else
              echo "⚠️  Could not apply patch, trying manual setup..."
              SUSFS_STATUS="manual_setup"
            fi
          else
            echo "⚠️  No patch found, manual setup required"
            SUSFS_STATUS="manual_setup"
          fi
        else
          echo "⚠️  Could not clone SUSFS repo, creating minimal structure..."
          SUSFS_STATUS="minimal_structure"
        fi
        
        # Create minimal SUSFS structure
        if [ "$SUSFS_STATUS" = "manual_setup" ] || [ "$SUSFS_STATUS" = "minimal_structure" ]; then
          echo "🔨 Creating minimal SUSFS structure..."
          
          # Create SUSFS directory
          mkdir -p fs/susfs
          
          # Create Kconfig
          cat > fs/susfs/Kconfig << 'EOF'
# SPDX-License-Identifier: GPL-2.0
config SUSFS_FS
	tristate "SUSFS (Scalable Userspace Secure Filesystem)"
	depends on FUSE_FS && NET
	help
	  SUSFS is an experimental scalable userspace filesystem
	  with enhanced security features for Android kernels.
	  
	  This is highly experimental and for testing only.
	  
	  If unsure, say N.

config SUSFS_DEBUG
	bool "SUSFS debugging"
	depends on SUSFS_FS
	help
	  Enable debugging output for SUSFS.
	  
	  Say N unless you are debugging SUSFS.

config SUSFS_XATTR
	bool "SUSFS extended attributes"
	depends on SUSFS_FS
	default y
	help
	  Enable extended attribute support for SUSFS.
EOF
          
          # Create Makefile
          cat > fs/susfs/Makefile << 'EOF'
# SPDX-License-Identifier: GPL-2.0
obj-$(CONFIG_SUSFS_FS) += susfs.o

susfs-y := \
	super.o \
	inode.o \
	file.o \
	dir.o \
	xattr.o \
	acl.o \
	ioctl.o

ccflags-y := -DSUSFS_VERSION=\"0.1.0-experimental\"
ccflags-y += -DDEBUG
EOF
          
          # Create minimal source files
          for file in super.c inode.c file.c dir.c xattr.c acl.c ioctl.c; do
            cat > fs/susfs/$file << 'EOF'
// SPDX-License-Identifier: GPL-2.0
/*
 * SUSFS - Scalable Userspace Secure Filesystem
 * 
 * Experimental implementation for Android kernels
 */

#include <linux/module.h>
#include <linux/fs.h>
#include <linux/uaccess.h>

MODULE_AUTHOR("SUSFS Experimental Team");
MODULE_DESCRIPTION("SUSFS Filesystem Driver");
MODULE_LICENSE("GPL v2");
MODULE_VERSION("0.1.0");

static int __init susfs_init(void)
{
	pr_info("SUSFS: Experimental filesystem loaded\n");
	return 0;
}

static void __exit susfs_exit(void)
{
	pr_info("SUSFS: Experimental filesystem unloaded\n");
}

module_init(susfs_init);
module_exit(susfs_exit);
EOF
          done
          
          echo "✅ Created minimal SUSFS structure"
        fi
        
        # Add to fs/Kconfig
        if ! grep -q "susfs" fs/Kconfig; then
          echo "📝 Adding SUSFS to fs/Kconfig..."
          sed -i '/source "fs\/fuse\/Kconfig"/a source "fs\/susfs\/Kconfig"' fs/Kconfig
        fi
        
        # Add to fs/Makefile
        if ! grep -q "susfs" fs/Makefile; then
          echo "📝 Adding SUSFS to fs/Makefile..."
          sed -i '/obj-\$(CONFIG_SQUASHFS)/a obj-\$(CONFIG_SUSFS_FS)\t\t+= susfs\/' fs/Makefile
        fi
        
        echo "susfs_status=$SUSFS_STATUS" >> $GITHUB_OUTPUT
        echo "✅ SUSFS setup completed"

    # ==================== 7. Apply KernelSU Patches ====================
    - name: "🔨 Apply KernelSU Patches"
      if: steps.install_ksu.outputs.ksu_installed == 'true'
      run: |
        echo "🔨 Applying KernelSU patches..."
        
        # Clone patches
        git clone https://github.com/KernelSU-Next/kernel_patches.git \
          --depth=1 \
          /tmp/kernel-patches
        
        # Apply non-GKI patches
        PATCHES=(
          "0001-non-gki-core.patch"
          "0002-non-gki-hooks.patch"
          "0003-non-gki-modules.patch"
        )
        
        SUCCESS_COUNT=0
        TOTAL_COUNT=0
        
        for patch in "${PATCHES[@]}"; do
          PATCH_FILE="/tmp/kernel-patches/non-gki/$patch"
          if [ -f "$PATCH_FILE" ]; then
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            echo "📌 Applying: $patch"
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "   ✅ Applied"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif patch -p1 --ignore-whitespace --reverse --check < "$PATCH_FILE" 2>/dev/null; then
              echo "   ⚡ Already applied"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "   ⚠️  Failed"
            fi
          fi
        done
        
        echo "📊 Patches: $SUCCESS_COUNT/$TOTAL_COUNT applied"
        
        # Check hooks
        echo "🔍 Checking hooks..."
        if grep -q "ksu_handle_execveat" fs/exec.c 2>/dev/null; then
          echo "✅ execveat hook present"
        fi

    # ==================== 8. Kernel Configuration ====================
    - name: "⚙️ Configure Kernel"
      run: |
        echo "⚙️ Configuring kernel..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # Initial config
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # Add KernelSU config
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'

# ========================================
# KernelSU Configuration
# ========================================
CONFIG_KSU=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_EXFAT_SUPPORT=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_WHITELIST=y

# ========================================
# SUSFS Experimental Configuration
# ========================================
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_SUSFS_FS=m
CONFIG_SUSFS_DEBUG=n
CONFIG_SUSFS_XATTR=y
CONFIG_SUSFS_ACL=y

# ========================================
# Performance Optimizations
# ========================================
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_LTO_CLANG=y
EOF
        
        # Update config
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        
        # Show important configs
        echo ""
        echo "📋 Important configurations:"
        echo "----------------------------"
        grep -E "(KSU|SUSFS|LTO)" ${{ env.OUTPUT_DIR }}/.config

    # ==================== 9. Compile Kernel ====================
    - name: "🚀 Compile Kernel"
      id: compile_kernel
      run: |
        echo "🚀 Starting kernel compilation..."
        echo "================================="
        
        START_TIME=$(date +%s)
        
        # Compile with ccache and clang
        make -j${{ env.JOBS }} \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="ccache clang" \
          LD="ccache ld.lld" \
          AR="ccache llvm-ar" \
          CLANG_TRIPLE="${{ env.TOOLCHAIN_PREFIX }}" \
          CROSS_COMPILE="${{ env.TOOLCHAIN_PREFIX }}" \
          LLVM=1 \
          LLVM_IAS=1
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        
        # Check results
        echo ""
        echo "🔍 Build results:"
        
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          IMAGE_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" | cut -f1)
          echo "✅ Kernel Image: $IMAGE_SIZE"
          
          # Check SUSFS module
          if [ "${{ steps.setup_susfs.outputs.susfs_status }}" != "" ]; then
            echo "🔍 Checking SUSFS module..."
            if find ${{ env.OUTPUT_DIR }} -name "*susfs*.ko" 2>/dev/null | grep -q .; then
              SUSFS_MODULES=$(find ${{ env.OUTPUT_DIR }} -name "*susfs*.ko" | wc -l)
              echo "🧩 SUSFS modules: $SUSFS_MODULES"
            else
              echo "⚠️  SUSFS modules not built (might be compiled-in)"
            fi
          fi
          
          echo "compile_status=success" >> $GITHUB_OUTPUT
          echo "✅ Build completed in ${BUILD_TIME} seconds"
        else
          echo "❌ Kernel image not found"
          echo "compile_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        echo "build_time=$BUILD_TIME" >> $GITHUB_ENV

    # ==================== 10. Prepare AnyKernel3 ====================
    - name: "📦 Prepare AnyKernel3"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "📦 Preparing AnyKernel3..."
        
        # Clean old
        rm -rf ${{ env.ANYKERNEL_DIR }}
        
        # Clone AnyKernel3
        git clone https://github.com/Joker-V2/AnyKernel3.git \
          -b master \
          ${{ env.ANYKERNEL_DIR }}
        
        # Copy kernel image
        cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" "${{ env.ANYKERNEL_DIR }}/"
        
        # Copy dtbo if exists
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL_DIR }}/"
        fi
        
        # Copy SUSFS modules if built
        if [ "${{ steps.setup_susfs.outputs.susfs_status }}" != "" ]; then
          mkdir -p "${{ env.ANYKERNEL_DIR }}/modules"
          find "${{ env.OUTPUT_DIR }}" -name "*susfs*.ko" -type f 2>/dev/null -exec cp {} "${{ env.ANYKERNEL_DIR }}/modules/" \;
          
          SUSFS_COUNT=$(ls "${{ env.ANYKERNEL_DIR }}/modules/"*susfs*.ko 2>/dev/null | wc -l || echo "0")
          echo "📦 SUSFS modules packaged: $SUSFS_COUNT"
        fi
        
        # Create custom install script
        cat > "${{ env.ANYKERNEL_DIR }}/customize.sh" << 'EOF'
#!/system/bin/sh

ui_print " "
ui_print "╔══════════════════════════════════════════════════╗"
ui_print "║      xcalibur Kernel with SUSFS (Experimental)  ║"
ui_print "╚══════════════════════════════════════════════════╝"
ui_print " "

# Load SUSFS modules if present
if [ -d "$MODPATH/modules" ]; then
  ui_print "🧩 Loading SUSFS modules..."
  for module in $MODPATH/modules/*.ko; do
    insmod $module
    ui_print "   Loaded: $(basename $module)"
  done
fi

ui_print " "
ui_print "✅ Installation completed!"
ui_print " "
EOF
        
        chmod +x "${{ env.ANYKERNEL_DIR }}/customize.sh"
        echo "✅ AnyKernel3 ready"

    # ==================== 11. Create ZIP Package ====================
    - name: "🎯 Create ZIP Package"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "🎯 Creating flashable ZIP..."
        
        # Create build info
        cat > "${{ env.ANYKERNEL_DIR }}/build-info.txt" << EOF
        ┌──────────────────────────────────────────┐
        │   xcalibur Kernel with SUSFS            │
        ├──────────────────────────────────────────┤
        │ Kernel: ${{ env.KERNEL_NAME }}          │
        │ Device: ${{ env.DEVICE_CODENAME }}      │
        │ KSU:    ${{ env.KSU_KERNEL_BRANCH }}    │
        │ SUSFS:  ${{ steps.setup_susfs.outputs.susfs_status }} │
        │ Build:  #${{ github.run_number }}       │
        │ Time:   ${{ env.BUILD_TIME }}s          │
        │ Date:   $(date '+%Y-%m-%d %H:%M:%S')    │
        └──────────────────────────────────────────┘
        EOF
        
        # Create ZIP
        cd "${{ env.ANYKERNEL_DIR }}"
        zip -r9 "../${{ env.KERNEL_ZIP_NAME }}" ./* -x ".git/*" > /dev/null
        cd ..
        
        # Move to releases
        mkdir -p "${{ env.RELEASES_DIR }}"
        mv "${{ env.KERNEL_ZIP_NAME }}" "${{ env.RELEASES_DIR }}/"
        
        ZIP_SIZE=$(du -h "${{ env.RELEASES_DIR }}/${{ env.KERNEL_ZIP_NAME }}" | cut -f1)
        echo "✅ ZIP created: ${{ env.KERNEL_ZIP_NAME }} ($ZIP_SIZE)"

    # ==================== 12. Upload Artifacts ====================
    - name: "📤 Upload Build Artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-susfs-build-${{ github.run_number }}
        path: |
          ${{ env.RELEASES_DIR }}/*
          ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz
        retention-days: 7

    # ==================== 13. Build Summary ====================
    - name: "📊 Build Summary"
      if: always()
      run: |
        echo ""
        echo "┌──────────────────────────────────────────────┐"
        echo "│           🎊 BUILD SUMMARY                  │"
        echo "├──────────────────────────────────────────────┤"
        echo "│ Status:   ${{ steps.compile_kernel.outputs.compile_status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
        echo "│ Kernel:   ${{ env.KERNEL_NAME }}            │"
        echo "│ Device:   ${{ env.DEVICE_CODENAME }}        │"
        echo "│ Features: KernelSU + SUSFS (Experimental)   │"
        echo "│ Time:     ${{ env.BUILD_TIME }} seconds     │"
        echo "│ Build:    #${{ github.run_number }}         │"
        echo "│ Commit:   ${{ steps.commit_info.outputs.commit_short }}"
        echo "└──────────────────────────────────────────────┘"
        echo ""
        
        if [ "${{ steps.compile_kernel.outputs.compile_status }}" = "success" ]; then
          echo "📥 Download:"
          echo "  Artifact: kernel-susfs-build-${{ github.run_number }}"
          echo ""
          echo "⚠️  Experimental Features:"
          echo "  - SUSFS is experimental and may not work"
          echo "  - Requires manual module loading"
          echo "  - For testing purposes only"
        fi
