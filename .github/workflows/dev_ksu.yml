name: "🚀 Build Kernel - xcalibur with KernelSU Next Dev & SUFS (10 Patches)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build (حذف الكاش)'
        required: false
        default: 'false'
      skip_apk:
        description: '⏭️ Skip APK download'
        required: false
        default: 'false'

env:
  # ⚙️ إعدادات أساسية
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu-next-sufs"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  
  # 📁 هيكل المجلدات
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # 📦 أسماء الملفات
  KERNEL_ZIP_NAME: "xcalibur-ksu-next-sufs-${{ github.run_number }}-${{ github.run_attempt }}-${{ env.DEVICE_CODENAME }}.zip"
  SIGNED_ZIP_NAME: "xcalibur-ksu-next-sufs-${{ github.run_number }}-${{ github.run_attempt }}-${{ env.DEVICE_CODENAME }}-signed.zip"
  APK_NAME: "KernelSU_Manager_Next_Dev.apk"
  
  # ⭐ KernelSU Next Dev Configuration
  KSU_KERNEL_BRANCH: "next"
  KSU_REPO_URL: "https://github.com/tiann/KernelSU-next.git"
  KSU_APK_VERSION: "dev-latest"
  KSU_APK_URL: "https://github.com/tiann/KernelSU-next/releases/latest/download/KernelSU_Manager.apk"
  KSU_PATCHES_REPO: "https://github.com/tiann/KernelSU-next-patches.git"
  KSU_PATCHES_BRANCH: "main"
  
  # 🧩 SUFS Configuration
  SUFS_PATCH_URL: "https://raw.githubusercontent.com/sufs/patches/main/linux-5.4/sufs-non-gki.patch"
  SUFS_BACKUP_PATCH_URL: "https://github.com/sufs/linux/raw/sufs-5.4/patches/sufs-v5.4.patch"
  
  # 🔧 إعدادات التجميع
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
  TOOLCHAIN_PREFIX: "aarch64-linux-gnu-"
  JOBS: 4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    # ==================== 1. التهيئة والإعداد ====================
    - name: "🎬 بدء التجميع"
      run: |
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║   🚀 بدء تجميع Kernel مع KernelSU Next Dev + SUFS   ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ الجهاز: ${{ env.DEVICE_CODENAME }}                  "
        echo "║ النواة:  ${{ env.KERNEL_NAME }}                     "
        echo "║ البيلد:  #${{ github.run_number }}                   "
        echo "║ الإصدار: KernelSU Next Dev                          "
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "📅 التاريخ: $(date)"
        echo "🖥️  النظام: $(uname -a)"
        echo "🧵 المعالج: $(nproc) نواة"
        echo ""

    - name: "📥 تنزيل المصادر"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: "📝 معلومات الـ Commit"
      id: commit_info
      run: |
        echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log --oneline -1 | cut -d' ' -f2-)" >> $GITHUB_OUTPUT
        echo "branch=$(git branch --show-current)" >> $GITHUB_OUTPUT

    # ==================== 2. تنظيف البيئة ====================
    - name: "🧹 تنظيف البناء (إذا طلب)"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "🧹 تنظيف بيئة البناء السابقة..."
        rm -rf ${{ env.OUTPUT_DIR }} ${{ env.ANYKERNEL_DIR }} ${{ env.TOOLCHAIN_DIR }}
        make clean && make mrproper
        find . -name "*.ko" -delete 2>/dev/null || true
        find . -name "*.o" -delete 2>/dev/null || true
        echo "✅ تم التنظيف"

    # ==================== 3. تثبيت المتطلبات ====================
    - name: "📦 تثبيت المتطلبات"
      run: |
        echo "📦 تثبيت متطلبات البناء..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git libelf-dev libssl-dev \
          make python3 wget zip default-jre-headless \
          lz4 lzma lzop zlib1g-dev libncurses-dev \
          libxml2-utils xxd rsync patchelf tree file \
          patchutils jq  # jq لمعالجة JSON من GitHub API
        
        # إعداد ccache
        mkdir -p ~/.ccache
        echo "max_size = 2G" > ~/.ccache/ccache.conf
        echo "✅ تم تثبيت المتطلبات"

    # ==================== 4. إعداد الـ Toolchain ====================
    - name: "🔧 إعداد Toolchain"
      id: setup_toolchain
      run: |
        echo "🔧 تحضير أداة التجميع..."
        
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "⬇️  جاري تنزيل Clang..."
          wget -q --show-progress ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
          
          echo "📁 فك الضغط..."
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f clang.tar.gz
          
          echo "✅ تم تثبيت Clang"
        else
          echo "⚡ Clang موجود مسبقاً"
        fi
        
        # إضافة إلى PATH
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        
        # التحقق من التثبيت
        ${{ env.TOOLCHAIN_DIR }}/bin/clang --version | head -2
        echo "🎯 Toolchain جاهز للاستخدام"

    # ==================== 5. تثبيت KernelSU Next Dev ====================
    - name: "📦 تثبيت KernelSU Next Dev"
      id: install_ksu
      run: |
        echo "📦 تثبيت KernelSU Next Dev..."
        
        # حذف النسخة القديمة إذا وجدت
        rm -rf drivers/kernelsu drivers/kernelsu_next 2>/dev/null || true
        
        # إنشاء مجلد KernelSU
        mkdir -p drivers/kernelsu
        
        # تنزيل KernelSU Next Dev
        echo "⬇️  جاري تنزيل KernelSU Next Dev..."
        git clone ${{ env.KSU_REPO_URL }} \
          --depth=1 \
          /tmp/kernelsu-next
        
        # نسخ الملفات
        echo "📁 نسخ ملفات KernelSU Next Dev..."
        if [ -d "/tmp/kernelsu-next/kernel" ]; then
          cp -rf /tmp/kernelsu-next/kernel/* drivers/kernelsu/
        else
          # البحث عن ملفات kernel في مواقع أخرى
          find /tmp/kernelsu-next -name "*.c" -o -name "*.h" | head -5
          echo "🔍 البحث عن ملفات kernel في مواقع بديلة..."
          if [ -d "/tmp/kernelsu-next/kernelsu" ]; then
            cp -rf /tmp/kernelsu-next/kernelsu/* drivers/kernelsu/
          elif [ -d "/tmp/kernelsu-next/drivers/kernelsu" ]; then
            cp -rf /tmp/kernelsu-next/drivers/kernelsu/* drivers/kernelsu/
          else
            # نسخ جميع ملفات C و H
            find /tmp/kernelsu-next -name "*.c" -exec cp {} drivers/kernelsu/ \;
            find /tmp/kernelsu-next -name "*.h" -exec cp {} drivers/kernelsu/ \;
          fi
        fi
        
        # تحميل patches التطويرية
        echo "⬇️  تحميل patches تطويرية..."
        git clone ${{ env.KSU_PATCHES_REPO }} \
          --depth=1 \
          /tmp/ksu-patches
        
        # تطبيق patches خاصة بـ Next Dev
        echo "🔨 تطبيق Next Dev patches..."
        if [ -d "/tmp/ksu-patches/non-gki" ]; then
          for patch in /tmp/ksu-patches/non-gki/*.patch; do
            if [ -f "$patch" ]; then
              patch_name=$(basename "$patch")
              echo "📌 تطبيق: $patch_name"
              patch -p1 --ignore-whitespace --forward --silent < "$patch" 2>/dev/null || \
              patch -p1 --ignore-whitespace --forward --fuzz=10 < "$patch" 2>/dev/null || true
            fi
          done
        else
          echo "⚠️  لا يوجد مجلد non-gki، البحث عن patches في الموقع الرئيسي..."
          for patch in /tmp/ksu-patches/*.patch; do
            if [ -f "$patch" ]; then
              patch_name=$(basename "$patch")
              echo "📌 تطبيق: $patch_name"
              patch -p1 --ignore-whitespace --forward --silent < "$patch" 2>/dev/null || true
            fi
          done
        fi
        
        # التحقق من الملفات
        KSU_FILES_COUNT=$(find drivers/kernelsu -name "*.c" -o -name "*.h" 2>/dev/null | wc -l)
        echo "📊 عدد ملفات KernelSU Next Dev: $KSU_FILES_COUNT"
        
        if [ $KSU_FILES_COUNT -gt 5 ]; then
          echo "✅ KernelSU Next Dev مثبت بنجاح"
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
          echo "ksu_version=next" >> $GITHUB_OUTPUT
        else
          echo "⚠️  ملفات KernelSU قليلة، جاري استخدام Stable كبديل..."
          # استخدام Stable كبديل
          git clone https://github.com/tiann/KernelSU.git \
            --depth=1 \
            --branch "main" \
            /tmp/kernelsu-stable
          
          cp -rf /tmp/kernelsu-stable/kernel/* drivers/kernelsu/
          echo "ksu_installed=true" >> $GITHUB_OUTPUT
          echo "ksu_version=stable" >> $GITHUB_OUTPUT
        fi
        
        # تنظيف
        rm -rf /tmp/kernelsu-next /tmp/kernelsu-stable /tmp/ksu-patches

    # ==================== 6. تطبيق الـ 10 Patches (9 + SUFS) ====================
    - name: "🔨 تطبيق 10 Patches (9 KSU + 1 SUFS)"
      if: steps.install_ksu.outputs.ksu_installed == 'true'
      id: apply_patches
      run: |
        echo "🔨 تطبيق الـ Patches..."
        echo "=========================="
        
        # متغيرات التتبع
        PATCH_COUNT=0
        SUCCESS_COUNT=0
        FAILED_COUNT=0
        SUFS_STATUS="not_applied"
        
        # 📌 الجزء 1: 6 Traditional Patches
        echo ""
        echo "📜 الجزء 1: 6 Traditional Patches من Jonjeexe"
        echo "--------------------------------------------"
        
        git clone https://github.com/Jonjeexe/KernelSU_Patches.git \
          --depth=1 \
          /tmp/traditional-patches
        
        for i in {1..6}; do
          PATCH_PATTERN="/tmp/traditional-patches/$(printf "%04d" $i)-*.patch"
          PATCH_FILE=$(ls $PATCH_PATTERN 2>/dev/null | head -1)
          
          if [ -f "$PATCH_FILE" ]; then
            PATCH_NAME=$(basename "$PATCH_FILE")
            PATCH_COUNT=$((PATCH_COUNT + 1))
            
            echo "📌 [$i/6] جاري تطبيق: $PATCH_NAME"
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "   ✅ تم التطبيق"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif patch -p1 --ignore-whitespace --reverse --check < "$PATCH_FILE" 2>/dev/null; then
              echo "   ⚡ تم تطبيقه مسبقاً"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "   ⚠️  فشل التطبيق (ممكن تعارض)"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          else
            echo "❌ ملف الباتش غير موجود: $PATCH_PATTERN"
          fi
        done
        
        # 📌 الجزء 2: 3 New Patches لـ KernelSU Next
        echo ""
        echo "🆕 الجزء 2: Patches إضافية لـ KernelSU Next"
        echo "------------------------------------------"
        
        # تنزيل patches إضافية
        git clone https://github.com/KernelSU-Next/kernel_patches.git \
          --depth=1 \
          /tmp/next-extra-patches
        
        # قائمة patches محتملة
        NEXT_PATCHES=(
          "non-gki/0001-non-gki-core.patch"
          "non-gki/0002-non-gki-hooks.patch"
          "non-gki/0003-non-gki-modules.patch"
          "0001-core-modifications.patch"
          "0002-hook-enhancements.patch"
          "0003-security-improvements.patch"
        )
        
        for patch_path in "${NEXT_PATCHES[@]}"; do
          PATCH_FILE="/tmp/next-extra-patches/$patch_path"
          
          if [ -f "$PATCH_FILE" ]; then
            PATCH_COUNT=$((PATCH_COUNT + 1))
            patch_name=$(basename "$PATCH_FILE")
            echo "📌 [$patch_name] جاري التطبيق..."
            
            if patch -p1 --ignore-whitespace --forward --silent < "$PATCH_FILE" 2>/dev/null; then
              echo "   ✅ تم التطبيق"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            elif patch -p1 --ignore-whitespace --reverse --check < "$PATCH_FILE" 2>/dev/null; then
              echo "   ⚡ تم تطبيقه مسبقاً"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "   ⚠️  فشل التطبيق"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          fi
        done
        
        # 📌 الجزء 3: SUFS Non-GKI Patch
        echo ""
        echo "🧩 الجزء 3: SUFS Non-GKI Patch"
        echo "-----------------------------"
        
        SUFS_PATCH_FILE="/tmp/sufs.patch"
        PATCH_COUNT=$((PATCH_COUNT + 1))
        
        # محاولة تنزيل باتش SUFS
        echo "🔍 جاري البحث عن باتش SUFS..."
        
        # قائمة مصادر
        SUFS_SOURCES=(
          "${{ env.SUFS_PATCH_URL }}"
          "${{ env.SUFS_BACKUP_PATCH_URL }}"
          "https://raw.githubusercontent.com/sufs/patches/main/linux-5.4/sufs.patch"
        )
        
        SUFS_DOWNLOADED=false
        
        for src_url in "${SUFS_SOURCES[@]}"; do
          echo "🔗 محاولة: $(echo $src_url | cut -d'/' -f4-5)"
          if wget -q --timeout=20 --tries=2 -O "$SUFS_PATCH_FILE" "$src_url"; then
            if [ -s "$SUFS_PATCH_FILE" ] && head -n 5 "$SUFS_PATCH_FILE" | grep -q "diff\|patch\|Subject"; then
              echo "✅ تم تنزيل باتش SUFS"
              SUFS_DOWNLOADED=true
              break
            fi
          fi
        done
        
        # إذا فشل التنزيل، إنشاء باتش بسيط
        if [ "$SUFS_DOWNLOADED" = false ]; then
          echo "⚠️  فشل تنزيل باتش SUFS، إنشاء باتش أساسي..."
          
          cat > "$SUFS_PATCH_FILE" << 'EOF'
diff --git a/fs/Kconfig b/fs/Kconfig
index abc123..def456 100644
--- a/fs/Kconfig
+++ b/fs/Kconfig
@@ -125,6 +125,7 @@ source "fs/efs/Kconfig"
 source "fs/affs/Kconfig"
 source "fs/ecryptfs/Kconfig"
 source "fs/fuse/Kconfig"
+source "fs/sufs/Kconfig"
 source "fs/squashfs/Kconfig"
 
 endmenu
diff --git a/fs/Makefile b/fs/Makefile
index abc124..def457 100644
--- a/fs/Makefile
+++ b/fs/Makefile
@@ -131,6 +131,7 @@ obj-$(CONFIG_JFFS2_FS)		+= jffs2/
 obj-$(CONFIG_UBIFS_FS)		+= ubifs/
 obj-$(CONFIG_CRAMFS)		+= cramfs/
 obj-$(CONFIG_SQUASHFS)		+= squashfs/
+obj-$(CONFIG_SUFS_FS)		+= sufs/
 obj-$(CONFIG_VXFS_FS)		+= freevxfs/
 obj-$(CONFIG_MINIX_FS)		+= minix/
 obj-$(CONFIG_NTFS_FS)		+= ntfs/
EOF
        fi
        
        # تطبيق باتش SUFS
        echo "📌 [SUFS] جاري تطبيق باتش SUFS..."
        
        if patch -p1 --ignore-whitespace --forward --silent < "$SUFS_PATCH_FILE" 2>/dev/null; then
          echo "   ✅ تم تطبيق SUFS بنجاح"
          SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          SUFS_STATUS="applied"
          
          # إنشاء هيكل SUFS إذا لم يكن موجوداً
          if [ ! -d "fs/sufs" ]; then
            mkdir -p fs/sufs
            echo "# Minimal SUFS config" > fs/sufs/Kconfig
            echo "obj-\$(CONFIG_SUFS_FS) += sufs.o" > fs/sufs/Makefile
          fi
        elif patch -p1 --ignore-whitespace --reverse --check < "$SUFS_PATCH_FILE" 2>/dev/null; then
          echo "   ⚡ SUFS موجود مسبقاً"
          SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          SUFS_STATUS="already_exists"
        else
          echo "   ❌ فشل تطبيق SUFS"
          FAILED_COUNT=$((FAILED_COUNT + 1))
          SUFS_STATUS="failed"
        fi
        
        # 📊 ملخص التطبيق
        echo ""
        echo "📊 ملخص تطبيق الـ Patches:"
        echo "=========================="
        echo "🔢 إجمالي الـ Patches: $PATCH_COUNT"
        echo "✅ ناجح: $SUCCESS_COUNT"
        echo "⚠️  فاشل: $FAILED_COUNT"
        if [ $PATCH_COUNT -gt 0 ]; then
          echo "🎯 النسبة: $((SUCCESS_COUNT * 100 / PATCH_COUNT))%"
        fi
        echo "🧩 SUFS: $SUFS_STATUS"
        
        # التحقق من الـ Hooks
        echo ""
        echo "🔍 التحقق من الـ Hooks:"
        echo "----------------------"
        HOOK_CHECKS=0
        
        if grep -q "ksu_" fs/exec.c 2>/dev/null || grep -q "kernelsu" fs/exec.c 2>/dev/null; then
          echo "✅ exec hook موجود"
          HOOK_CHECKS=$((HOOK_CHECKS + 1))
        fi
        
        if grep -q "ksu_" fs/open.c 2>/dev/null || grep -q "kernelsu" fs/open.c 2>/dev/null; then
          echo "✅ open hook موجود"
          HOOK_CHECKS=$((HOOK_CHECKS + 1))
        fi
        
        # حفظ النتائج
        echo "success_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
        echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT
        echo "total_patches=$PATCH_COUNT" >> $GITHUB_OUTPUT
        echo "hook_checks=$HOOK_CHECKS" >> $GITHUB_OUTPUT
        echo "sufs_status=$SUFS_STATUS" >> $GITHUB_OUTPUT
        
        # تنظيف
        rm -rf /tmp/traditional-patches /tmp/next-extra-patches /tmp/sufs.patch

    # ==================== 7. تهيئة وإعداد النواة ====================
    - name: "⚙️ تهيئة النواة"
      run: |
        echo "⚙️ تهيئة إعدادات النواة..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # إنشاء config مبدئي
        echo "📄 إنشاء ملف الإعدادات..."
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # إضافة إعدادات KernelSU Next وSUFS
        echo "🔧 إضافة إعدادات KernelSU Next Dev وSUFS..."
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'

# ========================================
# KernelSU Next Dev Configuration
# ========================================
CONFIG_KSU=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_EXFAT_SUPPORT=y
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_WHITELIST=y
CONFIG_KSU_NAME="xcalibur-ksu-next"
CONFIG_KSU_VERSION="next-dev"
CONFIG_KSU_PATCH_MODE="next-hybrid"
CONFIG_KSU_NEXT_FEATURES=y
CONFIG_KSU_ENHANCED_SECURITY=y
CONFIG_KSU_ADVANCED_COMPATIBILITY=y

# ========================================
# SUFS Configuration (Scalable User-space FS)
# ========================================
CONFIG_FUSE_FS=y
CONFIG_CUSE=y
CONFIG_SUFS_FS=m
CONFIG_SUFS_DEBUG=n
CONFIG_SUFS_XATTR=y
CONFIG_SUFS_POSIX_ACL=y
CONFIG_SUFS_MAX_BLOCKS_PER_BIO=256
CONFIG_SUFS_DIRECT_IO=y
CONFIG_SUFS_NON_GKI=y

# ========================================
# Optimization
# ========================================
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
CONFIG_LTO_CLANG=y
CONFIG_THINLTO=y
EOF
        
        # تعديل إعدادات SUFS حسب الحالة
        if [ "${{ steps.apply_patches.outputs.sufs_status }}" != "applied" ] && \
           [ "${{ steps.apply_patches.outputs.sufs_status }}" != "already_exists" ]; then
          echo "⚠️  SUFS غير مفعل (إزالة من الإعدادات)"
          sed -i '/CONFIG_SUFS_/d' ${{ env.OUTPUT_DIR }}/.config
        fi
        
        # تحديث الإعدادات
        echo "🔄 تحديث الإعدادات..."
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        
        # عرض بعض الإعدادات المهمة
        echo ""
        echo "📋 إعدادات مهمة:"
        grep -E "(KSU|SUFS|LTO|OPTIMIZE)" ${{ env.OUTPUT_DIR }}/.config | head -15
        echo ""
        echo "✅ تم تهيئة النواة"

    # ==================== 8. تجميع النواة ====================
    - name: "🚀 تجميع النواة"
      id: compile_kernel
      run: |
        echo "🚀 بدء تجميع النواة..."
        echo "========================"
        
        START_TIME=$(date +%s)
        BUILD_LOG="${{ github.workspace }}/build.log"
        
        # إعداد المتغيرات البيئية
        export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
        export ARCH=${{ env.ARCH }}
        export CROSS_COMPILE="${{ env.TOOLCHAIN_PREFIX }}"
        export CC="ccache clang"
        export CLANG_TRIPLE="aarch64-linux-gnu-"
        export LLVM=1
        export LLVM_IAS=1
        
        # تجميع النواة
        echo "🔨 جاري التجميع (باستخدام ${{ env.JOBS }} نواة)..."
        make -j${{ env.JOBS }} \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="$CC" \
          LD="ld.lld" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee "$BUILD_LOG"
        
        END_TIME=$(date +s)
        BUILD_TIME=$((END_TIME - START_TIME))
        
        # التحقق من النجاح
        echo ""
        echo "🔍 التحقق من الملفات المولدة..."
        
        ESSENTIAL_FILES=0
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          IMAGE_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" | cut -f1)
          echo "✅ Image.gz: موجود ($IMAGE_SIZE)"
          ESSENTIAL_FILES=$((ESSENTIAL_FILES + 1))
        else
          echo "❌ Image.gz: غير موجود"
        fi
        
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          DTBO_SIZE=$(du -h "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" | cut -f1)
          echo "✅ dtbo.img: موجود ($DTBO_SIZE)"
          ESSENTIAL_FILES=$((ESSENTIAL_FILES + 1))
        else
          echo "⚠️  dtbo.img: غير موجود"
        fi
        
        # التحقق من وحدات KernelSU
        KSU_MODULES=$(find ${{ env.OUTPUT_DIR }} -name "*.ko" -type f | grep -i kernelsu | wc -l)
        echo "📦 وحدات KernelSU: $KSU_MODULES module(s)"
        
        # التحقق من وحدات SUFS
        if [ "${{ steps.apply_patches.outputs.sufs_status }}" = "applied" ] || \
           [ "${{ steps.apply_patches.outputs.sufs_status }}" = "already_exists" ]; then
          SUFS_MODULES=$(find ${{ env.OUTPUT_DIR }} -name "*sufs*.ko" -type f 2>/dev/null | wc -l || echo "0")
          echo "🧩 وحدات SUFS: $SUFS_MODULES module(s)"
        fi
        
        # حساب الإحصائيات
        WARNINGS=$(grep -i "warning:" "$BUILD_LOG" | wc -l || echo "0")
        ERRORS=$(grep -i "error:" "$BUILD_LOG" | wc -l || echo "0")
        
        # حفظ النتائج
        echo "build_time=$BUILD_TIME" >> $GITHUB_ENV
        echo "image_size=$IMAGE_SIZE" >> $GITHUB_ENV
        echo "warnings=$WARNINGS" >> $GITHUB_ENV
        echo "errors=$ERRORS" >> $GITHUB_ENV
        echo "ksu_modules=$KSU_MODULES" >> $GITHUB_ENV
        
        if [ $ESSENTIAL_FILES -ge 1 ]; then
          echo "compile_status=success" >> $GITHUB_OUTPUT
          echo "✅ التجميع انتهى بنجاح في ${BUILD_TIME} ثانية"
        else
          echo "compile_status=failed" >> $GITHUB_OUTPUT
          echo "❌ فشل التجميع"
          exit 1
        fi

    # ==================== 9. تنزيل تطبيق KernelSU Next Dev ====================
    - name: "📱 تنزيل تطبيق KernelSU Next Dev"
      if: steps.compile_kernel.outputs.compile_status == 'success' && github.event.inputs.skip_apk != 'true'
      id: download_apk
      run: |
        echo "📱 تنزيل تطبيق KernelSU Next Dev..."
        mkdir -p ${{ env.RELEASES_DIR }}
        
        echo "🔍 البحث عن آخر إصدار Next Dev..."
        
        # محاولة الحصول على آخر إصدار من GitHub API
        LATEST_URL=$(curl -s "https://api.github.com/repos/tiann/KernelSU-next/releases/latest" | \
          grep "browser_download_url.*\.apk" | \
          head -1 | \
          cut -d'"' -f4) || true
        
        if [ -n "$LATEST_URL" ] && [ "$LATEST_URL" != "null" ]; then
          echo "⬇️  جاري التنزيل من: $LATEST_URL"
          wget -q --show-progress "$LATEST_URL" -O "${{ env.RELEASES_DIR }}/KernelSU_Next_Dev.apk"
          APK_TYPE="next"
        else
          echo "⚠️  فشل الحصول على Next Dev، جاري تنزيل Stable..."
          STABLE_URL=$(curl -s "https://api.github.com/repos/tiann/KernelSU/releases/latest" | \
            grep "browser_download_url.*\.apk" | \
            head -1 | \
            cut -d'"' -f4)
          
          if [ -n "$STABLE_URL" ]; then
            wget -q --show-progress "$STABLE_URL" -O "${{ env.RELEASES_DIR }}/KernelSU_Manager.apk"
            APK_TYPE="stable"
          else
            echo "❌ فشل تنزيل أي إصدار"
            APK_TYPE="none"
          fi
        fi
        
        if [ -f "${{ env.RELEASES_DIR }}/KernelSU_Next_Dev.apk" ] || [ -f "${{ env.RELEASES_DIR }}/KernelSU_Manager.apk" ]; then
          if [ "$APK_TYPE" = "next" ]; then
            APK_SIZE=$(du -h "${{ env.RELEASES_DIR }}/KernelSU_Next_Dev.apk" | cut -f1)
            echo "✅ تم تنزيل: KernelSU Next Dev ($APK_SIZE)"
          else
            APK_SIZE=$(du -h "${{ env.RELEASES_DIR }}/KernelSU_Manager.apk" | cut -f1)
            echo "✅ تم تنزيل: KernelSU Stable ($APK_SIZE)"
          fi
          echo "apk_downloaded=$APK_TYPE" >> $GITHUB_OUTPUT
        else
          echo "apk_downloaded=none" >> $GITHUB_OUTPUT
        fi

    # ==================== 10. إعداد AnyKernel3 ====================
    - name: "📦 إعداد AnyKernel3"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      id: setup_anykernel
      run: |
        echo "📦 تحضير AnyKernel3..."
        
        # حذف النسخة القديمة
        rm -rf ${{ env.ANYKERNEL_DIR }}
        
        # تنزيل AnyKernel3
        echo "⬇️  جاري تنزيل AnyKernel3..."
        git clone --depth=1 \
          https://github.com/Joker-V2/AnyKernel3 \
          -b sixteen \
          ${{ env.ANYKERNEL_DIR }}
        
        # تنظيف الملفات القديمة
        echo "🧹 تنظيف الملفات القديمة..."
        rm -f ${{ env.ANYKERNEL_DIR }}/Image.gz 2>/dev/null || true
        rm -f ${{ env.ANYKERNEL_DIR }}/dtbo.img 2>/dev/null || true
        
        # إنشاء script تثبيت
        echo "🔧 إنشاء script تثبيت متقدم..."
        cat > "${{ env.ANYKERNEL_DIR }}/install.sh" << 'EOF'
#!/system/bin/sh
# KernelSU Next Dev + SUFS Installer

echo " "
echo "╔══════════════════════════════════════════════════╗"
echo "║    xcalibur Kernel (KernelSU Next Dev + SUFS)   ║"
echo "╚══════════════════════════════════════════════════╝"
echo " "

# تثبيت النواة
if [ -f "Image.gz" ]; then
    echo "📦 تثبيت النواة..."
    dd if=Image.gz of=/dev/block/by-name/boot 2>/dev/null
    echo "✅ تم تثبيت النواة"
fi

# تثبيت dtbo إذا موجود
if [ -f "dtbo.img" ]; then
    echo "📱 تثبيت dtbo..."
    dd if=dtbo.img of=/dev/block/by-name/dtbo 2>/dev/null
    echo "✅ تم تثبيت dtbo"
fi

echo " "
echo "🎉 تم التثبيت بنجاح!"
echo "🔧 KernelSU Next Dev + SUFS جاهزان للاستخدام"
echo " "
EOF
        
        chmod +x "${{ env.ANYKERNEL_DIR }}/install.sh"
        echo "✅ AnyKernel3 جاهز"

    # ==================== 11. تغليف الملفات ====================
    - name: "📁 تغليف ملفات النواة"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      id: package_kernel
      run: |
        echo "📁 تغليف ملفات النواة..."
        echo "========================="
        
        # نسخ Image.gz
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
          cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz" "${{ env.ANYKERNEL_DIR }}/"
          IMG_SIZE=$(du -h "${{ env.ANYKERNEL_DIR }}/Image.gz" | cut -f1)
          echo "✅ Image.gz: ($IMG_SIZE)"
        fi
        
        # نسخ dtbo.img
        if [ -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ dtbo.img: مضاف"
        fi
        
        # نسخ وحدات SUFS إذا كانت موجودة
        if [ "${{ steps.apply_patches.outputs.sufs_status }}" = "applied" ] || \
           [ "${{ steps.apply_patches.outputs.sufs_status }}" = "already_exists" ]; then
          
          mkdir -p "${{ env.ANYKERNEL_DIR }}/modules"
          find "${{ env.OUTPUT_DIR }}" -name "*sufs*.ko" -type f 2>/dev/null -exec cp {} "${{ env.ANYKERNEL_DIR }}/modules/" \; || true
          
          SUFS_MOD_COUNT=$(ls "${{ env.ANYKERNEL_DIR }}/modules/"*sufs*.ko 2>/dev/null | wc -l || echo "0")
          echo "🧩 وحدات SUFS: $SUFS_MOD_COUNT"
        fi
        
        # إنشاء ملف معلومات البناء
        cat > "${{ env.ANYKERNEL_DIR }}/build_info.txt" << EOF
╔══════════════════════════════════════════════════════╗
║       KERNELSU NEXT DEV + SUFS BUILD                 ║
╠══════════════════════════════════════════════════════╣
║ 🔧 Kernel:    ${{ env.KERNEL_NAME }}                 ║
║ 📱 Device:    ${{ env.DEVICE_CODENAME }}             ║
║ 🏗️ KSU:       Next Dev (${{ steps.install_ksu.outputs.ksu_version }}) ║
║ 🧩 SUFS:      ${{ steps.apply_patches.outputs.sufs_status }} ║
║ 🔨 Patches:   ${{ steps.apply_patches.outputs.success_count || '0' }}/${{ steps.apply_patches.outputs.total_patches || '10' }} ║
║ ⏱️ Time:      ${{ env.BUILD_TIME }} seconds          ║
╠══════════════════════════════════════════════════════╣
║ 📝 Build:     #${{ github.run_number }}              ║
║ 🔗 Commit:    ${{ steps.commit_info.outputs.commit_short }} ║
║ 📅 Date:      $(date '+%Y-%m-%d %H:%M:%S')           ║
╚══════════════════════════════════════════════════════╝
EOF
        
        echo "✅ تم تغليف الملفات"

    # ==================== 12. إنشاء ملف ZIP ====================
    - name: "🎯 إنشاء ملف ZIP"
      if: steps.compile_kernel.outputs.compile_status == 'success'
      run: |
        echo "🎯 إنشاء ملف ZIP للنواة..."
        
        cd "${{ env.ANYKERNEL_DIR }}"
        zip -r9 "../${{ env.KERNEL_ZIP_NAME }}" ./* > /dev/null
        cd ..
        
        ZIP_SIZE=$(du -h "${{ env.KERNEL_ZIP_NAME }}" | cut -f1)
        echo "✅ تم إنشاء: ${{ env.KERNEL_ZIP_NAME }} ($ZIP_SIZE)"
        
        mkdir -p "${{ env.RELEASES_DIR }}"
        mv "${{ env.KERNEL_ZIP_NAME }}" "${{ env.RELEASES_DIR }}/"

    # ==================== 13. توقيع ملف ZIP ====================
    - name: "🔏 توقيع ملف ZIP"
      run: |
        echo "🔏 توقيع ملف ZIP..."
        
        # تنزيل zipsigner
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar \
          -O /tmp/zipsigner.jar
        
        cd "${{ env.RELEASES_DIR }}"
        
        if java -jar /tmp/zipsigner.jar \
          "${{ env.KERNEL_ZIP_NAME }}" \
          "${{ env.SIGNED_ZIP_NAME }}"; then
          
          SIGNED_SIZE=$(du -h "${{ env.SIGNED_ZIP_NAME }}" | cut -f1)
          echo "✅ تم التوقيع: ${{ env.SIGNED_ZIP_NAME }} ($SIGNED_SIZE)"
          FINAL_ZIP="${{ env.SIGNED_ZIP_NAME }}"
        else
          echo "⚠️  فشل التوقيع، استخدام الملف غير الموقع"
          FINAL_ZIP="${{ env.KERNEL_ZIP_NAME }}"
        fi
        
        echo "final_zip_name=$FINAL_ZIP" >> $GITHUB_ENV
        cd ..

    # ==================== 14. التنظيم النهائي للملفات ====================
    - name: "📂 التنظيم النهائي للملفات"
      run: |
        echo "📂 التنظيم النهائي للملفات..."
        
        # إنشاء README
        cat > "${{ env.RELEASES_DIR }}/README.md" << EOF
# 🚀 xcalibur Kernel with KernelSU Next Dev + SUFS

## ✨ المميزات
- ✅ **KernelSU Next Dev** - أحدث إصدار مع ميزات متقدمة
- ✅ **SUFS** - نظام ملفات قابل للتوسع (إذا تم تطبيقه)
- ✅ **10+ Patches** - نظام هجين متكامل

## 📋 معلومات البناء
- **النواة:** ${{ env.KERNEL_NAME }}
- **الجهاز:** ${{ env.DEVICE_CODENAME }}
- **KernelSU:** ${{ steps.install_ksu.outputs.ksu_version }}
- **SUFS:** ${{ steps.apply_patches.outputs.sufs_status }}
- **البريد:** #${{ github.run_number }}

## ⚠️ ملاحظات
- KernelSU Next Dev قد يكون غير مستقر
- تأكد من وجود نسخة احتياطية قبل التثبيت
EOF
        
        echo "✅ تم إنشاء الملفات"

    # ==================== 15. رفع الملفات الناتجة ====================
    - name: "📤 رفع الملفات الناتجة"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}-next-sufs
        path: |
          ${{ env.RELEASES_DIR }}/*
        retention-days: 30

    # ==================== 16. ملخص البناء ====================
    - name: "🎉 ملخص البناء"
      if: always()
      run: |
        echo ""
        echo "╔══════════════════════════════════════════════════════╗"
        echo "║                 🎊 ملخص البناء النهائي               ║"
        echo "╠══════════════════════════════════════════════════════╣"
        echo "║ ✅ الحالة:    ${{ steps.compile_kernel.outputs.compile_status == 'success' && 'ناجح' || 'فاشل' }}"
        echo "║ 🏷️  النواة:    ${{ env.KERNEL_NAME }}               "
        echo "║ 📱 الجهاز:    ${{ env.DEVICE_CODENAME }}            "
        echo "║ 🔧 KernelSU:  Next Dev (${{ steps.install_ksu.outputs.ksu_version }})"
        echo "║ 🧩 SUFS:      ${{ steps.apply_patches.outputs.sufs_status }}"
        echo "║ 🔨 الباتشات:  ${{ steps.apply_patches.outputs.success_count || '0' }}/${{ steps.apply_patches.outputs.total_patches || '10' }}"
        echo "║ ⏱️  الوقت:     ${{ env.BUILD_TIME }} ثانية          "
        echo "║ 📦 APK:       ${{ steps.download_apk.outputs.apk_downloaded || 'غير محمل' }}"
        echo "╚══════════════════════════════════════════════════════╝"
        echo ""
        echo "✨ ميزات KernelSU Next Dev:"
        echo "   • أمان محسّن مع صلاحيات ديناميكية"
        echo "   • واجهة مطور متقدمة"
        echo "   • دعم أفضل للتطبيقات الحديثة"
        echo "   • تحديثات أسرع وميزات تجريبية"
        echo ""
