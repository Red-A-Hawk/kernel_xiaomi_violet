name: Build Fixed - Defconfig

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex git \
        libssl-dev libncurses5-dev lzop zip wget python3
        
        # Setup swap
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "✅ Environment ready"
        
    - name: Add KernelSU Next
      run: |
        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next KernelSU
        echo "✅ KernelSU added"
        
    - name: Download Clang
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        mkdir clang
        tar -xf Clang-*.tar.gz -C clang/
        rm Clang-*.tar.gz
        echo "✅ Clang ready"
        
    - name: Find and Use Defconfig
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        echo "🔍 Searching for defconfig..."
        echo "Available configs for violet:"
        ls arch/arm64/configs/ | grep -i violet || echo "No violet configs found"
        
        echo ""
        echo "🔍 All available configs:"
        ls arch/arm64/configs/ | head -20
        
        echo ""
        echo "⚙️ Trying configs..."
        
        # Try multiple config names
        if make O=out vendor/violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using vendor/violet-perf_defconfig"
        elif make O=out violet-perf_defconfig 2>/dev/null; then
          echo "✅ Using violet-perf_defconfig"
        elif make O=out violet_defconfig 2>/dev/null; then
          echo "✅ Using violet_defconfig"
        elif make O=out sdm710-perf_defconfig 2>/dev/null; then
          echo "✅ Using sdm710-perf_defconfig"
        else
          echo "❌ No valid defconfig found!"
          echo "Available configs:"
          ls arch/arm64/configs/
          exit 1
        fi
        
        echo "✅ Config generated"
        ls -la out/.config
        
    - name: Compile Kernel
      run: |
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        echo "🔨 Starting build..."
        
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          2>&1 | tee build.log
          
        BUILD_EXIT=$?
        
        if [ $BUILD_EXIT -eq 0 ]; then
          echo "✅ Build successful"
        else
          echo "❌ Build failed with exit code $BUILD_EXIT"
          echo "📋 Last 50 lines of build log:"
          tail -50 build.log
          exit $BUILD_EXIT
        fi
        
    - name: Check Output
      id: check
      run: |
        IMAGE=out/arch/arm64/boot/Image.gz
        
        if [ -f "$IMAGE" ]; then
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Kernel built successfully"
          ls -lh $IMAGE
        else
          echo "success=false" >> $GITHUB_OUTPUT
          echo "❌ Image.gz not found"
          echo "📂 Contents of out/arch/arm64/boot/:"
          ls -la out/arch/arm64/boot/ || echo "Directory doesn't exist"
          exit 1
        fi
        
    - name: Create ZIP
      if: steps.check.outputs.success == 'true'
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 -b sixteen AK3
        
        cp out/arch/arm64/boot/Image.gz AK3/
        
        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img AK3/
          echo "✅ dtbo.img included"
        fi
        
        cd AK3
        zip -r9 ../Violet-KSU-$(date +%Y%m%d).zip *
        cd ..
        
        echo "✅ ZIP created"
        ls -lh Violet-KSU-*.zip
        
    - name: Upload Kernel
      if: steps.check.outputs.success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ github.run_number }}
        path: Violet-KSU-*.zip
        
    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: BuildLog-${{ github.run_number }}
        path: build.log
