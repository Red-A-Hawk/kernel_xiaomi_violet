name: Build Kernel (violet | susfs-1.5 + SukiSU Ultra)

on:
  push:
    branches:
      - test3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test3
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless

    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 🔒 Inject KernelSU (commit ثابت – 6 جانفي)
    - name: Inject SukiSU Ultra (fixed commit - Jan 6)
      run: |
        set -e
        curl -LSs \
          https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/496837ad81b9332d352b0b17184a0d637c81b7cc/kernel/setup.sh \
          | bash

    # ✅ تحقق صريح: drivers/kernelsu + الكوميت
    - name: Verify KernelSU source (commit + path)
      run: |
        set -e

        echo "[*] Checking drivers/kernelsu ..."
        if [ ! -d drivers/kernelsu ]; then
          echo "[ERROR] drivers/kernelsu not found!"
          exit 1
        fi
        echo "[OK] drivers/kernelsu exists"

        if [ ! -d KernelSU/.git ]; then
          echo "[ERROR] KernelSU repo missing .git"
          exit 1
        fi

        cd KernelSU
        CURRENT_COMMIT=$(git rev-parse HEAD)
        EXPECTED_COMMIT=496837ad81b9332d352b0b17184a0d637c81b7cc

        echo "[*] Current commit : $CURRENT_COMMIT"
        echo "[*] Expected commit: $EXPECTED_COMMIT"

        if [ "$CURRENT_COMMIT" != "$EXPECTED_COMMIT" ]; then
          echo "[ERROR] KernelSU commit mismatch!"
          exit 1
        fi

        echo "[OK] KernelSU commit verified (Jan 6)"

    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    - name: Fix KernelSU config
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KPROBES \
          --set-str LOCALVERSION "-sukisu-susfs"
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    - name: Check build output
      run: |
        test -f out/arch/arm64/boot/Image.gz

    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs.zip *

    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-sukisu-susfs
        path: Kernel-violet-sukisu-susfs.zip

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
