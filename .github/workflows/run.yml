name: Run Test Workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print branch
        run: echo "Running on branch $GITHUB_REF"

      - name: Hello
        run: echo "GitHub Actions started successfully"

      - name: Done
        run: echo "Workflow finished"

