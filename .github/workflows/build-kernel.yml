name: Build Kernel with KernelSU

on:
  push:
    branches: [ "sixteen", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'README'
  pull_request:
    branches: [ "sixteen" ]
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU Next Version'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - dev
          - stable
          - legacy
          - v1.1.1
          - v1.1.0
          - v1.0.0
          - none
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    env:
      KERNEL_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out
      KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
      ARCH: arm64
      CONFIG: vendor/violet-perf_defconfig
    
    steps:
      # ========================================
      # 1. تحضير البيئة
      # ========================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # احصل على كل التاريخ للتج
          submodules: recursive
      
      - name: Setup build environment
        run: |
          echo "📦 Setting up build environment..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            git \
            flex \
            bison \
            libssl-dev \
            bc \
            rsync \
            kmod \
            cpio \
            wget \
            curl \
            tar \
            xz-utils \
            python3 \
            ccache \
            libelf-dev \
            libncurses-dev \
            lz4 \
            lzop
          
          echo "🔧 Setting up ccache..."
          sudo /usr/sbin/update-ccache-symlinks
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --max-size=2G
          ccache --zero-stats
      
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-kernel-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-kernel-
      
      # ========================================
      # 2. تنزيل وإعداد التولشين
      # ========================================
      - name: Setup Toolchain
        id: toolchain
        run: |
          echo "🔨 Setting up toolchain..."
          
          # مسار التولشين
          TC_DIR="$HOME/tc/clang"
          mkdir -p "$TC_DIR"
          
          # تنزيل ZyC Clang
          echo "📥 Downloading ZyC Clang 22.0.0..."
          wget -q --show-progress \
            https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920-linux-x86_64.tar.gz \
            -O /tmp/clang.tar.gz
          
          # فك الضغط
          echo "📂 Extracting toolchain..."
          tar -xzf /tmp/clang.tar.gz -C "$TC_DIR" --strip-components=1
          
          # التحقق
          if [ -f "$TC_DIR/bin/clang" ]; then
            echo "✅ Toolchain ready!"
            echo "clang_version=$($TC_DIR/bin/clang --version | head -1)" >> $GITHUB_OUTPUT
          else
            echo "❌ Toolchain setup failed!"
            exit 1
          fi
          
          # إضافة إلى PATH
          echo "$TC_DIR/bin" >> $GITHUB_PATH
      
      # ========================================
      # 3. KernelSU (اختياري)
      # ========================================
      - name: Setup KernelSU
        if: ${{ inputs.kernelsu_version != 'none' }}
        run: |
          echo "🔄 Setting up KernelSU ${{ inputs.kernelsu_version }}..."
          
          KSU_DIR="${{ env.KERNEL_DIR }}/KernelSU"
          
          # Clone/update KernelSU
          if [ ! -d "$KSU_DIR" ]; then
            git clone --depth=1 \
              https://github.com/KernelSU-Next/KernelSU-Next.git \
              "$KSU_DIR"
          fi
          
          cd "$KSU_DIR"
          
          # اختر الفرع المناسب
          case "${{ inputs.kernelsu_version }}" in
            "latest"|"stable")
              git checkout main
              ;;
            "dev")
              git checkout dev
              ;;
            "legacy")
              git checkout legacy
              ;;
            "v1.1.1"|"v1.1.0"|"v1.0.0")
              git checkout tags/${{ inputs.kernelsu_version }}
              ;;
          esac
          
          # تطبيق الباتش
          echo "🔧 Applying KernelSU patches..."
          bash kernel_patch.sh "${{ env.KERNEL_DIR }}"
          
          echo "✅ KernelSU setup complete!"
      
      # ========================================
      # 4. تنظيف البناء (إذا مطلوب)
      # ========================================
      - name: Clean build
        if: ${{ inputs.clean_build == true }}
        run: |
          echo "🧹 Cleaning previous build..."
          make clean || true
          make mrproper || true
          rm -rf out
      
      # ========================================
      # 5. إنشاء مجلد المخرجات
      # ========================================
      - name: Prepare output directory
        run: |
          echo "📁 Creating output directory..."
          mkdir -p "${{ env.OUT_DIR }}"
      
      # ========================================
      # 6. توليد Defconfig
      # ========================================
      - name: Generate defconfig
        run: |
          echo "⚙️  Generating defconfig..."
          
          cd "${{ env.KERNEL_DIR }}"
          
          make O="${{ env.OUT_DIR }}" \
               ARCH="${{ env.ARCH }}" \
               "${{ env.CONFIG }}"
          
          if [ $? -eq 0 ]; then
            echo "✅ Defconfig generated!"
          else
            echo "❌ Defconfig generation failed!"
            exit 1
          fi
      
      # ========================================
      # 7. بناء Kernel
      # ========================================
      - name: Compile kernel
        id: compile
        run: |
          echo "🔨 Compiling kernel..."
          
          cd "${{ env.KERNEL_DIR }}"
          
          START_TIME=$(date +%s)
          
          # عدد الوظائف المتوازية
          CORES=$(nproc)
          JOBS=$((CORES * 2))
          
          echo "🖥️  Using $JOBS jobs on $CORES cores"
          
          # بناء Kernel
          make -j$JOBS \
            O="${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            CC="ccache clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee build.log
          
          COMPILE_EXIT=$?
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          
          echo "compile_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "compile_exit=$COMPILE_EXIT" >> $GITHUB_OUTPUT
          
          if [ $COMPILE_EXIT -ne 0 ]; then
            echo "❌ Compilation failed after ${BUILD_TIME}s!"
            exit 1
          fi
          
          echo "✅ Compilation successful! Time: ${BUILD_TIME}s"
      
      # ========================================
      # 8. التحقق من المخرجات
      # ========================================
      - name: Verify outputs
        id: verify
        run: |
          echo "🔍 Verifying build outputs..."
          
          KERNEL_IMAGE="${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz"
          DTBO_IMAGE="${{ env.OUT_DIR }}/arch/arm64/boot/dtbo.img"
          
          # التحقق من وجود kernel image
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "❌ Kernel image not found!"
            exit 1
          fi
          
          KERNEL_SIZE=$(du -h "$KERNEL_IMAGE" | cut -f1)
          echo "kernel_size=$KERNEL_SIZE" >> $GITHUB_OUTPUT
          echo "kernel_path=$KERNEL_IMAGE" >> $GITHUB_OUTPUT
          echo "✅ Kernel image: $KERNEL_SIZE"
          
          # التحقق من DTBO (اختياري)
          if [ -f "$DTBO_IMAGE" ]; then
            DTBO_SIZE=$(du -h "$DTBO_IMAGE" | cut -f1)
            echo "dtbo_size=$DTBO_SIZE" >> $GITHUB_OUTPUT
            echo "dtbo_path=$DTBO_IMAGE" >> $GITHUB_OUTPUT
            echo "✅ DTBO image: $DTBO_SIZE"
          else
            echo "ℹ️  DTBO image not found (this may be normal)"
          fi
      
      # ========================================
      # 9. إنشاء Flashable ZIP
      # ========================================
      - name: Create flashable zip
        id: zip
        run: |
          echo "📦 Creating flashable zip..."
          
          ZIP_NAME="${{ env.KERNEL_NAME }}-$(date +%Y%m%d-%H%M).zip"
          ANYKERNEL_DIR="/tmp/anykernel"
          
          # تنظيف أي نسخ سابقة
          rm -rf "$ANYKERNEL_DIR"
          
          # Clone AnyKernel3
          git clone --depth=1 \
            https://github.com/Joker-V2/AnyKernel3.git \
            -b sixteen \
            "$ANYKERNEL_DIR"
          
          # نسخ ملفات kernel
          cp "${{ steps.verify.outputs.kernel_path }}" "$ANYKERNEL_DIR/Image.gz"
          
          if [ -n "${{ steps.verify.outputs.dtbo_path }}" ]; then
            cp "${{ steps.verify.outputs.dtbo_path }}" "$ANYKERNEL_DIR/dtbo.img"
          fi
          
          # إنشاء ZIP
          cd "$ANYKERNEL_DIR"
          zip -r9 "$ZIP_NAME" ./*
          
          # نقل إلى المكان النهائي
          FINAL_ZIP="$HOME/$ZIP_NAME"
          mv "$ZIP_NAME" "$FINAL_ZIP"
          
          # توليد MD5
          md5sum "$FINAL_ZIP" > "$FINAL_ZIP.md5"
          
          # إخراج المعلومات
          ZIP_SIZE=$(du -h "$FINAL_ZIP" | cut -f1)
          ZIP_MD5=$(cat "$FINAL_ZIP.md5" | cut -d' ' -f1)
          
          echo "zip_path=$FINAL_ZIP" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
          echo "zip_md5=$ZIP_MD5" >> $GITHUB_OUTPUT
          
          echo "✅ ZIP created: $ZIP_NAME ($ZIP_SIZE)"
          echo "📝 MD5: $ZIP_MD5"
          
          # تنظيف
          rm -rf "$ANYKERNEL_DIR"
      
      # ========================================
      # 10. رفع المخرجات
      # ========================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-$(date +%Y%m%d-%H%M)
          path: |
            ${{ steps.verify.outputs.kernel_path }}
            ${{ steps.zip.outputs.zip_path }}
            ${{ steps.zip.outputs.zip_path }}.md5
          retention-days: 30
      
      # ========================================
      # 11. عرض إحصائيات
      # ========================================
      - name: Show build statistics
        if: always()
        run: |
          echo "📊 Build Statistics"
          echo "=================="
          echo "Kernel: ${{ steps.verify.outputs.kernel_size }}"
          echo "ZIP: ${{ steps.zip.outputs.zip_size }}"
          echo "Build Time: ${{ steps.compile.outputs.compile_time }} seconds"
          echo "CCache Stats:"
          ccache -s
