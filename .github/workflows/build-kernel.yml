name: Build Kernel with KernelSU

on:
  push:
    branches: [ "sixteen", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'README'
  pull_request:
    branches: [ "sixteen" ]
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU Version'
        required: true
        default: 'v1.1.1'
        type: choice
        options:
          - v1.1.1
          - v1.1.0
          - v1.0.0
          - latest
          - dev
          - none
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean
      clang_version:
        description: 'Clang Version'
        required: false
        default: '22.0.0-20250928'
        type: choice
        options:
          - 22.0.0-20250928
          - 22.0.0-20250920
          - 17.0.6

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    env:
      KERNEL_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out
      KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
      ARCH: arm64
      CONFIG: "vendor/violet-perf_defconfig"
    
    steps:
      # ========================================
      # 1. الحصول على مصدر النواة
      # ========================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      # ========================================
      # 2. إعداد بيئة البناء
      # ========================================
      - name: Setup build environment
        run: |
          echo "📦 Setting up build environment..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            git \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            bc \
            rsync \
            kmod \
            cpio \
            wget \
            curl \
            tar \
            xz-utils \
            python3 \
            python3-pip \
            ccache \
            libncurses-dev \
            lz4 \
            lzop \
            gcc-multilib \
            g++-multilib \
            xmlto \
            device-tree-compiler \
            u-boot-tools \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            openssl \
            dwarves
          
          # إعداد ccache
          sudo /usr/sbin/update-ccache-symlinks
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --max-size=2G
          ccache --zero-stats
          
          echo "✅ Build environment ready"
      
      # ========================================
      # 3. استعادة cache
      # ========================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: /opt/zyc-clang
          key: ${{ runner.os }}-zyc-clang-${{ inputs.clang_version }}
          restore-keys: |
            ${{ runner.os }}-zyc-clang-
      
      # ========================================
      # 4. تثبيت ZyC Clang (الرابط الصحيح)
      # ========================================
      - name: Install ZyC Clang
        id: install-clang
        run: |
          echo "🔧 Installing ZyC Clang ${{ inputs.clang_version }}..."
          
          # إنشاء مجلد التولشين
          TC_DIR="/opt/zyc-clang"
          sudo mkdir -p "$TC_DIR"
          
          # اختيار الرابط بناءً على الإصدار
          case "${{ inputs.clang_version }}" in
            "22.0.0-20250928")
              # أحدث إصدار - الرابط الذي وجدته
              CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz"
              ;;
            "22.0.0-20250920")
              # الإصدار السابق
              CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"
              ;;
            "17.0.6")
              # إصدار أقدم إذا لزم
              CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/17.0.6-release/Clang-17.0.6.tar.gz"
              ;;
            *)
              # الإفتراضي
              CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz"
              ;;
          esac
          
          echo "📥 Downloading from: $CLANG_URL"
          
          # تنزيل التولشين
          if sudo wget -q --show-progress --timeout=60 "$CLANG_URL" -O /tmp/clang.tar.gz; then
            echo "📂 Extracting toolchain..."
            
            # استخراج مع strip-components=1 لإزالة المجلد الأول
            sudo tar -xzf /tmp/clang.tar.gz -C "$TC_DIR" --strip-components=1
            
            # تنظيف
            sudo rm -f /tmp/clang.tar.gz
            
            # التحقق من التثبيت
            if [ -f "$TC_DIR/bin/clang" ]; then
              echo "✅ Clang installed successfully!"
              
              # عرض معلومات الإصدار
              echo "📊 Clang version:"
              "$TC_DIR/bin/clang" --version | head -3
              
              # إخراج معلومات للمراحل التالية
              echo "toolchain_path=$TC_DIR/bin" >> $GITHUB_OUTPUT
              
              # إضافة إلى PATH
              echo "$TC_DIR/bin" >> $GITHUB_PATH
            else
              echo "❌ Clang binary not found after extraction!"
              echo "Contents of $TC_DIR:"
              ls -la "$TC_DIR"
              exit 1
            fi
          else
            echo "❌ Failed to download toolchain!"
            echo "Trying alternative link..."
            
            # رابط بديل
            ALT_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928-linux-x86_64.tar.gz"
            sudo wget -q "$ALT_URL" -O /tmp/clang-alt.tar.gz
            sudo tar -xzf /tmp/clang-alt.tar.gz -C "$TC_DIR" --strip-components=1
            
            if [ -f "$TC_DIR/bin/clang" ]; then
              echo "✅ Clang installed from alternative link!"
              echo "$TC_DIR/bin" >> $GITHUB_PATH
            else
              echo "❌ All download attempts failed!"
              exit 1
            fi
          fi
          
          echo "Toolchain ready at: $TC_DIR/bin"
      
      # ========================================
      # 5. إعداد KernelSU (الطريقة المضمونة)
      # ========================================
      - name: Setup KernelSU
        id: kernelsu
        if: ${{ inputs.kernelsu_version != 'none' }}
        run: |
          echo "🔄 Setting up KernelSU ${{ inputs.kernelsu_version }}..."
          
          KERNEL_DIR="${{ env.KERNEL_DIR }}"
          KSU_VERSION="${{ inputs.kernelsu_version }}"
          
          # إنشاء مجلد مؤقت
          KSU_TEMP="/tmp/kernelsu_$(date +%s)"
          mkdir -p "$KSU_TEMP"
          
          # معالجة كل إصدار
          case "$KSU_VERSION" in
            v1.1.1|v1.1.0|v1.0.0)
              echo "📦 Downloading KernelSU $KSU_VERSION from releases..."
              
              # تنزيل من صفحة Releases مباشرة
              RELEASE_URL="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/$KSU_VERSION/KernelSU-$KSU_VERSION.zip"
              
              if wget -q --show-progress "$RELEASE_URL" -O "$KSU_TEMP/kernelsu.zip"; then
                echo "📂 Extracting..."
                unzip -q "$KSU_TEMP/kernelsu.zip" -d "$KSU_TEMP"
                
                # المسار بعد الاستخراج
                KSU_SRC="$KSU_TEMP/KernelSU-$KSU_VERSION"
                
                if [ -d "$KSU_SRC" ]; then
                  echo "✅ Downloaded KernelSU $KSU_VERSION"
                else
                  echo "❌ Extraction failed!"
                  exit 1
                fi
              else
                echo "❌ Download failed!"
                exit 1
              fi
              ;;
              
            latest|stable)
              echo "⬇️ Cloning latest stable KernelSU..."
              git clone --depth=1 \
                https://github.com/KernelSU-Next/KernelSU-Next.git \
                --branch=main \
                "$KSU_TEMP"
              KSU_SRC="$KSU_TEMP"
              ;;
              
            dev)
              echo "🧪 Cloning development KernelSU..."
              git clone --depth=1 \
                https://github.com/KernelSU-Next/KernelSU-Next.git \
                --branch=dev \
                "$KSU_TEMP"
              KSU_SRC="$KSU_TEMP"
              ;;
              
            *)
              echo "❌ Unknown KernelSU version: $KSU_VERSION"
              exit 1
              ;;
          esac
          
          # تطبيق KernelSU على النواة
          echo "🔨 Applying KernelSU to kernel source..."
          
          if [ -f "$KSU_SRC/kernel/setup.sh" ]; then
            echo "Using setup.sh..."
            cd "$KSU_SRC/kernel"
            chmod +x setup.sh
            ./setup.sh "$KERNEL_DIR"
          elif [ -f "$KSU_SRC/kernel/kernel_patch.sh" ]; then
            echo "Using kernel_patch.sh..."
            cd "$KSU_SRC/kernel"
            chmod +x kernel_patch.sh
            ./kernel_patch.sh "$KERNEL_DIR"
          else
            echo "❌ No setup script found in KernelSU!"
            ls -la "$KSU_SRC"
            exit 1
          fi
          
          # التحقق من التطبيق
          if [ -f "$KERNEL_DIR/drivers/kernelsu/su.c" ] || [ -d "$KERNEL_DIR/drivers/kernelsu" ]; then
            echo "✅ KernelSU applied successfully!"
            echo "version=$KSU_VERSION" >> $GITHUB_OUTPUT
          else
            echo "⚠️ KernelSU files not found, but continuing..."
          fi
          
          # تنظيف الملفات المؤقتة
          rm -rf "$KSU_TEMP"
          
          echo "KernelSU setup completed!"
      
      # ========================================
      # 6. تنظيف البناء إذا مطلوب
      # ========================================
      - name: Clean previous build
        if: ${{ inputs.clean_build == true }}
        run: |
          echo "🧹 Cleaning previous build..."
          
          # تنظيف المخرجات القديمة
          rm -rf "${{ env.OUT_DIR }}"
          
          # تنظيف مصادر النواة
          make clean 2>/dev/null || true
          make mrproper 2>/dev/null || true
          
          echo "✅ Clean completed"
      
      # ========================================
      # 7. تحرير مساحة القرص
      # ========================================
      - name: Free disk space
        run: |
          echo "💾 Freeing up disk space..."
          df -h
          
          # إزالة حزم غير ضرورية
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          
          # تنظيف ذاكرة التخزين المؤقت
          sudo rm -rf /var/lib/apt/lists/*
          
          df -h
      
      # ========================================
      # 8. توليد ملف التكوين
      # ========================================
      - name: Generate kernel config
        id: config
        run: |
          echo "⚙️ Generating kernel configuration..."
          
          cd "${{ env.KERNEL_DIR }}"
          
          # إنشاء مجلد المخرجات
          mkdir -p "${{ env.OUT_DIR }}"
          
          # توليد defconfig
          make O="${{ env.OUT_DIR }}" \
               ARCH="${{ env.ARCH }}" \
               "${{ env.CONFIG }}"
          
          if [ $? -eq 0 ]; then
            echo "✅ Config generated successfully"
            
            # نسخ ملف التكوين للتحقق
            if [ -f "${{ env.OUT_DIR }}/.config" ]; then
              echo "📋 Config summary:"
              grep -E "CONFIG_KSU=|CONFIG_MODULES=|CONFIG_LOCALVERSION=" "${{ env.OUT_DIR }}/.config" || true
            fi
          else
            echo "❌ Config generation failed!"
            exit 1
          fi
      
      # ========================================
      # 9. بناء النواة
      # ========================================
      - name: Build kernel
        id: build
        run: |
          echo "🔨 Building kernel..."
          
          cd "${{ env.KERNEL_DIR }}"
          
          START_TIME=$(date +%s)
          
          # تحديد عدد الوظائف المتوازية
          CORES=$(nproc)
          JOBS=$((CORES * 2))
          [ $JOBS -gt 32 ] && JOBS=32
          
          echo "🖥️ Using $JOBS parallel jobs on $CORES cores"
          
          # بناء النواة
          make -j$JOBS \
            O="${{ env.OUT_DIR }}" \
            ARCH="${{ env.ARCH }}" \
            CC="ccache clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee "${{ env.KERNEL_DIR }}/build.log"
          
          BUILD_EXIT=$?
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          
          # تسجيل وقت البناء
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "build_exit=$BUILD_EXIT" >> $GITHUB_OUTPUT
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ Build failed after ${BUILD_TIME}s!"
            
            # عرض آخر 50 سطر من السجلات للتصحيح
            echo "📋 Last 50 lines of build log:"
            tail -n 50 "${{ env.KERNEL_DIR }}/build.log"
            
            exit 1
          fi
          
          echo "✅ Build completed in ${BUILD_TIME}s"
      
      # ========================================
      # 10. التحقق من المخرجات
      # ========================================
      - name: Verify build outputs
        id: verify
        run: |
          echo "🔍 Verifying build outputs..."
          
          # مسارات الملفات
          KERNEL_IMAGE="${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz"
          DTBO_IMAGE="${{ env.OUT_DIR }}/arch/arm64/boot/dtbo.img"
          
          # التحقق من وجود صورة النواة
          if [ -f "$KERNEL_IMAGE" ]; then
            KERNEL_SIZE=$(du -h "$KERNEL_IMAGE" | cut -f1)
            echo "✅ Kernel image: $KERNEL_SIZE"
            echo "kernel_size=$KERNEL_SIZE" >> $GITHUB_OUTPUT
            echo "kernel_path=$KERNEL_IMAGE" >> $GITHUB_OUTPUT
          else
            echo "❌ Kernel image not found!"
            ls -la "${{ env.OUT_DIR }}/arch/arm64/boot/" || true
            exit 1
          fi
          
          # التحقق من DTBO (اختياري)
          if [ -f "$DTBO_IMAGE" ]; then
            DTBO_SIZE=$(du -h "$DTBO_IMAGE" | cut -f1)
            echo "✅ DTBO image: $DTBO_SIZE"
            echo "dtbo_size=$DTBO_SIZE" >> $GITHUB_OUTPUT
            echo "dtbo_path=$DTBO_IMAGE" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ DTBO image not found (may be normal for some kernels)"
          fi
          
          # التحقق من KernelSU في الناتج
          if [ "${{ inputs.kernelsu_version }}" != "none" ]; then
            echo "🔎 Checking KernelSU in built kernel..."
            strings "$KERNEL_IMAGE" | grep -i "kernelsu\|KSU" | head -5 || echo "No KernelSU strings found (may be normal)"
          fi
      
      # ========================================
      # 11. إنشاء حزمة AnyKernel
      # ========================================
      - name: Create AnyKernel package
        id: package
        run: |
          echo "📦 Creating AnyKernel package..."
          
          # إعدادات
          ZIP_NAME="${{ env.KERNEL_NAME }}-$(date +%Y%m%d-%H%M).zip"
          ANYKERNEL_DIR="/tmp/anykernel3"
          
          # تنظيف أي نسخ سابقة
          rm -rf "$ANYKERNEL_DIR"
          
          # Clone AnyKernel3
          echo "⬇️ Cloning AnyKernel3..."
          git clone --depth=1 \
            https://github.com/Joker-V2/AnyKernel3.git \
            -b sixteen \
            "$ANYKERNEL_DIR"
          
          # نسخ ملفات النواة
          echo "📂 Copying kernel files..."
          cp "${{ steps.verify.outputs.kernel_path }}" "$ANYKERNEL_DIR/Image.gz"
          
          if [ -n "${{ steps.verify.outputs.dtbo_path }}" ]; then
            cp "${{ steps.verify.outputs.dtbo_path }}" "$ANYKERNEL_DIR/dtbo.img"
          fi
          
          # تعديل ملف anykernel.sh إذا لزم
          echo "✏️ Updating anykernel.sh..."
          sed -i "s/kernel.string=.*/kernel.string=${{ env.KERNEL_NAME }}-$(date +%Y%m%d)/g" \
            "$ANYKERNEL_DIR/anykernel.sh"
          
          # إنشاء ملف ZIP
          echo "🗜️ Creating ZIP file..."
          cd "$ANYKERNEL_DIR"
          zip -r9 "$ZIP_NAME" ./*
          
          # نقل الملف النهائي
          FINAL_ZIP="$HOME/$ZIP_NAME"
          mv "$ZIP_NAME" "$FINAL_ZIP"
          
          # توليد MD5 checksum
          md5sum "$FINAL_ZIP" > "$FINAL_ZIP.md5"
          
          # إخراج المعلومات
          ZIP_SIZE=$(du -h "$FINAL_ZIP" | cut -f1)
          ZIP_MD5=$(cat "$FINAL_ZIP.md5" | cut -d' ' -f1)
          
          echo "zip_path=$FINAL_ZIP" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
          echo "zip_md5=$ZIP_MD5" >> $GITHUB_OUTPUT
          
          echo "✅ Package created: $ZIP_NAME ($ZIP_SIZE)"
          echo "📝 MD5: $ZIP_MD5"
          
          # تنظيف
          rm -rf "$ANYKERNEL_DIR"
      
      # ========================================
      # 12. رفع المخرجات
      # ========================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-$(date +%Y%m%d-%H%M)
          path: |
            ${{ steps.verify.outputs.kernel_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.md5
            ${{ env.KERNEL_DIR }}/build.log
          retention-days: 30
          compression-level: 0
      
      - name: Upload DTBO if exists
        if: steps.verify.outputs.dtbo_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-$(date +%Y%m%d-%H%M)
          path: ${{ steps.verify.outputs.dtbo_path }}
          retention-days: 30
      
      # ========================================
      # 13. إنشاء Release
      # ========================================
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-$(date +%Y%m%d-%H%M)
          name: "${{ env.KERNEL_NAME }} - $(date +'%Y-%m-%d %H:%M')"
          body: |
            # 🎉 Kernel Build Successful
            
            ## 📊 Build Information
            
            | Parameter | Value |
            |-----------|-------|
            | **Kernel** | ${{ env.KERNEL_NAME }} |
            | **KernelSU** | ${{ inputs.kernelsu_version }} |
            | **Clang** | ${{ inputs.clang_version }} |
            | **Clean Build** | ${{ inputs.clean_build }} |
            | **Build Time** | ${{ steps.build.outputs.build_time }}s |
            
            ## 📦 Files
            
            | File | Size | MD5 |
            |------|------|-----|
            | **${{ steps.package.outputs.zip_name }}** | ${{ steps.package.outputs.zip_size }} | `${{ steps.package.outputs.zip_md5 }}` |
            | **Kernel Image** | ${{ steps.verify.outputs.kernel_size }} | - |
            
            ## 🚀 Installation
            
            1. Download the flashable ZIP
            2. Boot to custom recovery (TWRP/OrangeFox)
            3. Flash the ZIP file
            4. Wipe cache/dalvik
            5. Reboot
            
            ## ⚠️ Notes
            
            - Unlocked bootloader required
            - Backup your data before flashing
            - Report issues in the repository
            
            ---
            
            *Built with GitHub Actions • $(date)*
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.md5
          draft: false
          prerelease: ${{ inputs.kernelsu_version == 'dev' }}
      
      # ========================================
      # 14. عرض ملخص البناء
      # ========================================
      - name: Generate build summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
            ## ✅ Build Successful! 🎉
            
            ### 🔧 Configuration
            | Parameter | Value |
            |-----------|-------|
            | Kernel | `${{ env.KERNEL_NAME }}` |
            | KernelSU | `${{ inputs.kernelsu_version }}` |
            | Clang | `${{ inputs.clang_version }}` |
            | Clean Build | `${{ inputs.clean_build }}` |
            | Build Time | `${{ steps.build.outputs.build_time }}s` |
            
            ### 📦 Output Files
            | File | Size |
            |------|------|
            | Flashable ZIP | `${{ steps.package.outputs.zip_size }}` |
            | Kernel Image | `${{ steps.verify.outputs.kernel_size }}` |
            
            ### 📥 Download
            - **Artifacts**: Check the Artifacts section above
            - **Release**: Check Releases page for tagged builds
            
            ### 🔗 Links
            - [KernelSU Documentation](https://kernelsu-next.github.io/webpage/)
            - [Source Code](https://github.com/${{ github.repository }})
            EOF
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
            ## ❌ Build Failed
            
            ### 🔍 Debug Information
            Check the build logs above for error details.
            
            ### 💡 Common Solutions
            1. Check if toolchain downloaded correctly
            2. Verify KernelSU version is available
            3. Ensure kernel config is valid
            4. Try with clean_build enabled
            
            ### 📞 Need Help?
            - Check the build.log in artifacts
            - Review kernel source code
            - Open an issue in the repository
            EOF
          fi
      
      # ========================================
      # 15. إحصائيات نهائية
      # ========================================
      - name: Show final statistics
        if: always()
        run: |
          echo "📊 Final Statistics"
          echo "=================="
          echo "Job Status: ${{ job.status }}"
          echo "Build Time: ${{ steps.build.outputs.build_time || 'N/A' }}s"
          echo "Kernel Size: ${{ steps.verify.outputs.kernel_size || 'N/A' }}"
          echo "ZIP Size: ${{ steps.package.outputs.zip_size || 'N/A' }}"
          echo ""
          echo "🔧 ccache statistics:"
          ccache -s
          echo ""
          echo "💾 Disk usage:"
          df -h
