name: Build Kernel (violet | Proton | KSU Next v1.1.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -------------------------------------------------
      # 1) Checkout kernel source (from this repo)
      # -------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2) Install dependencies
      # -------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex libssl-dev \
            make ccache curl zip unzip \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            openjdk-11-jre

      # -------------------------------------------------
      # 3) Clone Proton Clang (locked)
      # -------------------------------------------------
      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      # -------------------------------------------------
      # 4) Setup build environment
      # -------------------------------------------------
      - name: Setup environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      # -------------------------------------------------
      # 5) Apply KernelSU Next v1.1.1 (HARD LOCKED)
      # -------------------------------------------------
      - name: Apply KernelSU Next v1.1.1
        run: |
          git clone --depth=1 --branch v1.1.1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git
          bash KernelSU-Next/kernel/setup.sh

      # -------------------------------------------------
      # 6) Load defconfig (already modified by you)
      # -------------------------------------------------
      - name: Load defconfig
        run: |
          make O=out vendor/violet-perf_defconfig
          make O=out olddefconfig

      # -------------------------------------------------
      # 7) Build kernel (with log)
      # -------------------------------------------------
      - name: Build kernel
        run: |
          make O=out -j$(nproc) 2>&1 | tee build.log

      # -------------------------------------------------
      # 8) Prepare AnyKernel3
      # -------------------------------------------------
      - name: Clone AnyKernel3
        run: |
          git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git anykernel

      - name: Copy kernel images
        run: |
          cp out/arch/arm64/boot/Image.gz anykernel/
          cp out/arch/arm64/boot/dtbo.img anykernel/

      - name: Package AnyKernel3
        run: |
          cd anykernel
          zip -r ../violet-KSU-Next-v1.1.1.zip *

      # -------------------------------------------------
      # 9) Download and use zipsigner
      # -------------------------------------------------
      - name: Download zipsigner
        run: |
          curl -L -o zipsigner.jar \
          https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

      - name: Sign ZIP
        run: |
          java -jar zipsigner.jar \
            violet-KSU-Next-v1.1.1.zip \
            violet-KSU-Next-v1.1.1-signed.zip

      # -------------------------------------------------
      # 10) Generate Build Summary
      # -------------------------------------------------
      - name: Build summary
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Device:** Xiaomi Violet" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU:** Next v1.1.1 (LOCKED)" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler:** Proton Clang" >> $GITHUB_STEP_SUMMARY
          echo "- **Hook mode:** Kprobes" >> $GITHUB_STEP_SUMMARY
          echo "- **SUSFS:** Enabled" >> $GITHUB_STEP_SUMMARY
          echo "- **Output:** Signed flashable ZIP" >> $GITHUB_STEP_SUMMARY

      # -------------------------------------------------
      # 11) Upload artifacts
      # -------------------------------------------------
      - name: Upload signed ZIP
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel-signed
          path: violet-KSU-Next-v1.1.1-signed.zip

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload final config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: out/.config
