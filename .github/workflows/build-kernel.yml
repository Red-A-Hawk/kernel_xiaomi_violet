name: Build Kernel with KernelSU Next

on:
  push:
    branches: [ "sixteen", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'README'
  pull_request:
    branches: [ "sixteen" ]
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU Next Version'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - dev
          - stable
          - legacy
          - v1.1.1
          - v1.1.0
          - v1.0.0
          - none
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    env:
      KERNELSU_VERSION: ${{ github.event.inputs.kernelsu_version || 'latest' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'false' }}
    
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      
      - name: Setup build environment
        run: |
          echo "::group::Setting up build environment"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip bc cpio rsync wget \
            ccache lz4 liblz4-tool openjdk-11-jdk
          echo "::endgroup::"
          
          echo "::group::Setting up ccache"
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache -M 2G
          ccache -z
          echo "::endgroup::"
      
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      
      - name: Get kernel info
        id: info
        run: |
          echo "::group::Getting kernel information"
          
          # Kernel version
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo "4.14")
          echo "version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Kernel Version: $KERNEL_VERSION"
          
          # Build date
          BUILD_DATE=$(date +"%d%m%Y-%H%M")
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Build Date: $BUILD_DATE"
          
          # KernelSU suffix
          if [ "${{ env.KERNELSU_VERSION }}" != "none" ]; then
            echo "ksu_suffix=-KSU" >> $GITHUB_OUTPUT
            echo "KernelSU: Enabled (${{ env.KERNELSU_VERSION }})"
          else
            echo "ksu_suffix=" >> $GITHUB_OUTPUT
            echo "KernelSU: Disabled"
          fi
          
          # Commit info
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log --oneline -1 --pretty=format:"%s")
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT_HASH - $COMMIT_MSG"
          
          echo "::endgroup::"
      
      - name: Free up disk space
        run: |
          echo "::group::Freeing up disk space"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h
          echo "::endgroup::"
      
      - name: Build kernel
        id: build
        run: |
          echo "::group::Building kernel"
          
          # Make script executable
          chmod +x build.py
          
          # Prepare build arguments
          BUILD_ARGS="--kernelsu ${{ env.KERNELSU_VERSION }}"
          
          if [ "${{ env.CLEAN_BUILD }}" == "true" ]; then
            BUILD_ARGS="$BUILD_ARGS --clean"
          fi
          
          echo "Build command: python3 build.py $BUILD_ARGS"
          echo "Starting build at $(date)"
          
          # Run build
          python3 build.py $BUILD_ARGS
          
          BUILD_EXIT=$?
          echo "Build finished at $(date) with exit code: $BUILD_EXIT"
          
          echo "::endgroup::"
          
          # Check build result
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit 1
          fi
          
          # Verify kernel image
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            SIZE=$(du -h out/arch/arm64/boot/Image.gz | cut -f1)
            echo "kernel_size=$SIZE" >> $GITHUB_OUTPUT
            echo "✓ Kernel Image: Image.gz ($SIZE)"
          else
            echo "::error::Kernel image not found!"
            exit 1
          fi
          
          # Verify DTBO
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            DTBO_SIZE=$(du -h out/arch/arm64/boot/dtbo.img | cut -f1)
            echo "dtbo_size=$DTBO_SIZE" >> $GITHUB_OUTPUT
            echo "✓ DTBO: dtbo.img ($DTBO_SIZE)"
          fi
      
      - name: Find flashable zip
        id: zip
        run: |
          echo "::group::Finding flashable zip"
          
          # Find signed zip
          SIGNED_ZIP=$(find $HOME -name "*-signed.zip" -type f -print -quit)
          
          if [ -z "$SIGNED_ZIP" ]; then
            echo "Signed zip not found, looking for unsigned..."
            SIGNED_ZIP=$(find $HOME -name "xcalibur*.zip" -type f -print -quit)
          fi
          
          if [ -n "$SIGNED_ZIP" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$SIGNED_ZIP" >> $GITHUB_OUTPUT
            
            ZIP_NAME=$(basename "$SIGNED_ZIP")
            echo "name=$ZIP_NAME" >> $GITHUB_OUTPUT
            
            SIZE=$(du -h "$SIGNED_ZIP" | cut -f1)
            echo "size=$SIZE" >> $GITHUB_OUTPUT
            
            MD5=$(md5sum "$SIGNED_ZIP" | cut -d' ' -f1)
            echo "md5=$MD5" >> $GITHUB_OUTPUT
            
            echo "✓ Found: $ZIP_NAME"
            echo "  Size: $SIZE"
            echo "  MD5: $MD5"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::No flashable zip found!"
          fi
          
          echo "::endgroup::"
      
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ steps.info.outputs.date }}
          path: out/arch/arm64/boot/Image.gz
          retention-days: 30
          compression-level: 9
      
      - name: Upload DTBO
        if: hashFiles('out/arch/arm64/boot/dtbo.img') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-${{ steps.info.outputs.date }}
          path: out/arch/arm64/boot/dtbo.img
          retention-days: 30
          compression-level: 9
      
      - name: Upload flashable zip
        if: steps.zip.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flashable-zip-${{ steps.info.outputs.date }}
          path: ${{ steps.zip.outputs.path }}
          retention-days: 30
          compression-level: 0
      
      - name: Create Release
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.zip.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ steps.info.outputs.date }}
          name: Violet Kernel ${{ steps.info.outputs.ksu_suffix }} - ${{ steps.info.outputs.date }}
          body: |
            # 🎉 Violet Kernel Build
            
            ## 📊 Build Information
            
            | Parameter | Value |
            |-----------|-------|
            | **Kernel Version** | `${{ steps.info.outputs.version }}` |
            | **Build Date** | `${{ steps.info.outputs.date }}` |
            | **KernelSU Next** | `${{ env.KERNELSU_VERSION }}` |
            | **Compiler** | `ZyC Clang 22.0.0` |
            | **Clean Build** | `${{ env.CLEAN_BUILD }}` |
            | **Commit** | `${{ steps.info.outputs.commit_hash }}` |
            
            ## 📦 Files
            
            | File | Size | MD5 |
            |------|------|-----|
            | **${{ steps.zip.outputs.name }}** | `${{ steps.zip.outputs.size }}` | `${{ steps.zip.outputs.md5 }}` |
            | **Image.gz** | `${{ steps.build.outputs.kernel_size }}` | - |
            | **dtbo.img** | `${{ steps.build.outputs.dtbo_size }}` | - |
            
            ## 📱 Installation
            
            ### Requirements
            - ✅ **Unlocked Bootloader**
            - ✅ **Custom Recovery** (TWRP recommended)
            - ✅ **Backup** of current boot.img
            
            ### Steps
            1. Download `${{ steps.zip.outputs.name }}`
            2. Boot to TWRP Recovery
            3. Flash the zip file
            4. Wipe Cache/Dalvik
            5. Reboot
            6. **(If KernelSU)** Install [KernelSU Next Manager](https://github.com/KernelSU-Next/KernelSU-Next/releases)
            
            ## ⚙️ Features
            
            ${{ env.KERNELSU_VERSION != 'none' && '### ✅ KernelSU Next Enabled
            - Root access with KernelSU Next
            - Module support
            - Advanced security features
            - Better app compatibility
            - Version: ' || '### ❌ KernelSU Not Included
            - This is a vanilla kernel build
            - No root functionality
            - Stock kernel features only
            ' }}${{ env.KERNELSU_VERSION }}
            
            ## 📋 Compatibility
            
            - **Device:** Redmi Note 7 Pro (Violet)
            - **Android:** 15.0 - 16.0
            - **Variant:** Retrofit Dynamic
            
            ## ⚠️ Important Notes
            
            - Always backup before flashing
            - Warranty may be void after unlocking bootloader
            - Report issues in [Issues](../../issues) section
            - Join XDA discussion for support
            
            ## 🔗 Links
            
            - [KernelSU Next Docs](https://kernelsu-next.github.io/webpage/)
            - [KernelSU Next Releases](https://github.com/KernelSU-Next/KernelSU-Next/releases)
            - [Source Code](../../tree/${{ steps.info.outputs.commit_hash }})
            
            ## 📝 Changelog
            
            ```
            ${{ steps.info.outputs.commit_msg }}
            ```
            
            ---
            
            **Built with ❤️ by Red-A-Hawk**
            
            *Powered by GitHub Actions • Based on xcalibur kernel*
          files: |
            ${{ steps.zip.outputs.path }}
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          draft: false
          prerelease: ${{ env.KERNELSU_VERSION == 'dev' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate build summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Build Successful! 🎉
          
          ### 🔧 Configuration
          | Parameter | Value |
          |-----------|-------|
          | Kernel Version | `${{ steps.info.outputs.version }}` |
          | Build Date | `${{ steps.info.outputs.date }}` |
          | KernelSU Next | `${{ env.KERNELSU_VERSION }}` |
          | Clean Build | `${{ env.CLEAN_BUILD }}` |
          | Commit | `${{ steps.info.outputs.commit_hash }}` |
          
          ### 📦 Output Files
          | File | Size |
          |------|------|
          | Flashable ZIP | `${{ steps.zip.outputs.size }}` |
          | Kernel Image | `${{ steps.build.outputs.kernel_size }}` |
          | DTBO | `${{ steps.build.outputs.dtbo_size }}` |
          
          ### 📥 Download
          - Check **Artifacts** section above to download
          - Or check **Releases** page for permanent links
          
          ### 🚀 Installation
          1. Download the flashable ZIP
          2. Boot to TWRP Recovery
          3. Flash the ZIP file
          4. Wipe Cache/Dalvik
          5. Reboot and enjoy!
          
          ### 📊 Build Details
          - **Workflow:** `${{ github.workflow }}`
          - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Actor:** @${{ github.actor }}
          - **Event:** `${{ github.event_name }}`
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ❌ Build Failed
          
          ### 📋 Debug Information
          Please check the logs above for detailed error messages.
          
          ### 🔍 Common Issues
          1. **Toolchain errors** - Verify ZyC Clang download
          2. **KernelSU setup failed** - Check network connectivity  
          3. **Compilation errors** - Review kernel source code
          4. **Out of memory** - Try with clean build enabled
          
          ### 💡 Next Steps
          - Review error.log in artifacts (if available)
          - Try running with `clean_build: true`
          - Check if defconfig is correct
          - Verify all dependencies are installed
          
          ### 📞 Get Help
          - Open an [Issue](../../issues/new)
          - Check [closed issues](../../issues?q=is%3Aissue+is%3Aclosed)
          - Join XDA discussion thread
          EOF
          fi
      
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.info.outputs.date }}
          path: |
            error.log
            out/.config
            /tmp/*.sh
          retention-days: 7
          if-no-files-found: warn
      
      - name: Show ccache statistics
        if: always()
        run: |
          echo "::group::ccache statistics"
          ccache -s
          echo "::endgroup::"
