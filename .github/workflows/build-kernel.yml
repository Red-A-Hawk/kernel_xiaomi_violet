name: Build Kernel (violet | Proton Clang | KernelSU Next)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make ccache curl zip unzip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi \
          openjdk-11-jre

    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup toolchain env
      run: |
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # =========================
    # KernelSU Next + PATCHES
    # =========================
    - name: Setup KernelSU Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    - name: Apply KernelSU patches (non-GKI)
      run: |
        git clone https://github.com/jonjeexe/KernelSU_Patches.git ksu_patches
        cd ksu_patches
        bash Patch.sh
        cd ..

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    - name: Enable KernelSU + SUSFS
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -e CONFIG_SUSFS \
          -e CONFIG_SUSFS_SUS_PATH \
          -e CONFIG_SUSFS_SUS_MOUNT \
          -e CONFIG_SUSFS_SUS_KSTAT \
          -e CONFIG_SUSFS_SUS_MAPS
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    # =========================
    # AnyKernel3
    # =========================
    - name: Prepare AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/

    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../kernel-violet.zip *

    # =========================
    # ZIP SIGNING
    # =========================
    - name: Sign zip
      run: |
        curl -Lo zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar kernel-violet.zip kernel-violet-signed.zip

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-signed
        path: kernel-violet-signed.zip
