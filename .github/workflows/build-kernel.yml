name: Build Kernel (violet | KernelSU Next + SUSFS)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make ccache curl zip unzip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi

    - name: Verify toolchain
      run: |
        which aarch64-linux-gnu-gcc
        which aarch64-linux-gnu-ld
        which arm-linux-gnueabi-gcc
        which arm-linux-gnueabi-ld

    - name: Download Proton Clang 17
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup toolchain env
      run: |
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:/usr/bin:$PATH" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    - name: Setup KernelSU Next (official)
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu
        echo "KernelSU commit:"
        cd ksu && git rev-parse --short HEAD && cd ..

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    - name: Build scripts
      run: |
        make O=out scripts

    - name: Enable KernelSU + SUSFS
      run: |
        # KernelSU
        sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' out/.config
        sed -i 's/# CONFIG_KSU_DEBUG is not set/CONFIG_KSU_DEBUG=n/' out/.config

        # SUSFS
        sed -i 's/# CONFIG_SUSFS is not set/CONFIG_SUSFS=y/' out/.config
        sed -i 's/# CONFIG_SUSFS_SUS_PATH is not set/CONFIG_SUSFS_SUS_PATH=y/' out/.config
        sed -i 's/# CONFIG_SUSFS_SUS_MOUNT is not set/CONFIG_SUSFS_SUS_MOUNT=y/' out/.config
        sed -i 's/# CONFIG_SUSFS_SUS_KSTAT is not set/CONFIG_SUSFS_SUS_KSTAT=y/' out/.config
        sed -i 's/# CONFIG_SUSFS_SUS_MAPS is not set/CONFIG_SUSFS_SUS_MAPS=y/' out/.config

        make O=out olddefconfig

    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image
        path: out/arch/arm64/boot/Image
