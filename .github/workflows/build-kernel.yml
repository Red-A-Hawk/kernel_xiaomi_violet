name: Test Build KernelSU + SUSFS (violet)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: vendor/violet-perf_defconfig

    steps:
    # =========================
    # Checkout
    # =========================
    - name: Checkout kernel source
      uses: actions/checkout@v4

    # =========================
    # Dependencies
    # =========================
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make curl zip unzip \
          python3 openjdk-11-jre \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    # =========================
    # Clang 17 (Proton)
    # =========================
    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: Setup toolchain env
      run: |
        echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # =========================
    # KernelSU Next (with SUSFS)
    # =========================
    - name: Setup KernelSU Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    # =========================
    # Defconfig
    # =========================
    - name: Load defconfig
      run: |
        make $DEFCONFIG

    # =========================
    # Build scripts (IMPORTANT)
    # =========================
    - name: Build kernel scripts
      run: |
        make scripts

    # =========================
    # Enable KernelSU + SUSFS
    # =========================
    - name: Enable KSU + SUSFS configs
      run: |
        scripts/config --enable CONFIG_KSU
        scripts/config --enable CONFIG_SUSFS
        scripts/config --enable CONFIG_KSU_SUSFS
        scripts/config --enable CONFIG_SUSFS_HIDE_KSU
        scripts/config --enable CONFIG_SUSFS_SPOOF_UNAME
        scripts/config --enable CONFIG_SUSFS_SPOOF_CMDLINE
        scripts/config --enable CONFIG_SUSFS_SPOOF_RELEASE
        make olddefconfig

    # =========================
    # Build kernel (TEST)
    # =========================
    - name: Build kernel
      run: |
        make -j$(nproc)
