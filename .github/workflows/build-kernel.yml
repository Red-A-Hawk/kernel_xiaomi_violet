name: Build Kernel with KernelSU Next

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU Next Version'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - dev
          - stable
          - legacy
          - v1.1.1
          - v1.1.0
          - v1.0.0
          - none
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    env:
      KERNELSU_VERSION: ${{ github.event.inputs.kernelsu_version || 'latest' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean_build || 'false' }}
    
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      
      - name: Setup build environment
        run: |
          echo "::group::Setting up build environment"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip bc cpio rsync wget \
            ccache lz4 liblz4-tool openjdk-11-jdk
          echo "::endgroup::"
          
          echo "::group::Setting up ccache"
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache -M 2G
          ccache -z
          echo "::endgroup::"
      
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      
      # ========================================
      # 🔧 هذا هو الجزء الذي يحتاج إصلاح فقط!
      # ========================================
      - name: Install ZyC Clang (FIXED)
        id: install-clang
        run: |
          echo "::group::Installing ZyC Clang"
          
          # إنشاء مجلد للتولشين
          CLANG_DIR="$HOME/clang"
          mkdir -p "$CLANG_DIR"
          
          # الرابط الصحيح والمؤكد
          CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz"
          
          echo "Downloading ZyC Clang from:"
          echo "$CLANG_URL"
          
          # تحميل
          cd /tmp
          wget -q "$CLANG_URL" -O clang.tar.gz
          
          # استخراج
          echo "Extracting..."
          tar -xzf clang.tar.gz
          
          # 🔍 البحث عن clang في الملفات المستخرجة
          echo "Looking for clang binary..."
          
          # ابحث في المجلد المستخرج
          EXTRACTED_DIR=$(ls -d /tmp/Clang* 2>/dev/null | head -1)
          
          if [ -n "$EXTRACTED_DIR" ] && [ -d "$EXTRACTED_DIR" ]; then
            echo "Found extracted directory: $EXTRACTED_DIR"
            
            # ابحث عن ملف clang
            CLANG_BIN=$(find "$EXTRACTED_DIR" -name "clang" -type f | head -1)
            
            if [ -n "$CLANG_BIN" ]; then
              echo "Found clang at: $CLANG_BIN"
              
              # نسخ كل المحتويات
              cp -r "$EXTRACTED_DIR"/* "$CLANG_DIR"/
              
              # إنشاء bin إذا لم يكن موجوداً
              mkdir -p "$CLANG_DIR/bin"
              
              # نسخ clang إلى bin/
              if [ ! -f "$CLANG_DIR/bin/clang" ]; then
                cp "$CLANG_BIN" "$CLANG_DIR/bin/"
              fi
              
              # إضافة إلى PATH
              echo "$CLANG_DIR/bin" >> $GITHUB_PATH
              
              echo "✅ Clang installed successfully!"
              echo "Path: $CLANG_DIR/bin"
              
              # اختبار
              echo "Clang version:"
              "$CLANG_DIR/bin/clang" --version | head -3
              
            else
              echo "❌ clang binary not found in extracted files!"
              exit 1
            fi
          else
            echo "❌ Extraction failed or directory not found!"
            exit 1
          fi
          
          # تنظيف
          rm -f /tmp/clang.tar.gz
          rm -rf /tmp/Clang*
          
          echo "::endgroup::"
      
      # ========================================
      # باقي الخطوات تبقى كما هي!
      # ========================================
      - name: Get kernel info
        id: info
        run: |
          echo "::group::Getting kernel information"
          
          # Kernel version
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo "4.14")
          echo "version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Kernel Version: $KERNEL_VERSION"
          
          # Build date
          BUILD_DATE=$(date +"%d%m%Y-%H%M")
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Build Date: $BUILD_DATE"
          
          # KernelSU suffix
          if [ "${{ env.KERNELSU_VERSION }}" != "none" ]; then
            echo "ksu_suffix=-KSU" >> $GITHUB_OUTPUT
            echo "KernelSU: Enabled (${{ env.KERNELSU_VERSION }})"
          else
            echo "ksu_suffix=" >> $GITHUB_OUTPUT
            echo "KernelSU: Disabled"
          fi
          
          # Commit info
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log --oneline -1 --pretty=format:"%s")
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT_HASH - $COMMIT_MSG"
          
          echo "::endgroup::"
      
      - name: Free up disk space
        run: |
          echo "::group::Freeing up disk space"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h
          echo "::endgroup::"
      
      - name: Build kernel
        id: build
        run: |
          echo "::group::Building kernel"
          
          # تحقق من وجود build.py
          if [ -f "build.py" ]; then
            echo "Using build.py script"
            chmod +x build.py
            
            # إعداد arguments
            BUILD_ARGS="--kernelsu ${{ env.KERNELSU_VERSION }}"
            
            if [ "${{ env.CLEAN_BUILD }}" == "true" ]; then
              BUILD_ARGS="$BUILD_ARGS --clean"
            fi
            
            echo "Build command: python3 build.py $BUILD_ARGS"
            python3 build.py $BUILD_ARGS
            
          else
            echo "build.py not found, building directly..."
            
            # تنظيف إذا مطلوب
            if [ "${{ env.CLEAN_BUILD }}" == "true" ]; then
              make clean
              make mrproper
              rm -rf out
            fi
            
            # إنشاء مجلد out
            mkdir -p out
            
            # توليد config
            make O=out ARCH=arm64 vendor/violet-perf_defconfig
            
            # بناء النواة
            make -j$(nproc) \
              O=out \
              ARCH=arm64 \
              CC="ccache clang" \
              CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="aarch64-linux-gnu-" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
              LLVM=1 \
              LLVM_IAS=1
          fi
          
          BUILD_EXIT=$?
          echo "Build finished with exit code: $BUILD_EXIT"
          
          echo "::endgroup::"
          
          # Check build result
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit 1
          fi
          
          # Verify kernel image
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            SIZE=$(du -h out/arch/arm64/boot/Image.gz | cut -f1)
            echo "kernel_size=$SIZE" >> $GITHUB_OUTPUT
            echo "✓ Kernel Image: Image.gz ($SIZE)"
          else
            echo "::error::Kernel image not found!"
            exit 1
          fi
      
      # باقي الخطوات تبقى كما هي...
      - name: Find flashable zip
        id: zip
        run: |
          echo "::group::Finding flashable zip"
          
          # Find signed zip
          SIGNED_ZIP=$(find $HOME -name "*-signed.zip" -type f -print -quit)
          
          if [ -z "$SIGNED_ZIP" ]; then
            echo "Signed zip not found, looking for unsigned..."
            SIGNED_ZIP=$(find $HOME -name "xcalibur*.zip" -type f -print -quit)
          fi
          
          if [ -n "$SIGNED_ZIP" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$SIGNED_ZIP" >> $GITHUB_OUTPUT
            
            ZIP_NAME=$(basename "$SIGNED_ZIP")
            echo "name=$ZIP_NAME" >> $GITHUB_OUTPUT
            
            SIZE=$(du -h "$SIGNED_ZIP" | cut -f1)
            echo "size=$SIZE" >> $GITHUB_OUTPUT
            
            MD5=$(md5sum "$SIGNED_ZIP" | cut -d' ' -f1)
            echo "md5=$MD5" >> $GITHUB_OUTPUT
            
            echo "✓ Found: $ZIP_NAME"
            echo "  Size: $SIZE"
            echo "  MD5: $MD5"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::No flashable zip found!"
          fi
          
          echo "::endgroup::"
      
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ steps.info.outputs.date }}
          path: out/arch/arm64/boot/Image.gz
          retention-days: 30
      
      - name: Upload flashable zip
        if: steps.zip.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flashable-zip-${{ steps.info.outputs.date }}
          path: ${{ steps.zip.outputs.path }}
          retention-days: 30
      
      - name: Generate build summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            cat > $GITHUB_STEP_SUMMARY << 'EOF'
## ✅ Build Successful!

### Build Information
- **Kernel Version**: ${{ steps.info.outputs.version }}
- **Build Date**: ${{ steps.info.outputs.date }}
- **KernelSU**: ${{ env.KERNELSU_VERSION }}
- **Commit**: ${{ steps.info.outputs.commit_hash }}

### Output Files
- Kernel Image: ${{ steps.build.outputs.kernel_size }}
- Flashable ZIP: ${{ steps.zip.outputs.size }}

### Installation
1. Download the flashable ZIP
2. Boot to TWRP Recovery
3. Flash the ZIP file
4. Wipe Cache/Dalvik
5. Reboot
EOF
          else
            cat > $GITHUB_STEP_SUMMARY << 'EOF'
## ❌ Build Failed

### Debug Information
Please check the logs above for detailed error messages.

### Common Issues
1. Toolchain errors
2. KernelSU setup failed
3. Compilation errors
4. Out of memory

### Next Steps
- Review error.log in artifacts
- Try running with clean_build: true
- Check if defconfig is correct
EOF
          fi
