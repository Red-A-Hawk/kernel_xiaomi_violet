name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU Version'
        required: true
        default: 'v1.1.1'
        type: choice
        options:
          - v1.1.1
          - v1.1.0
          - v1.0.0
          - none
      clean_build:
        description: 'Clean build'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    # ========================================
    # 1. تحميل مصدر النواة
    # ========================================
    - name: Checkout kernel source
      uses: actions/checkout@v4
    
    # ========================================
    # 2. تثبيت المتطلبات الأساسية
    # ========================================
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ccache \
          wget \
          tar \
          xz-utils \
          python3 \
          bc \
          flex \
          bison \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          lz4 \
          lzop
        
        # إعداد ccache
        sudo /usr/sbin/update-ccache-symlinks
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache --max-size=2G
        ccache --zero-stats
    
    # ========================================
    # 3. تحميل وتثبيت Clang
    # ========================================
    - name: Install Clang toolchain
      id: clang
      run: |
        echo "=== Downloading Clang ==="
        
        # تحميل التولشين
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928-linux-x86_64.tar.gz
        
        # استخراج
        echo "Extracting toolchain..."
        tar -xzf Clang-22.0.0git-20250928-linux-x86_64.tar.gz
        
        # اسم المجلد المستخرج
        CLANG_DIR="Clang-22.0.0git-20250928-linux-x86_64"
        
        # التحقق
        if [ -d "$CLANG_DIR" ]; then
          echo "Toolchain directory: $CLANG_DIR"
          
          # إضافة إلى PATH
          CLANG_PATH="$(pwd)/$CLANG_DIR/bin"
          echo "$CLANG_PATH" >> $GITHUB_PATH
          
          # اختبار
          echo "Testing clang..."
          "$CLANG_PATH/clang" --version | head -3
          
          # حفظ المسار للمراحل التالية
          echo "clang_path=$CLANG_PATH" >> $GITHUB_OUTPUT
        else
          echo "ERROR: Toolchain extraction failed!"
          exit 1
        fi
        
        # تنظيف
        rm -f Clang-22.0.0git-20250928-linux-x86_64.tar.gz
        
        echo "=== Clang installation complete ==="
    
    # ========================================
    # 4. تنظيف البناء إذا مطلوب
    # ========================================
    - name: Clean build (optional)
      if: ${{ inputs.clean_build == true }}
      run: |
        echo "Cleaning previous build..."
        make clean 2>/dev/null || true
        make mrproper 2>/dev/null || true
        rm -rf out
    
    # ========================================
    # 5. إعداد KernelSU (إذا مطلوب)
    # ========================================
    - name: Setup KernelSU (optional)
      if: ${{ inputs.kernelsu_version != 'none' }}
      run: |
        echo "=== Setting up KernelSU ${{ inputs.kernelsu_version }} ==="
        
        # إنشاء مجلد مؤقت
        TEMP_DIR=$(mktemp -d)
        cd "$TEMP_DIR"
        
        # تحميل KernelSU
        case "${{ inputs.kernelsu_version }}" in
          v1.1.1|v1.1.0|v1.0.0)
            echo "Downloading version ${{ inputs.kernelsu_version }}..."
            wget -q https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${{ inputs.kernelsu_version }}/KernelSU-${{ inputs.kernelsu_version }}.zip
            unzip -q KernelSU-${{ inputs.kernelsu_version }}.zip
            cd "KernelSU-${{ inputs.kernelsu_version }}"
            ;;
          *)
            echo "Cloning latest version..."
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git
            cd KernelSU-Next
            ;;
        esac
        
        # تطبيق KernelSU
        if [ -f "kernel/setup.sh" ]; then
          cd kernel
          chmod +x setup.sh
          ./setup.sh "$GITHUB_WORKSPACE"
          echo "KernelSU applied successfully"
        else
          echo "WARNING: setup.sh not found"
        fi
        
        # تنظيف
        cd /
        rm -rf "$TEMP_DIR"
    
    # ========================================
    # 6. توليد إعدادات النواة
    # ========================================
    - name: Generate kernel config
      run: |
        echo "=== Generating kernel config ==="
        
        # توليد defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/violet-perf_defconfig
        
        if [ $? -eq 0 ]; then
          echo "Config generated successfully"
        else
          echo "ERROR: Config generation failed"
          exit 1
        fi
    
    # ========================================
    # 7. بناء النواة
    # ========================================
    - name: Build kernel
      id: build
      run: |
        echo "=== Building kernel ==="
        
        # وقت البدء
        START=$(date +%s)
        
        # عدد الوظائف المتوازية
        JOBS=$(nproc)
        echo "Building with $JOBS parallel jobs"
        
        # بناء النواة
        make -j$JOBS \
          ARCH=arm64 \
          CC="ccache clang" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          LLVM=1 \
          LLVM_IAS=1
        
        # وقت الانتهاء
        END=$(date +%s)
        TIME=$((END - START))
        
        echo "Build time: $TIME seconds"
        echo "build_time=$TIME" >> $GITHUB_OUTPUT
        
        if [ $? -eq 0 ]; then
          echo "=== Build successful ==="
        else
          echo "=== Build failed ==="
          exit 1
        fi
    
    # ========================================
    # 8. التحقق من المخرجات
    # ========================================
    - name: Verify outputs
      run: |
        echo "=== Verifying build outputs ==="
        
        # التحقق من وجود صورة النواة
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          SIZE=$(du -h "arch/arm64/boot/Image.gz" | cut -f1)
          echo "✅ Kernel image: $SIZE"
          echo "kernel_size=$SIZE" >> $GITHUB_OUTPUT
        else
          echo "❌ Kernel image not found!"
          exit 1
        fi
        
        # التحقق من DTBO (اختياري)
        if [ -f "arch/arm64/boot/dtbo.img" ]; then
          DTBO_SIZE=$(du -h "arch/arm64/boot/dtbo.img" | cut -f1)
          echo "✅ DTBO image: $DTBO_SIZE"
          echo "dtbo_size=$DTBO_SIZE" >> $GITHUB_OUTPUT
        fi
    
    # ========================================
    # 9. إنشاء حزمة AnyKernel
    # ========================================
    - name: Create AnyKernel package
      run: |
        echo "=== Creating AnyKernel package ==="
        
        # إنشاء مجلد مؤقت
        AK_DIR="/tmp/anykernel"
        rm -rf "$AK_DIR"
        mkdir -p "$AK_DIR"
        
        # Clone AnyKernel3
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git -b sixteen "$AK_DIR"
        
        # نسخ ملفات النواة
        cp arch/arm64/boot/Image.gz "$AK_DIR/"
        
        if [ -f "arch/arm64/boot/dtbo.img" ]; then
          cp arch/arm64/boot/dtbo.img "$AK_DIR/"
        fi
        
        # إنشاء ملف ZIP
        cd "$AK_DIR"
        ZIP_NAME="kernel-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "$ZIP_NAME" ./*
        
        # نقل الملف
        mv "$ZIP_NAME" "$HOME/"
        FINAL_ZIP="$HOME/$ZIP_NAME"
        
        # معلومات الملف
        ZIP_SIZE=$(du -h "$FINAL_ZIP" | cut -f1)
        ZIP_MD5=$(md5sum "$FINAL_ZIP" | cut -d' ' -f1)
        
        echo "✅ Package created: $ZIP_NAME ($ZIP_SIZE)"
        echo "zip_path=$FINAL_ZIP" >> $GITHUB_OUTPUT
        echo "zip_size=$ZIP_SIZE" >> $GITHUB_OUTPUT
        echo "zip_md5=$ZIP_MD5" >> $GITHUB_OUTPUT
        
        # تنظيف
        rm -rf "$AK_DIR"
    
    # ========================================
    # 10. رفع النتائج
    # ========================================
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          arch/arm64/boot/Image.gz
          ${{ env.HOME }}/kernel-*.zip
        retention-days: 7
    
    # ========================================
    # 11. عرض النتائج
    # ========================================
    - name: Show results
      if: always()
      run: |
        echo "=== Build Results ==="
        
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ BUILD SUCCESSFUL"
          echo ""
          echo "Output files:"
          echo "1. Kernel image: arch/arm64/boot/Image.gz"
          echo "2. Flashable ZIP: $HOME/kernel-*.zip"
          echo ""
          echo "Build time: ${{ steps.build.outputs.build_time }} seconds"
        else
          echo "❌ BUILD FAILED"
          echo ""
          echo "Check the logs above for errors"
        fi
