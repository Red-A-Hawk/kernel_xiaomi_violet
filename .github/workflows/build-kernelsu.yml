name: KernelSU Next v1.1.1 + SUSFS (jonjeexe) - violet

on:
  push:
    branches: [ sixteen ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        ref: sixteen

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y git bc bison flex libssl-dev \
        make zip unzip curl wget libelf-dev libncurses5-dev \
        gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

    - name: Setup ZyCromerZ Clang
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    - name: Setup KernelSU Next v1.1.1
      run: |
        git clone -b v1.1.1 https://github.com/KernelSU-Next/KernelSU-Next.git
        bash KernelSU-Next/kernel/setup.sh

    - name: Apply jonjeexe SUSFS patches
      run: |
        git clone -b non-GKI https://github.com/jonjeexe/KernelSU_Patches.git
        bash KernelSU_Patches/Patch.sh

    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out scripts

    - name: Enable KernelSU + SUSFS
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_LSM_SECURITY_HOOKS \
          -e CONFIG_KPROBES \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_KSU_SUSFS_SUS_PATH \
          -e CONFIG_KSU_SUSFS_SUS_MOUNT \
          -e CONFIG_KSU_SUSFS_SUS_KSTAT \
          -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
          -e CONFIG_KSU_SUSFS_OPEN_REDIRECT
        make O=out olddefconfig

    - name: Build kernel
      run: make O=out -j$(nproc)

    - name: Package AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3 && zip -r9 ../kernel.zip *

    - name: Sign zip
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner-3.0-dexed.jar kernel.zip kernel-signed.zip

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-v1.1.1-SUSFS
        path: kernel-signed.zip
