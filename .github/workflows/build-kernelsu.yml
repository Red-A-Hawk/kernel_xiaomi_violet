name: Kernel Diff (sixteen vs sixteen-ksu)

on:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel repo
        run: |
          git clone https://github.com/Red-A-Hawk/kernel_xiaomi_violet.git
          cd kernel_xiaomi_violet
          git fetch origin sixteen sixteen-ksu

      - name: Generate diff report
        run: |
          cd kernel_xiaomi_violet

          mkdir diff-report

          # فرق كامل
          git diff sixteen..sixteen-ksu > diff-report/full.diff

          # ملفات فقط
          git diff --name-status sixteen..sixteen-ksu > diff-report/files.txt

          # فرق خاص بالـ configs
          git diff sixteen..sixteen-ksu -- arch/arm64/configs > diff-report/configs.diff

          # فرق fs و include (غالبًا SUSFS)
          git diff sixteen..sixteen-ksu -- fs include > diff-report/fs-include.diff

          # KernelSU (Kconfig / Makefile)
          git diff sixteen..sixteen-ksu -- Kconfig Makefile > diff-report/kernel-core.diff

          tar -czf kernel-diff-report.tar.gz diff-report

      - name: Upload diff report
        uses: actions/upload-artifact@v4
        with:
          name: kernel-diff-report
          path: kernel_xiaomi_violet/kernel-diff-report.tar.gz
