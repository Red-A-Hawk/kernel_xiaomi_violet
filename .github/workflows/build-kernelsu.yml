name: Build KernelSU Next (violet | sixteen)

on:
  push:
    branches: [ sixteen ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ جلب سورس النواة
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    # 2️⃣ تثبيت المتطلبات
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses5-dev \
          python3 python3-pip \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    # 3️⃣ ZyCromerZ Clang
    - name: Setup ZyCromerZ Clang
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ دمج KernelSU Next (Manual Hook)
    - name: Setup KernelSU Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    # 5️⃣ متغيرات البناء
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 6️⃣ تحميل defconfig الصحيح
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 7️⃣ تفعيل KernelSU + SUSFS (Manual فقط)
    - name: Apply KernelSU & SUSFS config
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -e CONFIG_KSU_LSM_SECURITY_HOOKS \
          -d CONFIG_KPROBES \
          -d CONFIG_KPROBE_EVENTS

        scripts/config --file out/.config \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
          -e CONFIG_KSU_SUSFS_SUS_PATH \
          -e CONFIG_KSU_SUSFS_SUS_MOUNT \
          -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
          -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
          -e CONFIG_KSU_SUSFS_SUS_KSTAT \
          -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
          -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
          -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
          -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS

        make O=out olddefconfig

    # 8️⃣ بناء النواة
    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    # 9️⃣ التحقق من الصور
    - name: Check outputs
      run: |
        test -f out/arch/arm64/boot/Image.gz
        test -f out/arch/arm64/boot/dtbo.img

    # 🔟 AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3
        zip -r9 ../kernel-unsigned.zip *

    # 1️⃣1️⃣ zipsigner
    - name: Sign zip
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner-3.0-dexed.jar kernel-unsigned.zip kernel-signed.zip

    # 1️⃣2️⃣ رفع الناتج
    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-violet
        path: kernel-signed.zip
