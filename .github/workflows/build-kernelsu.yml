name: Build KernelSU Next v1.1.1 (violet | sixteen)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source (sixteen)
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses5-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 python3-pip

    # 3️⃣ ZyCromerZ Clang
    - name: Setup ZyCromerZ Clang 15.0.7
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ defconfig من sixteen-ksu
    - name: Import defconfig from sixteen-ksu
      run: |
        git fetch origin sixteen-ksu
        git show origin/sixteen-ksu:arch/arm64/configs/vendor/violet-perf_defconfig \
          > arch/arm64/configs/vendor/violet-perf_defconfig
        echo "✅ defconfig imported from sixteen-ksu"

    # 5️⃣ KernelSU Next v1.1.1
    - name: Setup KernelSU Next v1.1.1
      run: |
        git clone --depth=1 -b v1.1.1 https://github.com/KernelSU-Next/KernelSU-Next.git
        bash KernelSU-Next/kernel/setup.sh
        echo "✅ KernelSU Next v1.1.1 integrated"

    # 6️⃣ SUSFS non-GKI patches
    - name: Apply SUSFS non-GKI patches
      run: |
        git clone --depth=1 -b non-GKI https://github.com/jonjeexe/KernelSU_Patches.git
        cd KernelSU_Patches
        bash apply.sh
        echo "✅ SUSFS non-GKI patches applied"

    # 7️⃣ Build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 8️⃣ Load defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 9️⃣ Build kernel
    - name: Build kernel
      run: |
        make O=out -j$(nproc)

    # 🔟 Check outputs
    - name: Check build output
      run: |
        test -f out/arch/arm64/boot/Image.gz
        test -f out/arch/arm64/boot/dtbo.img
        echo "✅ Image.gz & dtbo.img OK"

    # 1️⃣1️⃣ AnyKernel3
    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU-Next-v1.1.1-Violet.zip *

    # 1️⃣2️⃣ Upload
    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-v1.1.1-Violet
        path: KernelSU-Next-v1.1.1-Violet.zip
