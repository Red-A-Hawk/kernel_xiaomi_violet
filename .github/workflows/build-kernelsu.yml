name: Kernel Diff Report (sixteen vs sixteen-ksu)

on:
  push:
    branches: [sixteen]
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout kernel source (FULL history required)
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: sixteen
          fetch-depth: 0

      # 2️⃣ Fetch sixteen-ksu branch
      - name: Fetch sixteen-ksu branch
        run: |
          git fetch origin sixteen-ksu:sixteen-ksu

      # 3️⃣ Verify branches
      - name: Verify branches
        run: |
          echo "Current branch:"
          git branch --show-current
          echo "Available branches:"
          git branch -a

      # 4️⃣ Diff statistics (quick overview)
      - name: Diff statistics
        run: |
          git diff --stat sixteen..sixteen-ksu > diff-stat.txt

      # 5️⃣ Changed files list
      - name: Changed files list
        run: |
          git diff --name-status sixteen..sixteen-ksu > diff-files.txt

      # 6️⃣ Defconfig differences
      - name: Defconfig diff
        run: |
          mkdir -p reports
          git diff sixteen..sixteen-ksu -- arch/arm64/configs \
            > reports/defconfig.diff || true

      # 7️⃣ Kconfig differences
      - name: Kconfig diff
        run: |
          git diff sixteen..sixteen-ksu -- '**/Kconfig*' \
            > reports/kconfig.diff || true

      # 8️⃣ Core kernel areas (KernelSU / SUSFS usually here)
      - name: Core kernel diff
        run: |
          git diff sixteen..sixteen-ksu -- \
            fs \
            security \
            kernel \
            drivers \
            include \
            > reports/core.diff || true

      # 9️⃣ Full raw diff (for deep analysis)
      - name: Full raw diff
        run: |
          git diff sixteen..sixteen-ksu > reports/full.diff

      # 🔟 Compress all reports (lightweight)
      - name: Compress reports
        run: |
          tar -czf kernel-diff-report.tar.gz \
            diff-stat.txt \
            diff-files.txt \
            reports/

      # 1️⃣1️⃣ Upload artifact
      - name: Upload diff report
        uses: actions/upload-artifact@v4
        with:
          name: kernel-diff-report
          path: kernel-diff-report.tar.gz
