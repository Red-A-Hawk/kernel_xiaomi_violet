name: Kernel Diff Report (violet | sixteen)

on:
  push:
    branches: [sixteen]
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source (sixteen)
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    # 2️⃣ Fetch sixteen-ksu branch
    - name: Fetch sixteen-ksu
      run: |
        git fetch origin sixteen-ksu

    # 3️⃣ Prepare report directory
    - name: Prepare report directory
      run: |
        mkdir diff-report

    # 4️⃣ Diff statistics (خفيف جدًا)
    - name: Diff statistics
      run: |
        git diff origin/sixteen..origin/sixteen-ksu --stat \
          > diff-report/01_stat.txt

    # 5️⃣ Changed files list (خفيف جدًا)
    - name: Changed files list
      run: |
        git diff origin/sixteen..origin/sixteen-ksu --name-only \
          > diff-report/02_files.txt

    # 6️⃣ defconfig diff فقط
    - name: defconfig diff
      run: |
        git diff origin/sixteen..origin/sixteen-ksu -- \
          arch/arm64/configs/vendor/violet-perf_defconfig \
          > diff-report/03_defconfig.diff || true

    # 7️⃣ KernelSU related diff (مفلتر)
    - name: KernelSU diff
      run: |
        git diff origin/sixteen..origin/sixteen-ksu | grep -i kernelsu \
          > diff-report/04_kernelsu.diff || true

    # 8️⃣ SUSFS related diff (مفلتر)
    - name: SUSFS diff
      run: |
        git diff origin/sixteen..origin/sixteen-ksu | grep -i susfs \
          > diff-report/05_susfs.diff || true

    # 9️⃣ Compress report (أقصى ضغط)
    - name: Compress report
      run: |
        tar -cf diff-report.tar diff-report
        xz -9e diff-report.tar

    # 🔟 Upload artifact
    - name: Upload diff report
      uses: actions/upload-artifact@v4
      with:
        name: kernel-diff-report
        path: diff-report.tar.xz
