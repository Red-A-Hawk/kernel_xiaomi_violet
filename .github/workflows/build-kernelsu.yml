name: Build KernelSU Next v1.1.1 (violet | sixteen)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source (sixteen فقط)
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    # 2️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses5-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 python3-pip \
          openjdk-17-jre

    # 3️⃣ Setup ZyCromerZ Clang
    - name: Setup ZyCromerZ Clang
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ Fetch defconfig from sixteen-ksu (بدون تغيير الفرع)
    - name: Fetch working defconfig
      run: |
        mkdir -p arch/arm64/configs/vendor
        curl -L \
        https://raw.githubusercontent.com/Red-A-Hawk/kernel_xiaomi_violet/sixteen-ksu/arch/arm64/configs/vendor/violet-perf_defconfig \
        -o arch/arm64/configs/vendor/violet-perf_defconfig

    # 5️⃣ Setup KernelSU Next v1.1.1
    - name: Setup KernelSU Next v1.1.1
      run: |
        git clone --depth=1 -b v1.1.1 https://github.com/KernelSU-Next/KernelSU-Next.git
        bash KernelSU-Next/kernel/setup.sh

    # 6️⃣ Export build environment
    - name: Export build env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 7️⃣ Load defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    # 8️⃣ Build kernel
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 9️⃣ Check outputs
    - name: Check build outputs
      run: |
        test -f out/arch/arm64/boot/Image.gz
        test -f out/arch/arm64/boot/dtbo.img

    # 🔟 Package with AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU-Next-v1.1.1-Violet-unsigned.zip *

    # 1️⃣1️⃣ Download zipsigner
    - name: Download zipsigner
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    # 1️⃣2️⃣ Sign ZIP
    - name: Sign ZIP
      run: |
        java -jar zipsigner-3.0-dexed.jar \
          KernelSU-Next-v1.1.1-Violet-unsigned.zip \
          KernelSU-Next-v1.1.1-Violet.zip

    # 1️⃣3️⃣ Upload artifacts
    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-v1.1.1-Violet
        path: KernelSU-Next-v1.1.1-Violet.zip
