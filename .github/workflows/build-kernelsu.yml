name: Build KernelSU Next (violet | sixteen)

on:
  push:
    branches: [sixteen]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev build-essential \
          git curl zip unzip python3 clang lld

    - name: Fetch defconfig
      run: |
        cp vendor/violet-perf_defconfig arch/arm64/configs/violet_defconfig

    - name: Apply KernelSU Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU/main/kernel/setup.sh | bash -

    # ✅ FIXED non-GKI PATCH (no cd, no path error)
    - name: Apply KernelSU non-GKI patch
      run: |
        git clone --depth=1 -b non-GKI \
          https://github.com/jonjeexe/KernelSU_Patches.git Patches
        bash Patches/non-GKI/Patch.sh

    - name: Apply SUSFS kernel patch
      run: |
        git clone --depth=1 https://github.com/infectedmushi/susfs4ksu.git
        bash susfs4ksu/kernel/patch.sh

    - name: Enable SUSFS configs
      run: |
        echo "CONFIG_KSU=y" >> arch/arm64/configs/violet_defconfig
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/violet_defconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make violet_defconfig
        make -j$(nproc)

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        cp arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../kernel.zip *

    - name: Download zipsigner
      run: |
        curl -Lo zipsigner.jar \
          https://github.com/zhanghai/AndroidZipsigner/releases/download/v3.0/zipsigner-3.0.jar

    - name: Sign ZIP
      run: |
        java -jar zipsigner.jar kernel.zip kernel-signed.zip

    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-violet
        path: kernel-signed.zip
