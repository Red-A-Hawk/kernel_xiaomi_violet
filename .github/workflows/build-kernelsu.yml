name: KernelSU Next (KPROBES test)

on:
  push:
    branches:
      - sixteen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ جلب سورس النواة
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    # 2️⃣ تثبيت الاعتمادات
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential curl flex git \
          libssl-dev libncurses5-dev lzop zip unzip \
          wget python3 xz-utils libxml2-utils \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    # 3️⃣ تثبيت Proton Clang
    - name: Install Proton Clang
      run: |
        mkdir -p $HOME/proton
        wget -q https://github.com/kdrag0n/proton-clang-build/releases/download/20200117/proton_clang-11.0.0-20200117.tar.zst
        tar -I zstd -xf proton_clang-11.0.0-20200117.tar.zst -C $HOME/proton --strip-components=1
        echo "$HOME/proton/bin" >> $GITHUB_PATH

    # 4️⃣ متغيرات البناء
    - name: Export build env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 5️⃣ تحميل defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ تفعيل KernelSU + KPROBES + SUSFS (اختبار)
    - name: Apply KernelSU test config (KPROBES)
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_LSM_SECURITY_HOOKS \
          -e CONFIG_KPROBES \
          -e CONFIG_HAVE_KPROBES \
          -e CONFIG_KPROBE_EVENTS \
          -d CONFIG_KSU_MANUAL_HOOK

        scripts/config --file out/.config \
          -e CONFIG_KSU_SUSFS \
          -e CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
          -e CONFIG_KSU_SUSFS_SUS_PATH \
          -e CONFIG_KSU_SUSFS_SUS_MOUNT \
          -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
          -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
          -e CONFIG_KSU_SUSFS_SUS_KSTAT \
          -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
          -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
          -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
          -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
          -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
          -e CONFIG_KSU_SUSFS_ENABLE_LOG \
          -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS

        scripts/config --file out/.config \
          -e CONFIG_COMPAT_VDSO

        make O=out olddefconfig

    # 7️⃣ بناء النواة
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 8️⃣ التحقق من المخرجات
    - name: Check outputs
      run: |
        test -f out/arch/arm64/boot/Image.gz
        test -f out/arch/arm64/boot/dtbo.img

    # 9️⃣ تحضير AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        cd AnyKernel3
        zip -r9 ../kernel-test-unsigned.zip *

    # 🔟 تحميل zipsigner
    - name: Download zipsigner
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    # 1️⃣1️⃣ توقيع ZIP
    - name: Sign zip
      run: |
        java -jar zipsigner-3.0-dexed.jar \
          kernel-test-unsigned.zip \
          kernel-test-signed.zip

    # 1️⃣2️⃣ رفع النتائج
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-KPROBES-test
        path: |
          kernel-test-signed.zip
          build.log
