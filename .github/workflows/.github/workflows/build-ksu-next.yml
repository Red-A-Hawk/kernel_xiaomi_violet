name: "🚀 Build Kernel with KernelSU-Next v3.0.0 (no-GKI)"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build'
        required: false
        default: 'false'
      include_apk:
        description: '📱 Include KernelSU Manager APK'
        required: false
        default: 'true'

env:
  # Basic Configuration
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  
  # Directories
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  # File Names
  ZIP_NAME: "xcalibur-ksu-next-${{ github.run_number }}.zip"
  SIGNED_ZIP_NAME: "xcalibur-ksu-next-${{ github.run_number }}-signed.zip"
  
  # ✅ KernelSU-Next v3.0.0 Configuration (no-GKI SUPPORT)
  KSU_NEXT_BRANCH: "stable-1134"  # أو "ksu-next" حسب التوافق
  KSU_NEXT_APK_VERSION: "v3.0.0"
  KSU_NEXT_APK_URL: "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.0.0/KernelSU_Next_v3.0.0_32857-release.apk"
  KSU_NEXT_REPO: "https://github.com/KernelSU-Next/KernelSU.git"
  
  # Toolchain
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    # ==================== INITIALIZATION ====================
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: "📝 Get commit info"
      id: commit_info
      run: |
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log --oneline -1)" >> $GITHUB_OUTPUT

    - name: "📊 Display build info"
      run: |
        echo "================================================"
        echo "    🚀 KERNELSU-NEXT v3.0.0 BUILD (no-GKI)     "
        echo "================================================"
        echo "Kernel:    ${{ env.KERNEL_NAME }}"
        echo "Arch:      ${{ env.ARCH }}"
        echo "KSU Next:  ${{ env.KSU_NEXT_BRANCH }}"
        echo "APK:       ${{ env.KSU_NEXT_APK_VERSION }}"
        echo "Build:     #${{ github.run_number }}"
        echo "Commit:    ${{ steps.commit_info.outputs.commit_short }}"
        echo "Type:      no-GKI (Traditional Kernel)"
        echo "================================================"

    # ==================== CLEAN BUILD ====================
    - name: "🧹 Clean build (if requested)"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "Cleaning build environment..."
        rm -rf out/ anykernel/ toolchain/ drivers/kernelsu/
        make clean && make mrproper
        echo "✅ Clean build ready"

    # ==================== DEPENDENCIES ====================
    - name: "📦 Install dependencies"
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          gcc-aarch64-linux-gnu git libelf-dev libssl-dev \
          make python3 wget zip default-jre patch
        echo "✅ Dependencies installed"

    # ==================== TOOLCHAIN ====================
    - name: "🔧 Setup toolchain"
      run: |
        if [ ! -d "${{ env.TOOLCHAIN_DIR }}" ]; then
          echo "Downloading toolchain..."
          wget -q ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
          mkdir -p ${{ env.TOOLCHAIN_DIR }}
          tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
          rm -f clang.tar.gz
          echo "✅ Toolchain installed"
        else
          echo "⚡ Toolchain exists"
        fi
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH

    # ==================== KERNELSU-NEXT INSTALLATION ====================
    - name: "📦 Install KernelSU-Next"
      id: install_ksu_next
      run: |
        echo "Installing KernelSU-Next ${{ env.KSU_NEXT_BRANCH }}..."
        
        # إزالة أي تثبيت قديم
        rm -rf drivers/kernelsu 2>/dev/null || true
        
        # تثبيت KernelSU-Next
        git clone ${{ env.KSU_NEXT_REPO }} \
          --depth=1 \
          --branch "${{ env.KSU_NEXT_BRANCH }}" \
          /tmp/kernelsu-next
        
        mkdir -p drivers/kernelsu
        cp -rf /tmp/kernelsu-next/kernel/* drivers/kernelsu/
        rm -rf /tmp/kernelsu-next
        
        # التحقق من التثبيت
        if [ -f "drivers/kernelsu/core.c" ]; then
          echo "✅ KernelSU-Next installed successfully"
          echo "installed=true" >> $GITHUB_OUTPUT
        else
          echo "❌ KernelSU-Next installation failed!"
          echo "installed=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    # ==================== APPLY PATCHES (لـ no-GKI) ====================
    - name: "🔨 Apply KernelSU patches for no-GKI"
      if: steps.install_ksu_next.outputs.installed == 'true'
      id: apply_patches
      run: |
        echo "Applying KernelSU patches for no-GKI kernel..."
        
        # تحميل patches متوافقة مع no-GKI
        git clone https://github.com/Jonjeexe/KernelSU_Patches.git \
          --depth=1 \
          /tmp/ksu-patches
        
        # تطبيق patches تدريجياً مع تسجيل النتائج
        PATCH_COUNT=0
        APPLIED_PATCHES=""
        
        echo "Available patches:"
        ls -la /tmp/ksu-patches/*.patch
        
        for patch in /tmp/ksu-patches/0*.patch; do
          echo "Applying $(basename $patch)..."
          if patch -p1 --forward < "$patch" 2>/dev/null; then
            PATCH_COUNT=$((PATCH_COUNT + 1))
            APPLIED_PATCHES="$APPLIED_PATCHES $(basename $patch)"
            echo "  ✅ Applied"
          else
            echo "  ⚠️ Not applicable (might already be applied)"
          fi
        done
        
        rm -rf /tmp/ksu-patches
        
        echo "patches_applied=$PATCH_COUNT" >> $GITHUB_OUTPUT
        echo "applied_list=$APPLIED_PATCHES" >> $GITHUB_OUTPUT
        echo "✅ Applied $PATCH_COUNT patches for no-GKI"

    # ==================== KERNEL CONFIGURATION (no-GKI) ====================
    - name: "⚙️ Configure kernel for KernelSU-Next"
      run: |
        echo "Configuring kernel for KernelSU-Next (no-GKI)..."
        mkdir -p ${{ env.OUTPUT_DIR }}
        
        # إنشاء config مبدئي
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        # ✅ إضافة إعدادات KernelSU-Next لـ no-GKI
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'
# ===== KernelSU-Next v3.0.0 (no-GKI) =====
CONFIG_KSU=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBES_ON_FTRACE=y
CONFIG_KSU_NAME="KernelSU-Next"
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_DEBUG=n
CONFIG_KSU_STAT=n
CONFIG_KSU_EXPECTED_SIZE=n
EOF
        
        # تحديث config مع الاحتفاظ بالإعدادات الأخرى
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig
        
        # التحقق من إعدادات KernelSU
        echo "Checking KernelSU configuration..."
        grep -i "KSU\|KERNELSU" ${{ env.OUTPUT_DIR }}/.config || true
        
        echo "✅ Kernel configured for KernelSU-Next no-GKI"

    # ==================== COMPILE KERNEL ====================
    - name: "🚀 Compile kernel"
      id: compile
      run: |
        echo "Compiling kernel with KernelSU-Next..."
        START_TIME=$(date +%s)
        
        make -j$(nproc) \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="ccache clang" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
        
        # التحقق من نجاح البناء
        if tail -5 build.log | grep -q "Error\|error:"; then
          echo "❌ Build failed - check build.log for errors"
          exit 1
        elif [ -f "${{ env.OUTPUT_DIR }}/vmlinux" ]; then
          echo "✅ Kernel compiled successfully in ${BUILD_TIME}s"
          echo "KERNEL_SIZE=$(stat -c%s ${{ env.OUTPUT_DIR }}/vmlinux)" >> $GITHUB_ENV
        else
          echo "❌ vmlinux not found - build incomplete"
          exit 1
        fi

    # ==================== VERIFY ARTIFACTS ====================
    - name: "✅ Verify KernelSU-Next build artifacts"
      id: verify_build
      run: |
        echo "Verifying KernelSU-Next artifacts..."
        
        REQUIRED_FILES=(
          "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz"
          "${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img"
          "${{ env.OUTPUT_DIR }}/vmlinux"
        )
        
        MISSING_FILES=0
        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ Found: $(basename $file)"
          else
            echo "❌ Missing: $(basename $file)"
            MISSING_FILES=$((MISSING_FILES + 1))
          fi
        done
        
        # التحقق من KernelSU في kernel
        echo "Checking for KernelSU symbols..."
        if strings "${{ env.OUTPUT_DIR }}/vmlinux" | grep -q "kernelsu\|KernelSU"; then
          echo "✅ KernelSU symbols found in kernel"
          KSU_INCLUDED=true
        else
          echo "⚠️ KernelSU symbols not found in kernel"
          KSU_INCLUDED=false
        fi
        
        if [ $MISSING_FILES -eq 0 ]; then
          echo "✅ All artifacts found"
          echo "build_success=true" >> $GITHUB_OUTPUT
          echo "ksu_included=$KSU_INCLUDED" >> $GITHUB_OUTPUT
        else
          echo "❌ Missing $MISSING_FILES required files"
          echo "build_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    # ==================== SETUP ANYKERNEL ====================
    - name: "📦 Setup AnyKernel3"
      if: steps.verify_build.outputs.build_success == 'true'
      run: |
        echo "Setting up AnyKernel3 for KernelSU-Next..."
        rm -rf ${{ env.ANYKERNEL_DIR }}
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3 -b sixteen ${{ env.ANYKERNEL_DIR }}
        
        # تنظيف AnyKernel
        rm -f ${{ env.ANYKERNEL_DIR }}/Image.gz 2>/dev/null || true
        rm -f ${{ env.ANYKERNEL_DIR }}/dtbo.img 2>/dev/null || true
        
        # إضافة معلومات KernelSU-Next
        cat > ${{ env.ANYKERNEL_DIR }}/ksu_info.txt << EOF
KernelSU-Next v3.0.0
Type: no-GKI
Branch: ${{ env.KSU_NEXT_BRANCH }}
APK Version: ${{ env.KSU_NEXT_APK_VERSION }}
Build Date: $(date)
EOF

    # ==================== ADD KERNELSU-NEXT APK ====================
    - name: "📱 Add KernelSU-Next v3.0.0 APK"
      if: steps.verify_build.outputs.build_success == 'true' && github.event.inputs.include_apk == 'true'
      run: |
        echo "Adding KernelSU-Next v3.0.0 APK (no-GKI)..."
        mkdir -p ${{ env.ANYKERNEL_DIR }}/apk
        
        # تحميل APK الجديد
        wget -q ${{ env.KSU_NEXT_APK_URL }} -O ${{ env.ANYKERNEL_DIR }}/apk/KernelSU_Next_v3.0.0.apk
        
        # التحقق من APK
        APK_SIZE=$(stat -c%s "${{ env.ANYKERNEL_DIR }}/apk/KernelSU_Next_v3.0.0.apk")
        if [ $APK_SIZE -gt 1000000 ]; then  # أكثر من 1MB
          echo "✅ APK downloaded successfully ($((APK_SIZE/1024/1024))MB)"
          echo "APK_VERSION=${{ env.KSU_NEXT_APK_VERSION }}" >> $GITHUB_ENV
        else
          echo "⚠️ APK seems too small, might be corrupted"
          rm -f ${{ env.ANYKERNEL_DIR }}/apk/KernelSU_Next_v3.0.0.apk
        fi

    # ==================== PACKAGE KERNEL ====================
    - name: "📁 Package kernel with KernelSU-Next"
      if: steps.verify_build.outputs.build_success == 'true'
      run: |
        echo "Packaging kernel with KernelSU-Next..."
        
        # نسخ ملفات kernel
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz ${{ env.ANYKERNEL_DIR }}/
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img ${{ env.ANYKERNEL_DIR }}/
        
        # إنشاء ملف معلومات البناء
        cat > ${{ env.ANYKERNEL_DIR }}/build_info.txt << EOF
================================================
        KERNELSU-NEXT v3.0.0 BUILD
================================================
Kernel:      ${{ env.KERNEL_NAME }}
Type:        no-GKI (Traditional)
KSU Next:    ${{ env.KSU_NEXT_BRANCH }}
APK Version: ${{ env.KSU_NEXT_APK_VERSION }}
Build:       #${{ github.run_number }}
Commit:      ${{ steps.commit_info.outputs.commit_short }}
Date:        $(date)
Build Time:  ${{ env.BUILD_TIME }} seconds
Kernel Size: ${{ env.KERNEL_SIZE }} bytes
Patches:     ${{ steps.apply_patches.outputs.patches_applied }}/6
Applied:     ${{ steps.apply_patches.outputs.applied_list }}
================================================
EOF
        
        # إنشاء zip
        cd ${{ env.ANYKERNEL_DIR }}
        zip -r9 ../${{ env.ZIP_NAME }} * > /dev/null
        cd ..
        
        echo "✅ Package created: ${{ env.ZIP_NAME }} ($(stat -c%s ${{ env.ZIP_NAME }}) bytes)"

    # ==================== SIGN ZIP ====================
    - name: "🔏 Sign kernel zip"
      if: steps.verify_build.outputs.build_success == 'true'
      run: |
        echo "Signing kernel zip..."
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar -O zipsigner.jar
        
        java -jar zipsigner.jar \
          ${{ env.ZIP_NAME }} \
          ${{ env.SIGNED_ZIP_NAME }}
        
        if [ -f "${{ env.SIGNED_ZIP_NAME }}" ]; then
          echo "SIGNED_ZIP=${{ env.SIGNED_ZIP_NAME }}" >> $GITHUB_ENV
          echo "✅ Signed successfully: ${{ env.SIGNED_ZIP_NAME }}"
        else
          echo "SIGNED_ZIP=${{ env.ZIP_NAME }}" >> $GITHUB_ENV
          echo "⚠️ Signing failed, using unsigned zip"
        fi

    # ==================== ORGANIZE RELEASES ====================
    - name: "📂 Organize releases"
      if: steps.verify_build.outputs.build_success == 'true'
      run: |
        echo "Organizing KernelSU-Next release files..."
        mkdir -p ${{ env.RELEASES_DIR }}
        
        # نقل الملف النهائي
        FINAL_ZIP="${{ env.RELEASES_DIR }}/${{ env.KERNEL_NAME }}-ksu-next-${{ github.run_number }}.zip"
        mv "${{ env.SIGNED_ZIP }}" "$FINAL_ZIP"
        
        # نسخ ملفات مهمة
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz ${{ env.RELEASES_DIR }}/ 2>/dev/null || true
        cp ${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img ${{ env.RELEASES_DIR }}/ 2>/dev/null || true
        cp ${{ env.ANYKERNEL_DIR }}/apk/*.apk ${{ env.RELEASES_DIR }}/ 2>/dev/null || true
        
        echo "✅ Files organized"
        echo "Final release: $(basename $FINAL_ZIP)"
        echo "Size: $(( $(stat -c%s "$FINAL_ZIP") / 1024 / 1024 ))MB"

    # ==================== UPLOAD ARTIFACTS ====================
    - name: "📤 Upload artifacts"
      if: steps.verify_build.outputs.build_success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kernel-ksu-next-${{ github.run_number }}
        path: |
          ${{ env.RELEASES_DIR }}/*
          ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image.gz
          ${{ env.OUTPUT_DIR }}/arch/arm64/boot/dtbo.img
          build.log
          ${{ env.OUTPUT_DIR }}/.config
        retention-days: 30
        if-no-files-found: error

    # ==================== BUILD SUMMARY ====================
    - name: "🎉 KernelSU-Next build summary"
      if: steps.verify_build.outputs.build_success == 'true'
      run: |
        echo "================================================"
        echo "   🎉 KERNELSU-NEXT v3.0.0 BUILD COMPLETE"
        echo "================================================"
        echo "Status:     ✅ SUCCESS"
        echo "Kernel:     ${{ env.KERNEL_NAME }}"
        echo "KSU Next:   ${{ env.KSU_NEXT_BRANCH }}"
        echo "APK:        ${{ env.KSU_NEXT_APK_VERSION }} (no-GKI)"
        echo "Build Time: ${{ env.BUILD_TIME }} seconds"
        echo "Output:     releases/${{ env.KERNEL_NAME }}-ksu-next-${{ github.run_number }}.zip"
        echo "KSU Patch:  ${{ steps.verify_build.outputs.ksu_included }}"
        echo "================================================"

    # ==================== UPLOAD LOGS ON FAILURE ====================
    - name: "📋 Upload logs on failure"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-logs-${{ github.run_number }}
        path: |
          build.log
          ${{ env.OUTPUT_DIR }}/.config
          ${{ env.OUTPUT_DIR }}/include/config/auto.conf
        retention-days: 7
