#!/bin/bash
set -e

# Configuration
KERNEL_DIR=$(pwd)
OUT_DIR="$KERNEL_DIR/out"
ARCH="arm64"
CONFIG="vendor/violet-perf_defconfig"
KERNEL_NAME="xcalibur-v5.4-violet-dynamic"

# Colors
RED='\033[0;31m'
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
NC='\033[0m'

# Print header
print_header() {
    echo -e "${GREEN}"
    echo "========================================"
    echo "    $1"
    echo "========================================"
    echo -e "${NC}"
}

# Install toolchain
install_toolchain() {
    print_header "Installing ZyC Clang"
    
    CLANG_DIR="$HOME/zyc-clang"
    mkdir -p "$CLANG_DIR"
    cd "$CLANG_DIR"
    
    echo "Downloading toolchain..."
    wget -q --show-progress \
        "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928-linux-x86_64.tar.gz" \
        -O clang.tar.gz
    
    echo "Extracting..."
    tar -xzf clang.tar.gz
    
    # Find clang
    CLANG_BIN=$(find . -type f -name "clang" -path "*/bin/*" | head -1)
    
    if [ -n "$CLANG_BIN" ]; then
        CLANG_BASE=$(dirname "$(dirname "$CLANG_BIN")")
        cp -r "$CLANG_BASE"/* ./
        
        if [ -f "./bin/clang" ]; then
            echo -e "${GREEN}✅ Toolchain ready${NC}"
            export PATH="$CLANG_DIR/bin:$PATH"
        fi
    fi
    
    cd "$KERNEL_DIR"
}

# Setup KernelSU
setup_kernelsu() {
    local version=$1
    
    print_header "Setting up KernelSU $version"
    
    TEMP_DIR=$(mktemp -d)
    cd "$TEMP_DIR"
    
    case "$version" in
        v1.1.1|v1.1.0|v1.0.0)
            wget -q "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/$version/KernelSU-$version.zip"
            unzip -q "KernelSU-$version.zip"
            cd "KernelSU-$version"
            ;;
        *)
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git
            cd KernelSU-Next
            ;;
    esac
    
    if [ -f "kernel/setup.sh" ]; then
        cd kernel
        chmod +x setup.sh
        ./setup.sh "$KERNEL_DIR"
    fi
    
    cd "$KERNEL_DIR"
    rm -rf "$TEMP_DIR"
}

# Build kernel
build_kernel() {
    print_header "Building Kernel"
    
    # Clean if needed
    if [ "$1" = "clean" ]; then
        echo "Cleaning..."
        rm -rf "$OUT_DIR"
        make clean 2>/dev/null || true
        make mrproper 2>/dev/null || true
    fi
    
    # Create output dir
    mkdir -p "$OUT_DIR"
    
    # Generate config
    echo "Generating config..."
    make O="$OUT_DIR" ARCH="$ARCH" "$CONFIG"
    
    # Build
    echo "Compiling..."
    CORES=$(nproc)
    JOBS=$((CORES * 2))
    
    make -j$JOBS \
        O="$OUT_DIR" \
        ARCH="$ARCH" \
        CC="ccache clang" \
        CLANG_TRIPLE="aarch64-linux-gnu-" \
        CROSS_COMPILE="aarch64-linux-gnu-" \
        CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
        LLVM=1 \
        LLVM_IAS=1
    
    echo -e "${GREEN}✅ Build completed${NC}"
}

# Main function
main() {
    echo "Kernel Build Script"
    echo "==================="
    
    # Parse arguments
    KERNELSU=${1:-"none"}
    CLEAN=${2:-"false"}
    
    echo "KernelSU: $KERNELSU"
    echo "Clean: $CLEAN"
    echo ""
    
    # Install toolchain
    install_toolchain
    
    # Setup KernelSU if needed
    if [ "$KERNELSU" != "none" ]; then
        setup_kernelsu "$KERNELSU"
    fi
    
    # Build kernel
    if [ "$CLEAN" = "true" ]; then
        build_kernel "clean"
    else
        build_kernel
    fi
    
    print_header "Build Successful"
    echo "Kernel image: $OUT_DIR/arch/arm64/boot/Image.gz"
}

# Run
main "$@"
