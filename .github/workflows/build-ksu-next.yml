name: "🚀 Build Kernel with KernelSU-Next v3.0.0 (no-GKI)"

on:
  push:
    branches: [ sixteen-ksu ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build'
        required: false
        default: 'false'
      include_apk:
        description: '📱 Include KernelSU Manager APK'
        required: false
        default: 'true'

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  
  ANYKERNEL_DIR: "${{ github.workspace }}/anykernel"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
  OUTPUT_DIR: "${{ github.workspace }}/out"
  RELEASES_DIR: "${{ github.workspace }}/releases"
  
  ZIP_NAME: "xcalibur-ksu-next-${{ github.run_number }}.zip"
  SIGNED_ZIP_NAME: "xcalibur-ksu-next-${{ github.run_number }}-signed.zip"
  
  KSU_NEXT_BRANCH: "stable-1134"
  KSU_NEXT_APK_VERSION: "v3.0.0"
  KSU_NEXT_APK_URL: "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.0.0/KernelSU_Next_v3.0.0_32857-release.apk"
  KSU_NEXT_REPO: "https://github.com/KernelSU-Next/KernelSU.git"
  
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: "📦 Install dependencies"
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev make python3 wget zip default-jre patch

    - name: "🔧 Setup toolchain"
      run: |
        wget -q ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
        mkdir -p ${{ env.TOOLCHAIN_DIR }}
        tar -xzf clang.tar.gz -C ${{ env.TOOLCHAIN_DIR }} --strip-components=1
        rm -f clang.tar.gz
        echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH

    - name: "📦 Install KernelSU-Next"
      run: |
        git clone ${{ env.KSU_NEXT_REPO }} --depth=1 --branch "${{ env.KSU_NEXT_BRANCH }}" /tmp/kernelsu-next
        mkdir -p drivers/kernelsu
        cp -rf /tmp/kernelsu-next/kernel/* drivers/kernelsu/
        rm -rf /tmp/kernelsu-next

    - name: "⚙️ Configure kernel"
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} ${{ env.CONFIG_FILE }}
        
        cat >> ${{ env.OUTPUT_DIR }}/.config << 'EOF'
CONFIG_KSU=y
CONFIG_KSU_NAME="KernelSU-Next"
CONFIG_KSU_MANUAL_HOOK=y
CONFIG_KSU_DEBUG=n
EOF
        
        make ARCH=${{ env.ARCH }} O=${{ env.OUTPUT_DIR }} olddefconfig

    - name: "🚀 Compile kernel"
      run: |
        make -j$(nproc) \
          O=${{ env.OUTPUT_DIR }} \
          ARCH=${{ env.ARCH }} \
          CC="ccache clang" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log

    - name: "📤 Upload build log"
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: build.log
