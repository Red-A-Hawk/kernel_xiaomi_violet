name: Build Kernel (violet | Proton Clang | KernelSU Next v1.1.1)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Setup dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev \
        build-essential zip unzip git curl \
        python3 python-is-python3 openjdk-11-jre

    - name: Setup Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

    # ===============================
    # KernelSU Next v1.1.1 (FIXED)
    # ===============================
    - name: Setup KernelSU Next v1.1.1
      run: |
        git clone https://github.com/KernelSU-Next/KernelSU-Next.git
        cd KernelSU-Next
        git checkout v1.1.1
        cd ..
        bash KernelSU-Next/kernel/setup.sh

    # ===============================
    # Apply non-GKI patches
    # ===============================
    - name: Apply KernelSU non-GKI patches
      run: |
        git clone https://github.com/jonjeexe/KernelSU_Patches.git
        cd KernelSU_Patches
        bash Patch.sh
        cd ..

    # ===============================
    # Load defconfig
    # ===============================
    - name: Load defconfig
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out vendor/violet-perf_defconfig

    # ===============================
    # Enable KernelSU + SUSFS
    # ===============================
    - name: Enable KernelSU + SUSFS
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK
        make O=out olddefconfig

    # ===============================
    # Build kernel
    # ===============================
    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        make -j$(nproc) O=out

    # ===============================
    # Prepare AnyKernel3
    # ===============================
    - name: Prepare AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 -b sixteen
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/

    # ===============================
    # Create flashable zip
    # ===============================
    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../kernel-violet.zip *
        cd ..

    # ===============================
    # Sign zip
    # ===============================
    - name: Sign zip
      run: |
        curl -L -o zipsigner.jar \
        https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar kernel-violet.zip kernel-violet-signed.zip

    # ===============================
    # Upload
    # ===============================
    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-signed
        path: kernel-violet-signed.zip
