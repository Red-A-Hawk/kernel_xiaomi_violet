name: "Build Kernel with KernelSU Next"

on:
  workflow_dispatch:
  push:
    branches: [ sixteen-ksu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
      ARCH: "arm64"
      CONFIG_FILE: "vendor/violet-perf_defconfig"
      KSU_TAG: "v1.1.1"  # أو stable-1134
      
    steps:
    # ==================== 📥 CHECKOUT ====================
    - name: "📥 Checkout Kernel Source"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    # ==================== 🧹 CLEAN SPACE ====================
    - name: "🧹 Free Disk Space"
      run: |
        echo "Cleaning up space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo apt-get clean
        echo "Space freed"
        
    # ==================== 📦 DEPENDENCIES ====================
    - name: "📦 Install Build Dependencies"
      run: |
        echo "Installing dependencies..."
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex git libssl-dev libncurses5-dev lzop zip wget python3
        echo "Dependencies installed"
        
    # ==================== 💾 SWAP ====================
    - name: "💾 Setup 10GB Swap"
      run: |
        echo "Creating swap space..."
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1G count=10 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=100
        echo "Swap configured"
        
    # ==================== 🔐 KERNELSU DRIVER (الحل الجديد) ====================
    - name: "🔐 Download KernelSU Driver"
      run: |
        echo "Downloading KernelSU driver..."
        
        # ✅ الطريقة الآمنة: تحميل مباشر من الأرشيف
        # KernelSU repository: https://github.com/KernelSU-Next/KernelSU
        
        # طريقة 1: تحميل مباشر من branch
        wget -q https://github.com/KernelSU-Next/KernelSU/archive/refs/heads/${{ env.KSU_TAG }}.tar.gz -O kernelsu.tar.gz || \
        wget -q https://github.com/KernelSU-Next/KernelSU/archive/refs/tags/${{ env.KSU_TAG }}.tar.gz -O kernelsu.tar.gz || \
        wget -q https://github.com/KernelSU-Next/KernelSU/archive/refs/heads/main.tar.gz -O kernelsu.tar.gz
        
        if [ -f "kernelsu.tar.gz" ]; then
          echo "Extracting KernelSU..."
          tar -xf kernelsu.tar.gz --strip-components=1
          
          # نسخ ملفات kernel
          mkdir -p drivers/kernelsu
          cp -rf kernel/* drivers/kernelsu/ 2>/dev/null || \
          cp -rf KernelSU-*/kernel/* drivers/kernelsu/ 2>/dev/null
          
          rm -rf kernelsu.tar.gz kernel/ KernelSU-*/
          echo "✅ KernelSU driver added"
        else
          echo "⚠️ Could not download KernelSU driver"
          echo "Checking if KSU already exists..."
          
          if [ -d "drivers/kernelsu" ]; then
            echo "✅ KernelSU already exists in kernel"
          else
            echo "❌ KernelSU driver missing - build may not have KSU support"
          fi
        fi
        
    # ==================== 📦 KERNELSU APK ====================
    - name: "📦 Download KernelSU APK"
      run: |
        echo "Downloading KernelSU Next APK v3.0.0..."
        
        # APK مباشر من releases
        wget -q https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.0.0/KernelSU_Next_v3.0.0_32857-release.apk -O kernelsu.apk
        
        if [ -f "kernelsu.apk" ]; then
          APK_SIZE=$(stat -c%s kernelsu.apk)
          echo "✅ APK downloaded: $((APK_SIZE/1024/1024)) MB"
        else
          echo "⚠️ APK download failed - continuing without APK"
        fi
        
    # ==================== 🔧 TOOLCHAIN ====================
    - name: "🔧 Download ZyC Clang 15"
      run: |
        echo "Downloading ZyC Clang 15.0.7..."
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        
        echo "Extracting toolchain..."
        mkdir -p clang
        tar -xf Clang-15.0.7-20251111.tar.gz -C clang/ --strip-components=1
        rm Clang-15.0.7-20251111.tar.gz
        
        echo "✅ Toolchain ready"
        
    # ==================== ⚙️ CONFIG ====================
    - name: "⚙️ Setup Kernel Config"
      run: |
        echo "Setting up kernel configuration with KernelSU..."
        
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        
        mkdir -p out
        
        # اختيار defconfig
        if make O=out vendor/violet-perf_defconfig 2>/dev/null; then
          echo "Using vendor/violet-perf_defconfig"
        elif make O=out violet-perf_defconfig 2>/dev/null; then
          echo "Using violet-perf_defconfig"
        else
          make O=out violet_defconfig
          echo "Using violet_defconfig"
        fi
        
        # 🔥 إضافة إعدادات KernelSU الأساسية
        echo "Adding KernelSU configuration..."
        echo "CONFIG_KSU=y" >> out/.config
        echo "CONFIG_KSU_NAME=\"KernelSU-Next\"" >> out/.config
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
        echo "CONFIG_KSU_DEBUG=n" >> out/.config
        
        # إعدادات إضافية لـ no-GKI
        echo "CONFIG_KPROBES=y" >> out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> out/.config
        echo "CONFIG_KPROBES_ON_FTRACE=y" >> out/.config
        
        # تحديث config
        make O=out ARCH=arm64 olddefconfig
        
        # التحقق من إعدادات KSU
        echo "KernelSU config check:"
        grep -i KSU out/.config || echo "No KSU config found!"
        
    # ==================== 🔨 COMPILE ====================
    - name: "🔨 Compile Kernel with KernelSU"
      id: compile
      run: |
        echo "Compiling kernel with KernelSU support..."
        
        export PATH="$(pwd)/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        START_TIME=$(date +%s)
        
        echo "Build start: $(date)"
        
        # بناء مع دعم KernelSU
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log
        
        BUILD_STATUS=$?
        
        END_TIME=$(date +%s)
        BUILD_SECONDS=$((END_TIME - START_TIME))
        
        echo "Build end: $(date)"
        echo "Build time: $((BUILD_SECONDS / 60))m $((BUILD_SECONDS % 60))s"
        
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "❌ Build failed"
          exit $BUILD_STATUS
        fi
        
        echo "✅ Build successful"
        echo "BUILD_TIME=$((BUILD_SECONDS / 60))m $((BUILD_SECONDS % 60))s" >> $GITHUB_ENV
        
    # ==================== ✅ VERIFY KSU ====================
    - name: "✅ Verify KernelSU Integration"
      run: |
        echo "Verifying KernelSU in built kernel..."
        
        # التحقق من وجود KernelSU في النواة المبينة
        if strings out/vmlinux 2>/dev/null | grep -q -i "kernelsu\|KSU"; then
          echo "✅ KernelSU found in kernel binary"
          echo "KSU_INTEGRATION=success" >> $GITHUB_ENV
        else
          echo "⚠️ KernelSU not found in kernel binary"
          echo "KSU_INTEGRATION=warning" >> $GITHUB_ENV
        fi
        
        # التحقق من ملفات البناء
        if [ -f "out/arch/arm64/boot/Image.gz" ] && [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          echo "✅ Kernel files found"
          echo "BUILD_FILES=success" >> $GITHUB_ENV
        else
          echo "❌ Missing kernel files"
          echo "BUILD_FILES=failed" >> $GITHUB_ENV
          exit 1
        fi
        
    # ==================== 📦 PACKAGE ====================
    - name: "📦 Create Flashable ZIP with KernelSU"
      if: env.BUILD_FILES == 'success'
      run: |
        echo "Creating flashable ZIP with KernelSU..."
        
        # AnyKernel3
        git clone --quiet https://github.com/osm0sis/AnyKernel3 ak3
        
        # نسخ ملفات kernel
        cp out/arch/arm64/boot/Image.gz ak3/
        cp out/arch/arm64/boot/dtbo.img ak3/
        
        # إضافة KernelSU APK إذا موجود
        if [ -f "kernelsu.apk" ]; then
          mkdir -p ak3/apk
          cp kernelsu.apk ak3/apk/KernelSU_Next_v3.0.0.apk
          echo "✅ Added KernelSU APK to ZIP"
        fi
        
        # إضافة معلومات البناء
        echo "Kernel: ${{ env.KERNEL_NAME }}" > ak3/build_info.txt
        echo "KernelSU: Next v3.0.0" >> ak3/build_info.txt
        echo "Build Type: no-GKI with full KSU support" >> ak3/build_info.txt
        echo "Build Date: $(date)" >> ak3/build_info.txt
        echo "KSU Integration: ${{ env.KSU_INTEGRATION }}" >> ak3/build_info.txt
        
        # إنشاء ZIP
        cd ak3
        ZIP_NAME="xcalibur-ksu-next-${{ github.run_number }}.zip"
        zip -r9 "../$ZIP_NAME" * > /dev/null
        cd ..
        
        ZIP_SIZE=$(stat -c%s "$ZIP_NAME")
        echo "✅ ZIP created: $ZIP_NAME ($((ZIP_SIZE/1024/1024)) MB)"
        
    # ==================== 📤 UPLOAD ====================
    - name: "📤 Upload Kernel ZIP"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-ksu-next-${{ github.run_number }}
        path: xcalibur-ksu-next-*.zip
        retention-days: 30
        
    - name: "📤 Upload Build Log"
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: build.log
        retention-days: 7
        
    # ==================== 📊 SUMMARY ====================
    - name: "📊 Build Summary"
      run: |
        echo "### 🎯 KernelSU Next Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ env.BUILD_FILES }}" = "success" ]; then
          echo "✅ **BUILD SUCCESSFUL**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kernel:** ${{ env.KERNEL_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**KernelSU:** Next v3.0.0 (Full Support)" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** no-GKI Kernel" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
          echo "**KSU Status:** ${{ env.KSU_INTEGRATION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download:** kernel-ksu-next-${{ github.run_number }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **Features:**" >> $GITHUB_STEP_SUMMARY
          echo "- Full KernelSU Next v3.0.0 support" >> $GITHUB_STEP_SUMMARY
          echo "- no-GKI kernel" >> $GITHUB_STEP_SUMMARY
          echo "- Includes KernelSU Manager APK" >> $GITHUB_STEP_SUMMARY
          echo "- Compatible with KSU modules" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **BUILD FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the build log for details" >> $GITHUB_STEP_SUMMARY
        fi
