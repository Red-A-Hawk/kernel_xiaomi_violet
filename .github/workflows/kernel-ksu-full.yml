name: "🚀 Build Kernel with KernelSU"

on:
  push:
    branches: [ sixteen-ksu ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Clean build'
        required: false
        default: 'false'
      include_apk:
        description: '📱 Include KernelSU Manager APK'
        required: false
        default: 'true'

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic-ksu"
  ARCH: "arm64"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  
  KSU_KERNEL_BRANCH: "stable-1134"
  KSU_APK_VERSION: "v1.1.1-hotfix"
  KSU_APK_URL: "https://github.com/tiann/KernelSU/releases/download/v1.1.1/KernelSU_v1.1.1_12174-release.apk"
  
  TOOLCHAIN_URL: "https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    # ==================== 📥 INITIALIZATION ====================
    - name: "📥 Checkout repository"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: "📝 Get commit info"
      id: commit_info
      run: |
        SHORT_COMMIT=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log --oneline -1)
        echo "commit_short=${SHORT_COMMIT}" >> $GITHUB_OUTPUT
        echo "commit_message=${COMMIT_MSG}" >> $GITHUB_OUTPUT

    - name: "📊 Display build info"
      run: |
        echo "========================================"
        echo "           🚀 KERNEL BUILD"
        echo "========================================"
        echo "Kernel:    ${{ env.KERNEL_NAME }}"
        echo "Arch:      ${{ env.ARCH }}"
        echo "KSU:       ${{ env.KSU_KERNEL_BRANCH }}"
        echo "APK:       ${{ env.KSU_APK_VERSION }}"
        echo "Build:     #${{ github.run_number }}"
        echo "========================================"

    # ==================== 🧹 CLEAN BUILD ====================
    - name: "🧹 Clean build"
      if: github.event.inputs.clean_build == 'true'
      run: |
        echo "Cleaning build environment..."
        rm -rf out anykernel toolchain drivers/kernelsu
        make clean
        make mrproper
        echo "Clean build ready"

    # ==================== 📦 DEPENDENCIES ====================
    - name: "📦 Install dependencies"
      run: |
        echo "Installing build dependencies..."
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu git libelf-dev libssl-dev make python3 wget zip default-jre patch
        echo "Dependencies installed"

    # ==================== 🔧 TOOLCHAIN ====================
    - name: "🔧 Setup toolchain"
      run: |
        echo "Setting up toolchain..."
        wget -q ${{ env.TOOLCHAIN_URL }} -O clang.tar.gz
        mkdir -p toolchain
        tar -xzf clang.tar.gz -C toolchain --strip-components=1
        rm -f clang.tar.gz
        echo "toolchain/bin" >> $GITHUB_PATH
        echo "Toolchain ready"

    # ==================== 📦 KERNELSU DRIVER ====================
    - name: "📦 Download KernelSU driver"
      id: download_ksu
      run: |
        echo "Downloading KernelSU driver..."
        
        # محاولة تحميل مباشر (أكثر أماناً من git clone)
        wget -q https://github.com/KernelSU-Next/KernelSU/archive/refs/heads/${{ env.KSU_KERNEL_BRANCH }}.tar.gz -O kernelsu.tar.gz || true
        
        if [ -f "kernelsu.tar.gz" ]; then
          tar -xf kernelsu.tar.gz
          mkdir -p drivers/kernelsu
          cp -rf KernelSU-*/kernel/* drivers/kernelsu/
          rm -rf kernelsu.tar.gz KernelSU-*
          echo "KernelSU driver downloaded"
          echo "driver_status=success" >> $GITHUB_OUTPUT
        else
          echo "Using existing KernelSU driver if available"
          echo "driver_status=skipped" >> $GITHUB_OUTPUT
        fi

    # ==================== 🔨 APPLY PATCHES ====================
    - name: "🔨 Apply patches"
      if: steps.download_ksu.outputs.driver_status == 'success'
      run: |
        echo "Downloading patches..."
        wget -q https://github.com/Jonjeexe/KernelSU_Patches/archive/main.tar.gz -O patches.tar.gz
        tar -xf patches.tar.gz
        rm -f patches.tar.gz
        
        echo "Applying patches..."
        PATCH_COUNT=0
        for PATCH in KernelSU_Patches-main/0*.patch; do
          if [ -f "$PATCH" ]; then
            patch -p1 --forward < "$PATCH" 2>/dev/null && PATCH_COUNT=$((PATCH_COUNT + 1)) || true
          fi
        done
        
        rm -rf KernelSU_Patches-main
        echo "Applied ${PATCH_COUNT} patches"

    # ==================== ⚙️ KERNEL CONFIG ====================
    - name: "⚙️ Configure kernel"
      run: |
        echo "Configuring kernel..."
        mkdir -p out
        
        # إنشاء config مبدئي
        make ARCH=${{ env.ARCH }} O=out ${{ env.CONFIG_FILE }}
        
        # ✅ إضافة إعدادات KernelSU (بدون HEREDOC)
        echo "CONFIG_KSU=y" >> out/.config
        echo 'CONFIG_KSU_NAME="KSU"' >> out/.config
        echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
        echo "CONFIG_KSU_DEBUG=n" >> out/.config
        
        # تحديث config
        make ARCH=${{ env.ARCH }} O=out olddefconfig
        echo "Kernel configured"

    # ==================== 🚀 COMPILE KERNEL ====================
    - name: "🚀 Compile kernel"
      id: compile
      run: |
        echo "Compiling kernel..."
        START_TIME=$(date +%s)
        
        make -j$(nproc) O=out ARCH=${{ env.ARCH }} CC="ccache clang" CLANG_TRIPLE="aarch64-linux-gnu-" CROSS_COMPILE="aarch64-linux-gnu-" LLVM=1 LLVM_IAS=1 2>&1 | tee build.log
        
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV
        
        if tail -5 build.log | grep -q "Error"; then
          echo "Build failed"
          exit 1
        else
          echo "Build completed in ${BUILD_TIME}s"
        fi

    # ==================== ✅ VERIFY ARTIFACTS ====================
    - name: "✅ Verify artifacts"
      id: verify
      run: |
        echo "Verifying artifacts..."
        
        IMAGE_FILE="out/arch/arm64/boot/Image.gz"
        DTBO_FILE="out/arch/arm64/boot/dtbo.img"
        
        if [ -f "$IMAGE_FILE" ] && [ -f "$DTBO_FILE" ]; then
          echo "Artifacts found"
          echo "verify_status=success" >> $GITHUB_OUTPUT
          echo "image_size=$(du -h "$IMAGE_FILE" | cut -f1)" >> $GITHUB_OUTPUT
          echo "dtbo_size=$(du -h "$DTBO_FILE" | cut -f1)" >> $GITHUB_OUTPUT
        else
          echo "Missing artifacts"
          echo "verify_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

    # ==================== 📦 SETUP ANYKERNEL ====================
    - name: "📦 Setup AnyKernel3"
      if: steps.verify.outputs.verify_status == 'success'
      run: |
        echo "Setting up AnyKernel3..."
        rm -rf anykernel
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3 -b sixteen anykernel
        rm -f anykernel/Image.gz anykernel/dtbo.img 2>/dev/null || true

    # ==================== 📱 ADD APK ====================
    - name: "📱 Add KernelSU APK"
      if: steps.verify.outputs.verify_status == 'success' && github.event.inputs.include_apk == 'true'
      run: |
        echo "Adding KernelSU APK..."
        mkdir -p anykernel/apk
        wget -q ${{ env.KSU_APK_URL }} -O anykernel/apk/KernelSU_Manager.apk
        echo "APK added"

    # ==================== 📁 PACKAGE KERNEL ====================
    - name: "📁 Package kernel"
      if: steps.verify.outputs.verify_status == 'success'
      run: |
        echo "Packaging kernel..."
        
        # نسخ ملفات kernel
        cp out/arch/arm64/boot/Image.gz anykernel/
        cp out/arch/arm64/boot/dtbo.img anykernel/
        
        # ✅ إنشاء ملف معلومات (بدون HEREDOC)
        echo "Kernel: ${{ env.KERNEL_NAME }}" > anykernel/build_info.txt
        echo "KSU: ${{ env.KSU_KERNEL_BRANCH }}" >> anykernel/build_info.txt
        echo "APK: ${{ env.KSU_APK_VERSION }}" >> anykernel/build_info.txt
        echo "Build: #${{ github.run_number }}" >> anykernel/build_info.txt
        echo "Commit: ${{ steps.commit_info.outputs.commit_short }}" >> anykernel/build_info.txt
        echo "Date: $(date)" >> anykernel/build_info.txt
        
        # إنشاء zip
        cd anykernel
        ZIP_NAME="xcalibur-ksu-${{ github.run_number }}.zip"
        zip -r9 "../${ZIP_NAME}" * > /dev/null
        cd ..
        
        echo "Package created: ${ZIP_NAME}"

    # ==================== 🔏 SIGN ZIP ====================
    - name: "🔏 Sign kernel zip"
      if: steps.verify.outputs.verify_status == 'success'
      run: |
        echo "Signing kernel zip..."
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar -O zipsigner.jar
        
        INPUT_ZIP="xcalibur-ksu-${{ github.run_number }}.zip"
        OUTPUT_ZIP="xcalibur-ksu-${{ github.run_number }}-signed.zip"
        
        java -jar zipsigner.jar "${INPUT_ZIP}" "${OUTPUT_ZIP}"
        
        if [ $? -eq 0 ]; then
          echo "SIGNED_ZIP=${OUTPUT_ZIP}" >> $GITHUB_ENV
          echo "Signed: ${OUTPUT_ZIP}"
        else
          echo "SIGNED_ZIP=${INPUT_ZIP}" >> $GITHUB_ENV
          echo "Using unsigned zip"
        fi

    # ==================== 📤 UPLOAD ARTIFACTS ====================
    - name: "📤 Upload artifacts"
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ github.run_number }}
        path: |
          ${{ env.SIGNED_ZIP }}
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/dtbo.img
          build.log
        retention-days: 30

    # ==================== 📋 UPLOAD LOGS ====================
    - name: "📋 Upload failure logs"
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ github.run_number }}
        path: |
          build.log
          out/.config
        retention-days: 7

    # ==================== 📊 BUILD SUMMARY ====================
    - name: "📊 Build summary"
      run: |
        echo "### 📊 Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.verify.outputs.verify_status }}" = "success" ]; then
          echo "✅ **BUILD SUCCESSFUL**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kernel:** ${{ env.KERNEL_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**KSU Branch:** ${{ env.KSU_KERNEL_BRANCH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** ${{ env.BUILD_TIME }} seconds" >> $GITHUB_STEP_SUMMARY
          echo "**Image Size:** ${{ steps.verify.outputs.image_size }}" >> $GITHUB_STEP_SUMMARY
          echo "**Output:** ${{ env.SIGNED_ZIP }}" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **BUILD FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs for details" >> $GITHUB_STEP_SUMMARY
        fi
