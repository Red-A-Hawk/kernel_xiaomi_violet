دname: Extract Single Commit Patch

on:
  push:
    branches:
      - sixteen-sukisu
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-22.04

    steps:
      - name: Print info
        run: |
          echo "Repository: https://github.com/sidex15/android_kernel_lge_sm8150.git"
          echo "Commit SHA: 87e6c1fcbd9c007b6a9e34aafdbebc86fd6590f6"

      - name: Clone empty repo and fetch commit
        run: |
          git init repo
          cd repo
          git remote add origin https://github.com/sidex15/android_kernel_lge_sm8150.git
          git fetch origin 87e6c1fcbd9c007b6a9e34aafdbebc86fd6590f6
          git checkout FETCH_HEAD

      - name: Generate patch for single commit
        run: |
          cd repo
          git format-patch -1 HEAD --stdout > commit.patch
          echo "✅ Patch generated: commit.patch"
          ls -lh commit.patch

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-commit
          path: repo/commit.patch
