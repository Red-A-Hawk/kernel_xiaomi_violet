name: Build Kernel (sixteen | Proton Clang | KernelSU Next)

on:
  workflow_dispatch:
  push:
    branches:
      - sixteen

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sixteen
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex git curl zip unzip \
          build-essential libssl-dev libelf-dev \
          python3 ccache

    # =========================
    # Proton Clang
    # =========================
    - name: Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # =========================
    # KernelSU Next v1.1.1
    # =========================
    - name: Setup KernelSU Next v1.1.1
      run: |
        curl -LSs \
        https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.1.1/kernel/setup.sh | bash

    # =========================
    # Load defconfig
    # =========================
    - name: Load defconfig
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out ARCH=arm64 vendor/violet-perf_defconfig

    # =========================
    # Enable KernelSU
    # =========================
    - name: Enable KernelSU configs
      run: |
        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK

        make O=out ARCH=arm64 olddefconfig

    # =========================
    # Build kernel (FIXED)
    # =========================
    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export O=out

        export CC=clang
        export CXX=clang++
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export STRIP=llvm-strip
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump

        export LLVM=1
        export LLVM_IAS=1

        make -j$(nproc) O=out

    # =========================
    # AnyKernel3
    # =========================
    - name: Prepare AnyKernel3
      run: |
        git clone -b sixteen https://github.com/Joker-V2/AnyKernel3.git AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi

    # =========================
    # Zip
    # =========================
    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../kernel-unsigned.zip *

    # =========================
    # Sign zip
    # =========================
    - name: Sign zip
      run: |
        curl -L -o zipsigner.jar \
        https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

        java -jar zipsigner.jar \
        kernel-unsigned.zip kernel-signed.zip

    # =========================
    # Upload
    # =========================
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-proton
        path: kernel-signed.zip
