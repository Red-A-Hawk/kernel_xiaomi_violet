name: Kernel Build (violet | sukisu | SukiSU Ultra 3.1.8)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # ======================================================
    # Checkout
    # ======================================================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sukisu

    # ======================================================
    # Free space
    # ======================================================
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    # ======================================================
    # Dependencies
    # ======================================================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make curl wget zip unzip \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 zstd \
          openjdk-17-jre-headless \
          ccache rsync

    # ======================================================
    # ccache
    # ======================================================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-sukisu-ccache
        restore-keys: violet-

    # ======================================================
    # Toolchain (WeebX Clang 20)
    # ======================================================
    - name: Setup Clang
      run: |
        wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
        mkdir -p $HOME/tc
        tar -xf WeebX-Clang-20.0.0git.tar.gz -C $HOME/tc
        rm WeebX-Clang-20.0.0git.tar.gz
        $HOME/tc/bin/clang --version

    # ======================================================
    # Build environment
    # ======================================================
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ======================================================
    # Inject SukiSU Ultra v3.1.8 (SAFE)
    # ======================================================
    - name: Inject SukiSU Ultra v3.1.8
      run: |
        set -e

        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra sukisu_ultra
        cd sukisu_ultra
        git checkout v3.1.8
        cd ..

        mkdir -p drivers/kernelsu

        rsync -a \
          --exclude=setup.sh \
          sukisu_ultra/kernel/ \
          drivers/kernelsu/

        # Guard MODULE_IMPORT_NS for old kernels
        KSU_C="drivers/kernelsu/ksu.c"
        if grep -q "MODULE_IMPORT_NS" "$KSU_C"; then
          sed -i '
            s/^MODULE_IMPORT_NS(/#if defined(MODULE_IMPORT_NS)\nMODULE_IMPORT_NS(/;
            s/);$/);\n#endif/
          ' "$KSU_C"
        fi

        grep -q "kernelsu/" drivers/Makefile || \
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

        grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

        echo "[✓] SukiSU Ultra injected"

    # ======================================================
    # Kernel config
    # ======================================================
    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    # ======================================================
    # Build kernel (VERBOSE + NEVER STOP)
    # ======================================================
    - name: Build kernel
      run: |
        set +e
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          V=1 \
          2>&1 | tee out/build.log
        echo "KERNEL_EXIT_CODE=$?" >> $GITHUB_ENV

    # ======================================================
    # AnyKernel3 (optional)
    # ======================================================
    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 AK3 || true

    - name: Copy kernel files
      run: |
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          cp out/arch/arm64/boot/Image.gz AK3/
        else
          echo "⚠ Image.gz not generated"
        fi

        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AK3/ || true

    - name: Create kernel zip
      run: |
        if [ -d AK3 ]; then
          cd AK3
          zip -r9 ../kernel-violet-sukisu.zip * || true
        fi

    # ======================================================
    # Upload logs ALWAYS
    # ======================================================
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-sukisu-debug
        path: |
          out/build.log
          kernel-violet-sukisu.zip
