name: Build Kernel (sukisu)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ===============================
      # 1) Checkout kernel source (sukisu)
      # ===============================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: sukisu
          fetch-depth: 1

      # ===============================
      # 2) Install dependencies
      # ===============================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget bc bison flex \
            build-essential ccache \
            libssl-dev libelf-dev \
            python3 zip unzip

      # ===============================
      # 3) Setup WeebX Clang (stable)
      # ===============================
      - name: Setup WeebX Clang
        run: |
          mkdir -p toolchains
          wget "$(curl -s https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt)" \
            -O toolchains/weebx-clang.tar.gz
          tar -xf toolchains/weebx-clang.tar.gz -C toolchains
          echo "PATH=$(pwd)/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
          clang --version

      # ===============================
      # 4) Inject SukiSU Ultra v3.1.8 (SAFE)
      # ===============================
      - name: Inject SukiSU Ultra v3.1.8
        run: |
          cd kernel
          chmod +x setup.sh
          ./setup.sh v3.1.8

      # ===============================
      # 5) Kernel config
      # ===============================
      - name: Load defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make vendor/violet-perf_defconfig

      # ===============================
      # 6) Build kernel
      # ===============================
      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make -j$(nproc) 2>&1 | tee build.log

      # ===============================
      # 7) AnyKernel3 packaging
      # ===============================
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 kernel-unsigned.zip ./*

      # ===============================
      # 8) ZipSigner
      # ===============================
      - name: Sign zip
        run: |
          wget https://github.com/VR-25/ZipSigner/releases/download/v3.0/zipsigner-3.0.jar
          java -jar zipsigner-3.0.jar \
            AnyKernel3/kernel-unsigned.zip \
            kernel-sukisu-signed.zip

      # ===============================
      # 9) Upload artifacts
      # ===============================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-build
          path: |
            kernel-sukisu-signed.zip
            build.log
