name: Build Kernel (Clean + Debuggable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      KSU_DISABLE_SELINUX: 1
      KCFLAGS: "-Wno-error"

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex git ccache \
          libssl-dev libelf-dev \
          clang lld llvm \
          dwarves python3

    - name: Inject SukiSU Ultra v3.1.8 (SELinux disabled)
      run: |
        set -e
        git clone https://github.com/SukiSU-Ultra/KernelSU.git sukisu_ultra
        cd sukisu_ultra
        git checkout v3.1.8
        cd ..
        export KSU_DISABLE_SELINUX=1
        bash sukisu_ultra/kernel/setup.sh

    - name: Configure kernel
      run: |
        mkdir -p out
        make O=out ARCH=arm64 vendor/violet-perf_defconfig

    - name: Build kernel
      run: |
        set -o pipefail
        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          V=1 \
          2>&1 | tee out/build.log

    - name: Extract first error (if any)
      run: |
        echo "==== FIRST ERROR ===="
        grep -n -i -m1 "error:" out/build.log || echo "No errors found"

    - name: Extract KernelSU logs only
      run: |
        grep -R "kernelsu" out/build.log > out/kernelsu.log || true

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: kernel-logs
        path: |
          out/build.log
          out/kernelsu.log
