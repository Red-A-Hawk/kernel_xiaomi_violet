name: Kernel Build (violet | sukisu | SukiSU Ultra 3.1.8)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # ======================================================
    # Checkout
    # ======================================================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sukisu

    # ======================================================
    # Free space
    # ======================================================
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    # ======================================================
    # Dependencies
    # ======================================================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make curl wget zip unzip \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 zstd \
          openjdk-17-jre-headless \
          ccache rsync

    # ======================================================
    # ccache
    # ======================================================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-sukisu-ccache
        restore-keys: violet-

    # ======================================================
    # Toolchain
    # ======================================================
    - name: Setup Clang (WeebX 20)
      run: |
        wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
        mkdir -p $HOME/tc
        tar -xf WeebX-Clang-20.0.0git.tar.gz -C $HOME/tc
        rm WeebX-Clang-20.0.0git.tar.gz
        $HOME/tc/bin/clang --version

    # ======================================================
    # Build environment
    # ======================================================
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ======================================================
    # Inject SukiSU Ultra 3.1.8 (SAFE for 4.14)
    # ======================================================
    - name: Inject SukiSU Ultra v3.1.8
      run: |
        set -e

        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra sukisu_ultra
        cd sukisu_ultra
        git checkout v3.1.8
        cd ..

        mkdir -p drivers/kernelsu
        rsync -a sukisu_ultra/kernel/ drivers/kernelsu/

        # ---- Fix MODULE_IMPORT_NS ----
        sed -i 's/^MODULE_IMPORT_NS(/\/\/ MODULE_IMPORT_NS(/' \
          drivers/kernelsu/ksu.c || true

        # ---- Fix SELinux audit crash (4.14) ----
        SELINUX_FILE="security/selinux/ss/services.c"
        if grep -q "audit_update_lsm_rules" "$SELINUX_FILE"; then
          sed -i 's/int audit_update_lsm_rules.*/int audit_update_lsm_rules(void) { return 0; }/' \
            "$SELINUX_FILE"
        fi

        # ---- Register KernelSU ----
        grep -q "kernelsu" drivers/Makefile || \
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

        grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

        echo "[✓] SukiSU Ultra injected safely"

    # ======================================================
    # Kernel config
    # ======================================================
    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    # ======================================================
    # Build kernel (READABLE LOG)
    # ======================================================
    - name: Build kernel
      run: |
        set +e
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          2>&1 | tee out/build.log

        echo ""
        echo "========== BUILD ERRORS =========="
        grep -n -E "error:|undefined reference|redefinition|No rule to make target" out/build.log || true
        echo "=================================="

    # ======================================================
    # Upload log ALWAYS
    # ======================================================
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: out/build.log
