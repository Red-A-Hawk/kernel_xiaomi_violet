name: Kernel Build & Flash Test (violet | SukiSU | git-apply)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make curl wget zip unzip \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 zstd \
          openjdk-17-jre-headless \
          ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-sukisu-ccache
        restore-keys: violet-

    - name: Setup Clang 22
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        mkdir -p $HOME/tc
        tar -xf Clang-22.0.0git-20250920.tar.gz -C $HOME/tc
        rm Clang-22.0.0git-20250920.tar.gz
        $HOME/tc/bin/clang --version

    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ======================================================
    # SukiSU Ultra builtin (بدون لمس)
    # ======================================================
    - name: Inject SukiSU Ultra builtin
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin
        echo "SukiSU Ultra builtin injected"

    # ======================================================
    # EXTRA PATCHES — git apply (NON-FATAL)
    # ======================================================
    - name: Apply extra patches after SukiSU Ultra builtin
      shell: bash
      continue-on-error: true
      run: |
        set +e
        set +o pipefail

        PATCH_DIR=patches
        LOG_FILE=patch-summary.log

        mkdir -p "$PATCH_DIR"
        rm -f "$LOG_FILE"

        # Download patches
        wget -q -O "$PATCH_DIR/manual_hooks.patch" \
          https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/manual_hooks.patch

        wget -q -O "$PATCH_DIR/susfs-2.0.0.patch" \
          https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/susfs-2.0.0.patch

        TOTAL=0
        APPLIED=0
        SKIPPED=0
        FAILED=0

        {
          echo "========================================"
          echo "   EXTRA PATCHES SUMMARY (git apply)"
          echo "========================================"
          printf "%-35s | STATUS\n" "PATCH"
          echo "----------------------------------------"
        } | tee -a "$LOG_FILE"

        for PATCH in "$PATCH_DIR"/*.patch; do
          NAME=$(basename "$PATCH")
          TOTAL=$((TOTAL+1))

          git apply --check "$PATCH" >>"$LOG_FILE" 2>&1
          CHECK_RET=$?

          if [ $CHECK_RET -eq 0 ]; then
            git apply "$PATCH" >>"$LOG_FILE" 2>&1
            printf "%-35s | APPLIED\n" "$NAME" | tee -a "$LOG_FILE"
            APPLIED=$((APPLIED+1))
          else
            git apply --reverse --check "$PATCH" >>"$LOG_FILE" 2>&1
            REV_RET=$?

            if [ $REV_RET -eq 0 ]; then
              printf "%-35s | SKIPPED\n" "$NAME" | tee -a "$LOG_FILE"
              SKIPPED=$((SKIPPED+1))
            else
              printf "%-35s | FAILED\n" "$NAME" | tee -a "$LOG_FILE"
              FAILED=$((FAILED+1))
            fi
          fi
        done

        {
          echo "----------------------------------------"
          printf "%-20s %d\n" "Total:"   "$TOTAL"
          printf "%-20s %d\n" "Applied:" "$APPLIED"
          printf "%-20s %d\n" "Skipped:" "$SKIPPED"
          printf "%-20s %d\n" "Failed:"  "$FAILED"
          echo "----------------------------------------"
        } | tee -a "$LOG_FILE"

    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          2>&1 | tee out/build.log

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 AK3

    - name: Copy kernel files
      run: |
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/

    - name: Create kernel zip
      run: |
        cd AK3
        zip -r9 ../kernel-violet-sukisu-ultra.zip *

    - name: Download zipsigner
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    - name: Sign kernel zip
      run: |
        java -jar zipsigner-3.0-dexed.jar \
          kernel-violet-sukisu-ultra.zip \
          kernel-violet-sukisu-ultra-signed.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-sukisu-ultra
        path: |
          kernel-violet-sukisu-ultra-signed.zip
          patch-summary.log
          out/build.log
