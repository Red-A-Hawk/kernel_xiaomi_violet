name: Kernel Build & Flash Test (violet | Sukisu | WeebX-Clang20)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # ▼ Checkout kernel source (فرع sukisu)
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sukisu
        fetch-depth: 1

    # ▼ Free disk space
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    # ▼ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          build-essential make curl wget zip unzip \
          libelf-dev libncurses-dev \
          python3 zstd \
          openjdk-17-jre-headless \
          ccache

    # ▼ Cache ccache
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-weebx-clang20-ccache
        restore-keys: violet-

    # ▼ Setup WeebX-Clang-20
    - name: Setup WeebX-Clang-20
      run: |
        wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
        mkdir -p $HOME/tc
        tar -xf WeebX-Clang-20.0.0git.tar.gz -C $HOME/tc
        rm WeebX-Clang-20.0.0git.tar.gz
        $HOME/tc/bin/clang --version

    # ▼ Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ▼ Inject SukiSU Ultra v3.1.8 (controlled setup.sh)
    - name: Inject SukiSU Ultra v3.1.8 (LOCKED)
      run: |
        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
        cd KernelSU

        # تثبيت الإصدار المطلوب
        git checkout v3.1.8

        # تعطيل أي تحديث أو قفز داخل setup.sh
        sed -i 's/git pull/echo "[skip] git pull"/g' kernel/setup.sh
        sed -i 's/git checkout "$(git describe --abbrev=0 --tags)"/echo "[skip] auto tag checkout"/g' kernel/setup.sh
        sed -i 's/git checkout "$1"/echo "[skip] arg checkout"/g' kernel/setup.sh

        cd ..
        bash KernelSU/kernel/setup.sh

    # ▼ Check: تأكيد أن الإصدار لم يقفز
    - name: Verify SukiSU version (MUST be 3.1.8)
      run: |
        cd KernelSU
        echo "Current SukiSU HEAD:"
        git describe --tags || true
        git status --short
        cd ..

        if git -C KernelSU describe --tags | grep -qv "v3.1.8"; then
          echo "❌ ERROR: SukiSU version is NOT v3.1.8"
          exit 1
        else
          echo "✅ SukiSU Ultra v3.1.8 confirmed"
        fi

    # ▼ Configure kernel
    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

        echo "Checking KernelSU config:"
        grep CONFIG_KSU out/.config || echo "⚠️ CONFIG_KSU not found (check defconfig)"

    # ▼ Build kernel
    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          2>&1 | tee out/build.log

    # ▼ Clone AnyKernel3
    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 AK3

    # ▼ Copy kernel artifacts
    - name: Copy kernel files
      run: |
        cp out/arch/arm64/boot/Image.gz AK3/ || true
        cp out/arch/arm64/boot/dtbo.img AK3/ || true

    # ▼ Create kernel zip
    - name: Create kernel zip
      run: |
        cd AK3
        zip -r9 ../kernel-violet-sukisu.zip *

    # ▼ Download ZipSigner
    - name: Download zipsigner
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    # ▼ Sign kernel zip
    - name: Sign kernel zip
      run: |
        java -jar zipsigner-3.0-dexed.jar \
          kernel-violet-sukisu.zip \
          kernel-violet-sukisu-signed.zip

    # ▼ Upload artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-sukisu
        path: |
          kernel-violet-sukisu-signed.zip
          out/build.log
