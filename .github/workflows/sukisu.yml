name: Kernel Build (violet | sukisu | SukiSU Ultra 3.1.8)

on:
  workflow_dispatch:
  push:
    branches: [ sukisu ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        ref: sukisu

    - name: Free space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev make \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 zip unzip rsync ccache

    - name: Setup WeebX Clang
      run: |
        wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
        mkdir -p $HOME/tc
        tar -xf WeebX-Clang-20.0.0git.tar.gz -C $HOME/tc
        echo "$HOME/tc/bin" >> $GITHUB_PATH
        clang --version

    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    - name: Inject SukiSU Ultra 3.1.8
      run: |
        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra sukisu
        cd sukisu && git checkout v3.1.8 && cd ..
        mkdir -p drivers/kernelsu
        rsync -a sukisu/kernel/ drivers/kernelsu/

        sed -i 's/^MODULE_IMPORT_NS(/\/\/ MODULE_IMPORT_NS(/' drivers/kernelsu/ksu.c || true

        grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        grep -q drivers/kernelsu/Kconfig drivers/Kconfig || \
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

    - name: Configure
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    - name: Build (verbose)
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          V=1 2>&1 | tee out/build.log

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: out/build.log
