name: Build Kernel (SukiSU Ultra)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    # ===============================
    # Install dependencies
    # ===============================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex ccache \
          libssl-dev libelf-dev \
          python3 unzip make \
          build-essential

    # ===============================
    # Setup WeebX Clang 20 (REAL)
    # ===============================
    - name: Setup WeebX Clang 20
      run: |
        mkdir -p $HOME/tc
        cd $HOME/tc
        wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
        tar -xf WeebX-Clang-20.0.0git.tar.gz
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # ===============================
    # Verify clang (critical)
    # ===============================
    - name: Verify clang
      run: |
        which clang
        clang --version
        if ! clang --version | grep -q "clang version 20"; then
          echo "❌ Wrong clang detected"
          exit 1
        fi

    # ===============================
    # Inject SukiSU Ultra v3.1.8
    # SELinux disabled (Non-GKI 4.14)
    # ===============================
    - name: Inject SukiSU Ultra v3.1.8
      run: |
        set -e

        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra sukisu_ultra
        cd sukisu_ultra
        git checkout v3.1.8
        cd ..

        mkdir -p drivers/kernelsu
        cp -r sukisu_ultra/kernel/* drivers/kernelsu/

        # Disable SELinux integration (fix redefinition error)
        rm -rf drivers/kernelsu/selinux

        # Patch Makefile
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        fi

        # Patch Kconfig
        if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        fi

        echo "[✓] KernelSU Ultra 3.1.8 injected (SELinux disabled)"

    # ===============================
    # Kernel config
    # ===============================
    - name: Configure kernel
      run: |
        mkdir -p out
        make O=out ARCH=arm64 vendor/violet-perf_defconfig

        scripts/config --file out/.config \
          -e CONFIG_KSU \
          -d CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KPROBES

        make O=out ARCH=arm64 olddefconfig

    # ===============================
    # Build kernel + smart logs
    # ===============================
    - name: Build kernel
      run: |
        set +e
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          V=1 \
          2>&1 | tee out/build.log

        # Extract first error
        grep -m1 -n "error:" out/build.log || true

        # KernelSU-only log
        grep -n "kernelsu" out/build.log > out/kernelsu.log || true

        # Fail job if build failed
        if grep -q "error:" out/build.log; then
          echo "❌ Build failed"
          exit 1
        fi

    # ===============================
    # Upload logs
    # ===============================
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: out/*.log
