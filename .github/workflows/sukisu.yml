name: Kernel Build (violet | sukisu | SukiSU 3.1.8)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sukisu

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make curl wget zip unzip \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 zstd \
          openjdk-17-jre-headless \
          ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-sukisu-ccache
        restore-keys: violet-

    - name: Setup Clang 22 (git)
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz
        mkdir -p $HOME/tc
        tar -xf Clang-22.0.0git-20250928.tar.gz -C $HOME/tc
        rm Clang-22.0.0git-20250928.tar.gz
        $HOME/tc/bin/clang --version

    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ======================================================
    # SukiSU Ultra v3.1.8 ONLY
    # ======================================================
    - name: Inject SukiSU Ultra v3.1.8 (builtin)
      run: |
        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
        cd KernelSU
        git checkout v3.1.8
        cd ..
        bash KernelSU/kernel/setup.sh builtin

    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          2>&1 | tee out/build.log

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 AK3

    - name: Copy kernel files
      run: |
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/

    - name: Create kernel zip
      run: |
        cd AK3
        zip -r9 ../kernel-violet-sukisu.zip *

    - name: Download zipsigner
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    - name: Sign kernel zip
      run: |
        java -jar zipsigner-3.0-dexed.jar \
          kernel-violet-sukisu.zip \
          kernel-violet-sukisu-signed.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-sukisu
        path: |
          kernel-violet-sukisu-signed.zip
          out/build.log
