name: Build Kernel with SukiSU Ultra

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex cpio \
            build-essential \
            libssl-dev \
            libelf-dev \
            git wget curl \
            python3

      # ================================
      # SukiSU Ultra builtin
      # ================================
      - name: Inject SukiSU Ultra builtin hooks
        run: |
          echo "Injecting SukiSU Ultra builtin hooks..."
          # هنا سكريبتك الأصلي الخاص بـ SukiSU Ultra
          # (لم أغيره)

      # ================================
      # Extra patches (NON-FATAL)
      # ================================
      - name: Apply extra patches after SukiSU Ultra builtin
        shell: bash
        continue-on-error: true
        run: |
          set +e
          set +o pipefail

          PATCH_DIR=patches
          LOG_FILE=patch-summary.log

          mkdir -p "$PATCH_DIR"
          rm -f "$LOG_FILE"

          # Download patches
          wget -q -O "$PATCH_DIR/scope-min-hooks.patch" \
            https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/scope-min-hooks-v1.6.patch

          wget -q -O "$PATCH_DIR/susfs.patch" \
            https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/susfs-1.5.12.patch

          wget -q -O "$PATCH_DIR/umount_manager.patch" \
            https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/SukiSU/umount_manager-fix.patch

          TOTAL=0
          APPLIED=0
          FAILED=0
          SKIPPED=0

          echo "========================================" | tee -a "$LOG_FILE"
          echo "   EXTRA PATCHES SUMMARY (NON-FATAL)"     | tee -a "$LOG_FILE"
          echo "========================================" | tee -a "$LOG_FILE"
          echo "" | tee -a "$LOG_FILE"

          for PATCH in "$PATCH_DIR"/*.patch; do
            TOTAL=$((TOTAL+1))
            NAME=$(basename "$PATCH")

            echo "Applying: $NAME" | tee -a "$LOG_FILE"

            patch -p1 -N < "$PATCH" >>"$LOG_FILE" 2>&1
            RET=$?

            if [ $RET -eq 0 ]; then
              echo "  ✔ APPLIED" | tee -a "$LOG_FILE"
              APPLIED=$((APPLIED+1))
            else
              if grep -q -E "Reversed|previously applied|Skipping patch|already exists" "$LOG_FILE"; then
                echo "  ↷ SKIPPED" | tee -a "$LOG_FILE"
                SKIPPED=$((SKIPPED+1))
              else
                echo "  ✖ FAILED" | tee -a "$LOG_FILE"
                FAILED=$((FAILED+1))
              fi
            fi

            echo "" | tee -a "$LOG_FILE"
          done

          echo "----------------------------------------" | tee -a "$LOG_FILE"
          printf "%-20s %s\n" "Total patches:"   "$TOTAL"   | tee -a "$LOG_FILE"
          printf "%-20s %s\n" "Applied:"         "$APPLIED" | tee -a "$LOG_FILE"
          printf "%-20s %s\n" "Skipped:"         "$SKIPPED" | tee -a "$LOG_FILE"
          printf "%-20s %s\n" "Failed:"          "$FAILED"  | tee -a "$LOG_FILE"
          echo "----------------------------------------" | tee -a "$LOG_FILE"

          echo ""
          echo ">>> Patch process completed (build will continue)"

      # ================================
      # Configure kernel
      # ================================
      - name: Configure kernel
        run: |
          make ARCH=arm64 vendor/violet-perf_defconfig

      # ================================
      # Build kernel
      # ================================
      - name: Build kernel
        run: |
          make -j$(nproc) ARCH=arm64

      # ================================
      # Upload patch summary (optional)
      # ================================
      - name: Upload patch summary log
        uses: actions/upload-artifact@v4
        with:
          name: patch-summary
          path: patch-summary.log
