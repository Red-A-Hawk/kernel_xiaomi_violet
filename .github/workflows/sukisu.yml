name: Build SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source (sukisu branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: sukisu   # ✅ الفرع الصحيح

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex g++ gcc git \
            libelf-dev libssl-dev make python3 unzip zip \
            dwarves openjdk-11-jre

      - name: Download WeebX Clang
        run: |
          wget "$(curl -s https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt)" \
            -O weebx-clang.tar.gz
          mkdir clang
          tar -xf weebx-clang.tar.gz -C clang

      - name: Export Clang environment
        run: |
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Setup SukiSU
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU/main/kernel/setup.sh | bash -

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out vendor/violet-perf_defconfig
          make -j$(nproc) O=out 2>&1 | tee build.log

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git

      - name: Prepare AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

      - name: Create zip
        run: |
          cd AnyKernel3
          zip -r ../SukiSU.zip *

      - name: Sign zip (ZipSigner)
        run: |
          wget https://github.com/PatrickF1/zip-signer/releases/download/v1.1/zipsigner.jar
          java -jar zipsigner.jar SukiSU.zip SukiSU-signed.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Build
          path: |
            SukiSU-signed.zip
            build.log
