name: Kernel Build (violet | sukisu | SukiSU Ultra 3.1.8 LOCKED)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # ===============================
    # Checkout kernel source
    # ===============================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sukisu
        fetch-depth: 1

    # ===============================
    # Free disk space
    # ===============================
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    # ===============================
    # Install dependencies
    # ===============================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          build-essential make curl wget zip unzip \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          python3 zstd openjdk-17-jre-headless ccache

    # ===============================
    # Cache ccache
    # ===============================
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-sukisu-ccache
        restore-keys: violet-

    # ===============================
    # Setup Clang
    # ===============================
    - name: Setup Clang
      run: |
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250928-release/Clang-22.0.0git-20250928.tar.gz
        mkdir -p $HOME/tc
        tar -xf Clang-22.0.0git-20250928.tar.gz -C $HOME/tc
        rm Clang-22.0.0git-20250928.tar.gz
        $HOME/tc/bin/clang --version

    # ===============================
    # Export build environment
    # ===============================
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # ==================================================
    # Inject SukiSU Ultra v3.1.8 (MANUAL + CHECKED)
    # ==================================================
    - name: Inject SukiSU Ultra v3.1.8 (LOCKED)
      run: |
        set -e

        git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra sukisu_ultra
        cd sukisu_ultra
        git checkout v3.1.8

        echo "[+] Verified tag:"
        git describe --tags

        cd ..

        # ---- drivers/kernelsu ----
        if [ -d "sukisu_ultra/kernel/drivers/kernelsu" ]; then
          echo "[+] Copying drivers/kernelsu"
          cp -r sukisu_ultra/kernel/drivers/kernelsu drivers/
        else
          echo "[ERROR] drivers/kernelsu not found"
          exit 1
        fi

        # ---- security ----
        if [ -d "sukisu_ultra/kernel/security" ]; then
          echo "[+] Copying security"
          cp -r sukisu_ultra/kernel/security .
        else
          echo "[*] security not present, skipping"
        fi

        # ---- selinux ----
        if [ -d "sukisu_ultra/kernel/selinux" ]; then
          echo "[+] Copying selinux"
          cp -r sukisu_ultra/kernel/selinux .
        else
          echo "[*] selinux not present, skipping"
        fi

        # ---- Makefile hook ----
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          echo "[+] drivers/Makefile patched"
        fi

        # ---- Kconfig hook ----
        if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "[+] drivers/Kconfig patched"
        fi

    # ===============================
    # Configure kernel
    # ===============================
    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    # ===============================
    # Build kernel
    # ===============================
    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          2>&1 | tee out/build.log

    # ===============================
    # Package with AnyKernel3
    # ===============================
    - name: Clone AnyKernel3
      run: git clone https://github.com/Joker-V2/AnyKernel3 AK3

    - name: Copy kernel artifacts
      run: |
        cp out/arch/arm64/boot/Image.gz AK3/ || true
        cp out/arch/arm64/boot/dtbo.img AK3/ || true

    - name: Create kernel zip
      run: |
        cd AK3
        zip -r9 ../kernel-violet-sukisu.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-sukisu
        path: |
          kernel-violet-sukisu.zip
          out/build.log
