name: Kernel Build (violet | sukisu | SukiSU 3.1.8 LOCKED)

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # =========================
    # Checkout
    # =========================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: sukisu
        fetch-depth: 1

    # =========================
    # Free space
    # =========================
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -af
        df -h

    # =========================
    # Dependencies
    # =========================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          build-essential make curl wget zip unzip \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          python3 zstd openjdk-17-jre-headless ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: violet-sukisu-ccache
        restore-keys: violet-

    # =========================
    # Toolchain (WeebX-Clang 20)
    # =========================
    - name: Setup WeebX-Clang 20
      run: |
        wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
        mkdir -p $HOME/tc
        tar -xf WeebX-Clang-20.0.0git.tar.gz -C $HOME/tc
        rm WeebX-Clang-20.0.0git.tar.gz
        $HOME/tc/bin/clang --version

    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$HOME/tc/bin:$PATH" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # =========================
    # Inject SukiSU Ultra 3.1.8 (NO setup.sh)
    # =========================
    - name: Inject SukiSU Ultra v3.1.8 (MANUAL)
      run: |
        git clone --depth=1 --branch v3.1.8 https://github.com/SukiSU-Ultra/SukiSU-Ultra sukisu_ultra

        echo "[+] Copy drivers/kernelsu"
        cp -r sukisu_ultra/kernel drivers/kernelsu

        echo "[+] Inject fs / security / selinux"
        for d in fs security selinux; do
          if [ -d "sukisu_ultra/kernel/$d" ]; then
            echo "  -> $d"
            cp -rn sukisu_ultra/kernel/$d/* $d/
          fi
        done

    # =========================
    # Configure kernel
    # =========================
    - name: Configure kernel
      run: |
        make O=out vendor/violet-perf_defconfig
        make O=out olddefconfig

    # =========================
    # Build
    # =========================
    - name: Build kernel
      run: |
        make -j$(nproc) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          KCFLAGS="-Wno-error" \
          2>&1 | tee out/build.log

    # =========================
    # AnyKernel3
    # =========================
    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/Joker-V2/AnyKernel3 AK3

    - name: Copy kernel artifacts
      run: |
        cp out/arch/arm64/boot/Image.gz AK3/ || true
        cp out/arch/arm64/boot/dtbo.img AK3/ || true

    - name: Create kernel zip
      run: |
        cd AK3
        zip -r9 ../kernel-violet-sukisu.zip *

    # =========================
    # Sign zip
    # =========================
    - name: Download zipsigner
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar

    - name: Sign kernel zip
      run: |
        java -jar zipsigner-3.0-dexed.jar \
          kernel-violet-sukisu.zip \
          kernel-violet-sukisu-signed.zip

    # =========================
    # Upload
    # =========================
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-sukisu
        path: |
          kernel-violet-sukisu-signed.zip
          out/build.log
